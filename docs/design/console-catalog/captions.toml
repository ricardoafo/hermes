# Captions for the console catalog (issue #851), one per snapshot view.
#
# The key is "<test module>/<view>": the snapshot's folder under
# tests/unit/entrypoints/__snapshots__ and its file name without the theme
# and size. scripts/dev/console-catalog.py builds the page from the SVGs and
# these captions, and fails when a snapshot has no caption.
#
# Fields: screen (one of the catalog's screens), state, means (what the state
# is), check (what to look at when validating a deploy). Optional: scenario
# and keys (to open it with `hermes --demo <scenario> tui`), or demo (any
# other way to open it). A caption for a view that is not in the build yet
# (an open PR's) is allowed and shows nowhere until its snapshots land.

[views."test_tui_snapshots/home_ok"]
screen = "Home"
state = "Two open positions, everything OK"
means = "hermes is live, the last bar was checked on time, two positions are open and the money is valued at the last bar close."
check = "The big total is one bright colour with the gradient on the underline only; up is blue and down orange; both positions show trend, net and stop room; the live dot is cyan."
scenario = "ok-two-positions"

[views."test_tui_snapshots/home_empty"]
screen = "Home"
state = "No positions yet"
means = "hermes is live and watching, with nothing open: the first days of a run."
check = "The Positions panel shows the radar, the coins hermes watches and when it looks again; no empty table, no zero rows."
scenario = "empty"

[views."test_tui_snapshots/home_live"]
screen = "Home"
state = "Live prices flowing between bars"
means = "The market watch and an open position are valued from live public prices between bar closes, and the window bar's feed pulse shows a run of polls with one failure."
check = "Live figures are marked live; a failed poll shows on the pulse without hiding the last good price."
scenario = "ok-two-positions"

[views."test_tui_snapshots/notice_new_version"]
screen = "Home"
state = "New version deployed"
means = "The release changed while the console was open: it still runs the old code until it restarts, and R restarts it onto the new one."
check = "An amber row under the status row reads \"new version deployed · press R to restart\" and shows on every tab; the release label names the new version."
demo = "Open `hermes tui` on the VPS, deploy a new release, and wait one 5 s refresh."

[views."test_tui_snapshots/tab2_placeholder"]
screen = "Signals"
state = "Not built yet"
means = "Tab 2 before the Signals screen existed: a placeholder naming its issue."
check = "The placeholder names the right issue and the tab bar marks tab 2."
scenario = "ok-two-positions"
keys = "2"

[views."test_tui_snapshots/tab3_placeholder"]
screen = "Positions"
state = "Not built yet"
means = "Tab 3 while the Positions screen is not built: a placeholder naming its issue."
check = "The placeholder names the right issue and the tab bar marks tab 3."
scenario = "ok-two-positions"
keys = "3"

[views."test_tui_snapshots/theme_picker"]
screen = "Theme picker"
state = "Theme picker open over Home"
means = "T opens the picker for Neon, Control room and Auto (night from 23:00 to 08:00)."
check = "The current theme is marked; the picker sits over Home without hiding the window bar."
scenario = "ok-two-positions"
keys = "T"

[views."test_tui/test_svg_snapshot"]
screen = "Home"
state = "Two positions in the default theme (120x36 with the detail pane open)"
means = "The same Home as above in the default theme; at 120x36 Enter has opened the selected position's detail beside the list."
check = "The detail pane shows entry, now, stop, net and the timeline of the selected position; nothing overlaps."
scenario = "ok-two-positions"

[views."test_tui/test_svg_snapshot_down"]
screen = "Home"
state = "hermes is down"
means = "The bar loop stopped answering: the status row turns red and every figure is frozen at its last value."
check = "The red row says since when and what to press; money is dimmed and marked stale, never shown as current."
scenario = "down-stale"

[views."test_tui_home_screen/test_svg_snapshot_empty"]
screen = "Home"
state = "No positions yet, default theme"
means = "The empty demo scenario in the default theme at each breakpoint."
check = "Same as the Neon empty state: radar, watched coins, next check."
scenario = "empty"

[views."test_tui_home_screen/test_svg_snapshot_empty_live_ledger"]
screen = "Home"
state = "A fresh ledger with nothing in it"
means = "The console reading a real ledger that serve has just created: no trades, no seed yet."
check = "Every card says what is not there yet instead of showing zeros or errors."
demo = "hermes tui --db <a new, empty ledger>"

[views."test_tui_live_screen/test_svg_snapshot_live"]
screen = "Home"
state = "Live prices, default theme"
means = "Home after two fake ticks from the live price feed, at each breakpoint."
check = "Prices and position values move with the ticks and are marked live."
scenario = "ok-two-positions"

[views."test_tui_briefs/briefs"]
screen = "Briefs"
state = "Today's daily brief"
means = "The supervisor desk's daily brief, as published through its output gate, beside the list of briefs."
check = "Every item has its citations; the footer says the desk never sees profit, equity or prices; no price or money figure anywhere."
scenario = "ok-two-positions"
keys = "6"

[views."test_tui_signals/signals"]
screen = "Signals"
state = "A week of bar checks with one signal"
means = "One square per 4h bar check per coin, coloured by how many entry rules held, the last check's rules as yes or no, the week's counts and the frozen rules."
check = "Rules show as yes or no only, never a price or how close a rule came; held coins read holding; the only diamond is the bar the position opened on."
scenario = "ok-two-positions"
keys = "2"

[views."test_tui_query_snapshots/query_activity"]
screen = "Parts"
state = "The shared query bar on the activity list"
means = "The reusable query, facet and sort bar with since:2d typed, over synthetic activity."
check = "The query, facet counts and sort read clearly in both themes; the list under it follows the query."
demo = "the activity list with since:2d typed into the query bar"

[views."test_tui_logo_snapshots/logo_wordmark"]
screen = "Parts"
state = "The wordmark where images are not drawn"
means = "The text logo the console falls back to on terminals without image support."
check = "Neon uses the brand gradient, Control room plain cyan; the letters stay legible at every width."
demo = "any console on a terminal without image support"

[views."test_tui_positions/positions"]
screen = "Positions"
state = "Two open positions, the first selected"
means = "The open positions with the selected one's detail beside them (under them on narrow screens): why it opened, the stop, the money if sold now, the price since entry and the timeline."
check = "Rows and detail match Home's for the same coin; the selected row has the cursor; up and down move it and the detail follows."
scenario = "ok-two-positions"
keys = "3"

[views."test_tui_drill_snapshots/drill_position"]
screen = "Positions"
state = "Drill-down on the first position"
means = "Enter on a position opens its detail: why it opened, the stop, the money if sold now, the price since entry and the timeline."
check = "The detail matches the Positions row it came from; Esc goes back; the live price in the detail agrees with the ticker."
scenario = "ok-two-positions"
keys = "3 enter"

[views."test_tui_drill_snapshots/drill_breadcrumb"]
screen = "Positions"
state = "Detail screen with its breadcrumb"
means = "On a narrow console Enter pushes the detail as its own screen, and the breadcrumb shows the trail back to the list."
check = "The breadcrumb names every level from Home to the coin; Esc steps back one level."
scenario = "ok-two-positions"
keys = "3 enter"

[views."test_tui_topbar_snapshots/topbar"]
screen = "Home"
state = "Top bar on a demo console"
means = "The top bar of a console on demo data: the mainnet badge reads off, the version and release line, the next-bar countdown and its meter half full."
check = "Mainnet reads off; the version line shortens before the heartbeat does; the meter fills with the time since the last bar check."
scenario = "ok-two-positions"

[views."test_tui_topbar_snapshots/topbar_on"]
screen = "Home"
state = "Top bar, mainnet on"
means = "A live console whose config says allow_mainnet is on: the badge says so."
check = "The mainnet badge reads on and is impossible to miss; the heartbeat stays whole."
demo = "Not reachable from demo data (a demo scenario always reads mainnet off); check it on a live console."

[views."test_tui_topbar_snapshots/topbar_unknown"]
screen = "Home"
state = "Top bar, mainnet state unknown"
means = "A live console that could not read its config: the badge shows mainnet ? instead of guessing."
check = "The badge reads mainnet ? and never off; the rest of the bar is unchanged."
demo = "Not reachable from demo data; check it on a live console with an unreadable config."

[views."test_tui_snapshots/shadow_counting"]
screen = "Shadow test"
state = "Counting from a day-0 record"
means = "The 90-day run has started: the big day figure, the share of the run behind it, the five certification checks, the day-0 record with the Ready rules as they stood and the frozen settings."
check = "Day 12 of 90 matches the day-0 record; each check shows pass, fail or pending with its reason; rules the console cannot read say confirm by hand."
scenario = "ok-two-positions"
keys = "5"

[views."test_tui_snapshots/shadow_warmup"]
screen = "Shadow test"
state = "Warm-up, no day-0 record yet"
means = "No day 0 exists yet: the screen says warm-up days do not count, the checks wait for day 0 and the record says it is missing."
check = "The 90-day figure reads not counting, not 0 of 90; the way to start the run is named."
scenario = "empty"
keys = "5"
