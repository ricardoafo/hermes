# Docker Compose config for a self-hosted GitHub Actions runner.
#
# One image (gh-runner:latest), one container per target repo. Compose
# project name (the parent directory name) namespaces the volumes, so
# multiple runners on the same host don't collide.
#
# 24/7 pattern: `docker compose up -d` once, then forget. `restart:
# unless-stopped` keeps the runner alive across Docker Desktop restarts
# and PC reboots. When the PC sleeps, the runner sleeps; when the PC
# wakes, so does the runner. No manual intervention per session.
#
# Job lifecycle: --ephemeral flag makes the runner process ONE job then
# exit cleanly. Docker's restart policy respawns the container, which
# fetches a fresh registration token (via PAT) and re-registers. Result:
# every job runs in a fresh container with clean state, while the
# outward-facing runner is always available.
#
# Scaling: `docker compose up -d --scale runner=N` runs N runners in
# parallel (each fetches its own token). Or add another stack with
# `COMPOSE_PROJECT_NAME=gh-runner-hermes-2 docker compose up -d` for
# full isolation.

services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNNER_VERSION: '2.337.0'
    image: gh-runner:latest
    # No container_name — compose auto-names replicas gh-runner-runner-N
    # so `--scale runner=N` works. Runners identify themselves in the
    # GH runners list by RUNNER_NAME (hostname is a docker-generated
    # unique hex, so replicas get unique names).
    #
    # 4 replicas x 4 CPUs x 3 GB: sized to Docker Desktop's VM (16 CPUs,
    # 14.6 GB). Each replica runs one PR's whole CI job, so a fifth PR
    # queues first come, first served. 8 x 4 CPU x 4 GB asked for 32 CPUs
    # and 32 GB; under load the runners fought over the VM and the unit
    # step took 188 s median against 87 s on an idle machine (#523).
    # Override at the CLI with `--scale runner=N` for troubleshooting
    # (e.g. `--scale runner=1` to isolate a flaky job).
    # Persists across `docker compose up -d --build`, unlike the CLI
    # --scale flag which reverts to 1 the next time it's omitted.
    scale: 4
    #
    # 24/7 lifecycle: auto-restart on Docker Desktop startup, on PC
    # reboot, and after each --ephemeral job completes. `unless-stopped`
    # respects manual `docker stop` (won't restart until manually started
    # again — deliberate off-switch for troubleshooting).
    restart: unless-stopped
    environment:
      # Repository (default: hermes; override RUNNER_REPOSITORY to serve
      # a different repo from the same image)
      RUNNER_REPOSITORY: ${RUNNER_REPOSITORY:-ricardoafo/hermes}
      # Auth: HERMES_RUNNER_REGISTRATION_PAT is REQUIRED for the 24/7 pattern.
      # Each container restart (after --ephemeral exit) needs a fresh
      # registration token, which the entrypoint mints via the PAT.
      # Pre-fetched RUNNER_TOKEN mode (1h TTL) is still supported for
      # ad-hoc / troubleshooting invocations but not viable for 24/7.
      HERMES_RUNNER_REGISTRATION_PAT: ${HERMES_RUNNER_REGISTRATION_PAT:?HERMES_RUNNER_REGISTRATION_PAT is required — put it in .env (see .env.example)}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # RUNNER_NAME intentionally UNSET here — entrypoint.sh derives it
      # from the container's hostname (unique per replica). Setting it
      # here would give all replicas the same name and cause --replace
      # to kick each other out.
      RUNNER_LABELS: self-hosted,linux,x64,hermes
    mem_limit: 3g
    cpus: 4
    volumes:
      # Host docker socket → runner can spawn sibling containers when a
      # workflow step uses container-based actions. NOTE: security-
      # sensitive — runner effectively has root on the host via docker.
      # Acceptable for solo-dev + private repo + trusted PRs only.
      - /var/run/docker.sock:/var/run/docker.sock

      # ─────────────────────────────────────────────────────
      # Tool caches — persist across --force-recreate. First job
      # populates, subsequent jobs read.
      # ─────────────────────────────────────────────────────
      # uv wheel cache (Python deps)
      - uv-cache:/home/runner/.cache/uv
      # npm cache (markdownlint updates, any node-based action)
      - npm-cache:/home/runner/.cache/npm
      # pip cache (fallback if any step uses pip directly)
      - pip-cache:/home/runner/.cache/pip

      # ─────────────────────────────────────────────────────
      # Phase 0 test-tool caches — significant speedup on re-runs:
      #   pytest: collection cache, last-failed cache
      #   mypy: type-info incremental cache
      #   ruff: rule + AST cache
      #   hypothesis: shrinking database (also correctness — reusing
      #     shrinks avoids re-discovering minimal failing examples)
      # ─────────────────────────────────────────────────────
      - pytest-cache:/home/runner/.cache/pytest
      - mypy-cache:/home/runner/.cache/mypy
      - ruff-cache:/home/runner/.cache/ruff
      - hypothesis-db:/home/runner/.cache/hypothesis
      # bun package cache: the AI review action installs its own deps
      - bun-cache:/home/runner/.cache/bun

      # Workspace: NO shared volume — each replica gets its own
      # container-local /home/runner/_work. Sharing this across
      # replicas caused git ref locks (multiple runners writing to the
      # same refs/remotes/), _actions dir teardowns interfering with
      # each other, and _runner_file_commands temp files vanishing
      # mid-step. Docker allocates local writable space; --ephemeral
      # cleanup means it's fresh per job anyway.

  # ─────────────────────────────────────────────────────────────
  # OPS runner — merge queue and CD only (label hermes-ops).
  # One replica, so merges and deploys never wait behind PR CI on
  # the shared pool. Routed by the repo variable OPS_RUNNER_LABEL
  # (merge-queue.yml and cd.yml fall back to RUNNER_LABEL when it is
  # unset). Same image, caches and limits as the CI runners.
  # ─────────────────────────────────────────────────────────────
  ops-runner:
    image: gh-runner:latest
    restart: unless-stopped
    environment:
      RUNNER_REPOSITORY: ${RUNNER_REPOSITORY:-ricardoafo/hermes}
      HERMES_RUNNER_REGISTRATION_PAT: ${HERMES_RUNNER_REGISTRATION_PAT:?HERMES_RUNNER_REGISTRATION_PAT is required — put it in .env (see .env.example)}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_LABELS: self-hosted,linux,x64,hermes-ops
    mem_limit: 4g
    cpus: 4
    volumes:
      - uv-cache:/home/runner/.cache/uv
      - npm-cache:/home/runner/.cache/npm
      - pip-cache:/home/runner/.cache/pip

  # ─────────────────────────────────────────────────────────────
  # AI review runners (label hermes-review). The review job spends
  # ~7 minutes mostly waiting on the model, so on the CI pool it held
  # up to 3 of the 4 CI runners and PR tests queued behind it. Two
  # small replicas keep reviews off the CI pool. Routed by the repo
  # variable REVIEW_RUNNER_LABEL (ai-review.yml falls back to
  # RUNNER_LABEL when it is unset).
  # ─────────────────────────────────────────────────────────────
  review-runner:
    image: gh-runner:latest
    scale: 2
    restart: unless-stopped
    environment:
      RUNNER_REPOSITORY: ${RUNNER_REPOSITORY:-ricardoafo/hermes}
      HERMES_RUNNER_REGISTRATION_PAT: ${HERMES_RUNNER_REGISTRATION_PAT:?HERMES_RUNNER_REGISTRATION_PAT is required — put it in .env (see .env.example)}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_LABELS: self-hosted,linux,x64,hermes-review
    mem_limit: 1536m
    cpus: 1
    volumes:
      - uv-cache:/home/runner/.cache/uv
      - npm-cache:/home/runner/.cache/npm
      - bun-cache:/home/runner/.cache/bun

  # ─────────────────────────────────────────────────────────────
  # BACKTEST runner — backtest.yml only (label hermes-backtest),
  # on server-01 only (ADR-023). Behind the `backtest` profile, so
  # ./up.sh on the PC never starts it. Start it on server-01 with
  #   docker compose --profile backtest up -d backtest-runner
  # One replica: runs never overlap (the workflow's concurrency group
  # holds the rest). The pinned klines live on server-01's P310 at
  # /srv/hermes-data; every run re-verifies them against the manifest.
  # Own uv cache, shared with no other runner, and no Docker socket
  # (ADR-018 D11).
  # ─────────────────────────────────────────────────────────────
  backtest-runner:
    image: gh-runner:latest
    profiles: [backtest]
    scale: 1
    restart: unless-stopped
    environment:
      RUNNER_REPOSITORY: ${RUNNER_REPOSITORY:-ricardoafo/hermes}
      HERMES_RUNNER_REGISTRATION_PAT: ${HERMES_RUNNER_REGISTRATION_PAT:?HERMES_RUNNER_REGISTRATION_PAT is required — put it in .env (see .env.example)}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_LABELS: self-hosted,linux,x64,hermes-backtest
      HERMES_DATA_DIR: /srv/hermes-data
    mem_limit: 8g
    cpus: 4
    volumes:
      - /srv/hermes-data:/srv/hermes-data
      - backtest-uv-cache:/home/runner/.cache/uv

  # ─────────────────────────────────────────────────────────────
  # Dependabot runner (label dependabot) with its own Docker daemon.
  # GitHub runs Dependabot updates on a self-hosted runner only when
  # the runner user can run Docker. The CI runners reach the host
  # socket, which the runner user cannot use and which would be
  # root-equivalent on the host if it could. This runner instead
  # talks to a Docker-in-Docker sidecar on a private network: the
  # sidecar is privileged inside Docker Desktop's VM, not on the host,
  # and Dependabot's containers live and die inside it.
  # ─────────────────────────────────────────────────────────────
  dependabot-runner:
    image: gh-runner:latest
    restart: unless-stopped
    depends_on: [dependabot-dind]
    environment:
      RUNNER_REPOSITORY: ${RUNNER_REPOSITORY:-ricardoafo/hermes}
      HERMES_RUNNER_REGISTRATION_PAT: ${HERMES_RUNNER_REGISTRATION_PAT:?HERMES_RUNNER_REGISTRATION_PAT is required — put it in .env (see .env.example)}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_LABELS: self-hosted,linux,x64,dependabot
      DOCKER_HOST: tcp://dependabot-dind:2375
    mem_limit: 4g
    cpus: 2
    networks: [dependabot]

  dependabot-dind:
    image: docker:28-dind
    restart: unless-stopped
    privileged: true
    environment:
      # Plain TCP is safe here: the port is reachable only on the
      # private `dependabot` network, never published to the host.
      DOCKER_TLS_CERTDIR: ''
    command: ['--host=tcp://0.0.0.0:2375']
    mem_limit: 4g
    volumes:
      - dependabot-docker:/var/lib/docker
    networks: [dependabot]

networks:
  dependabot:

volumes:
  uv-cache:
  npm-cache:
  pip-cache:
  pytest-cache:
  mypy-cache:
  ruff-cache:
  hypothesis-db:
  bun-cache:
  backtest-uv-cache:
  dependabot-docker:
