# Docker Compose config for the self-hosted GH Actions runner.
#
# On-demand pattern: `up.sh` starts the runner and waits for jobs; `down.sh`
# stops + deregisters cleanly. NOT `restart: always` — we want the runner up
# ONLY when Ricardo is actively working with Claude and expects CI to fire.
#
# Ephemeral: the runner processes ONE job then exits (via --ephemeral flag
# in entrypoint). up.sh loops it back up if you want multiple jobs per
# session; simplest form is one-shot per invocation.

services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNNER_VERSION: '2.336.0'
    image: hermes-runner:latest
    container_name: hermes-runner
    restart: 'no'
    env_file:
      - .env
    environment:
      RUNNER_NAME: 'hermes-runner-${HOSTNAME:-local}'
      RUNNER_LABELS: 'self-hosted,linux,x64,hermes'
    mem_limit: 4g
    cpus: 4
    volumes:
      # Host docker socket → runner can spawn sibling containers when a
      # workflow step uses container-based actions. NOTE: security-
      # sensitive — the runner effectively has root on the host via
      # docker. Acceptable for solo-dev + private repo + trusted PRs only.
      - /var/run/docker.sock:/var/run/docker.sock

      # Warm caches persist across sessions (survive --force-recreate).
      # Big speed-up on repeat jobs: uv reuses wheels, npm reuses
      # packages, pip stays warm.
      - runner-uv-cache:/home/runner/.cache/uv
      - runner-npm-cache:/home/runner/.cache/npm
      - runner-pip-cache:/home/runner/.cache/pip

      # Workspace: ephemeral per-job (--force-recreate wipes it). Volume
      # exists to keep /home/runner/_work writable without needing a
      # tmpfs mount.
      - runner-work:/home/runner/_work

volumes:
  runner-uv-cache:
  runner-npm-cache:
  runner-pip-cache:
  runner-work:
