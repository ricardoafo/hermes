repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - feat
          - fix
          - docs
          - chore
          - refactor
          - test
          - perf
          - build
          - ci
          - revert

  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2
        language: system
        files: \.md$

      - id: regenerate-guides-index
        name: regenerate-guides-index
        entry: scripts/dev/regenerate-guides-index.sh
        language: system
        files: ^docs/guides/.*\.md$
        pass_filenames: false

      - id: secrets-scan
        name: secrets-scan (gitleaks pre-commit)
        entry: scripts/dev/pre-commit-secrets-scan.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false

      - id: pr-body-lint-self-test
        name: pr-body-lint self-test
        entry: bash -c 'HERMES_SELF_TEST=1 bash scripts/dev/pr-body-lint.sh'
        language: system
        files: ^scripts/dev/pr-body-lint\.sh$
        pass_filenames: false

      - id: changelog-check-self-test
        name: changelog-check self-test
        entry: bash -c 'HERMES_SELF_TEST=1 bash scripts/dev/changelog-check.sh'
        language: system
        files: ^scripts/dev/changelog-check\.sh$
        pass_filenames: false

      - id: codeowners-syntax
        name: CODEOWNERS syntax check
        entry: bash scripts/dev/codeowners-syntax-check.sh
        language: system
        files: ^(\.github/CODEOWNERS|scripts/dev/codeowners-syntax-check\.sh)$
        pass_filenames: false

      - id: codeowners-syntax-self-test
        name: codeowners-syntax self-test
        entry: bash -c 'HERMES_SELF_TEST=1 bash scripts/dev/codeowners-syntax-check.sh'
        language: system
        files: ^scripts/dev/codeowners-syntax-check\.sh$
        pass_filenames: false

      - id: ci-success-check-self-test
        name: ci-success-check self-test
        entry: bash -c 'HERMES_SELF_TEST=1 bash scripts/dev/ci-success-check.sh'
        language: system
        files: ^scripts/dev/ci-success-check\.sh$
        pass_filenames: false

      - id: render-pr-body-self-test
        name: render-pr-body self-test
        entry: bash -c 'HERMES_SELF_TEST=1 bash scripts/dev/render-pr-body.sh'
        language: system
        files: ^scripts/dev/render-pr-body\.sh$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check
        types: [python]

      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format --check
        types: [python]

      - id: mypy
        name: mypy --strict
        language: system
        entry: uv run mypy --strict
        types: [python]
        pass_filenames: false
        args: ["src/"]

      - id: import-linter
        name: import-linter
        language: system
        entry: uv run lint-imports
        pass_filenames: false

      # Pre-push: mirror the exact CI suite locally. Blocks push if any
      # check would fail on the PR. Slower than commit-stage hooks (~30-60s)
      # — that's the tradeoff for catching PR-open failures at push time.
      # One-time install: `pre-commit install --hook-type pre-push`.
      - id: pr-preflight
        name: pr-preflight (mirror CI locally)
        entry: bash scripts/dev/pr-preflight.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # Self-test of pr-preflight — runs on every commit that touches it.
      - id: pr-preflight-self-test
        name: pr-preflight self-test
        entry: bash -c 'HERMES_SELF_TEST=1 bash scripts/dev/pr-preflight.sh'
        language: system
        files: ^scripts/dev/pr-preflight\.sh$
        pass_filenames: false
