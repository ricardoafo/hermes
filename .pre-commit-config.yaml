repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # syrupy's .ambr files indent blank snapshot lines with two spaces and
      # end without a final newline; stripping either breaks the snapshot.
      - id: trailing-whitespace
        exclude: (^|/)__snapshots__/
      - id: end-of-file-fixer
        exclude: (^|/)__snapshots__/
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - feat
          - fix
          - docs
          - chore
          - refactor
          - test
          - perf
          - build
          - ci
          - revert

  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2
        language: system
        files: \.md$

      - id: regenerate-guides-index
        name: guides index builds on docs/guides/ change
        # Checks every guide can be indexed (H1 + Description) without
        # writing docs/guides/README.md. The index is rebuilt on main
        # after merge, so a PR commit never carries it.
        entry: bash scripts/dev/regenerate-guides-index-hook.sh
        language: system
        files: ^docs/guides/.*\.md$
        pass_filenames: false
        stages: [pre-commit]

      - id: secrets-scan
        name: secrets-scan (gitleaks pre-commit)
        entry: scripts/dev/pre-commit-secrets-scan.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false

      - id: codeowners-syntax
        name: CODEOWNERS syntax check
        entry: bash scripts/dev/codeowners-syntax-check.sh
        language: system
        files: ^(\.github/CODEOWNERS|scripts/dev/codeowners-syntax-check\.sh)$
        pass_filenames: false

      - id: migration-sql-check
        name: ledger migration names + no transaction control (#483)
        entry: uv run python scripts/dev/migration-sql-check.py
        language: system
        files: ^src/hermes/adapters/ledger/migrations/.*\.sql$

      - id: openspec-layout
        name: openspec specs parse, archived ones are final, spec paths resolve (#1196)
        entry: uv run python scripts/dev/openspec-archive.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: agents-md-check
        name: AGENTS.md stays under its line budget and names no fixed ADR range (#1195)
        entry: uv run python scripts/dev/agents-md-check.py
        language: system
        pass_filenames: false
        files: ^AGENTS\.md$

      - id: footprint-check
        name: no outside project names, bot account only in code (#1198)
        entry: uv run python scripts/dev/footprint-check.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ratchets
        name: no new duplicate blocks or oversized modules in src/ (#1201)
        entry: bash -c 'uv run python scripts/dev/ratchets.py dup && uv run python scripts/dev/ratchets.py size'
        language: system
        files: ^src/
        pass_filenames: false

      - id: no-vague-test-assertions
        name: no vague test assertions (AST guard)
        entry: uv run python scripts/dev/no-vague-test-assertions.py
        language: system
        files: ^tests/.*\.py$
        pass_filenames: true

      - id: test-file-adjacency
        name: new src module needs a matching tests/unit test file
        entry: bash scripts/dev/test-file-adjacency.sh
        language: system
        files: ^src/hermes/.*\.py$
        pass_filenames: false
        stages: [pre-commit]

      - id: no-future-annotations
        name: no new from __future__ import annotations (Python 3.14)
        entry: bash scripts/dev/no-future-annotations.sh
        language: system
        files: \.py$
        pass_filenames: false
        stages: [pre-commit]

      - id: adr-status-check
        name: ADRs are Accepted and supersessions link back
        entry: python3 scripts/dev/adr-status-check.py
        language: system
        files: ^(docs/architecture/.*\.md|scripts/dev/adr-status\.baseline)$
        pass_filenames: false

      - id: no-domain-mode-check
        name: no TradingMode in domain (grep guard)
        entry: bash scripts/dev/no-domain-mode-check.sh
        language: system
        files: ^src/hermes/domain/.*\.py$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check
        types: [python]

      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format --check
        types: [python]

      - id: mypy
        name: mypy --strict
        language: system
        entry: uv run mypy --strict
        types: [python]
        pass_filenames: false
        args: ["src/"]

      - id: import-linter
        name: import-linter
        language: system
        entry: uv run lint-imports
        pass_filenames: false

      # Pre-registration §11: a notebook entry is never edited after it is
      # written. Checks every entry's hash before the commit lands (#1181).
      - id: lab-notebook-hashes
        name: lab notebook entries verify against their hashes
        language: system
        entry: uv run pytest -q tests/unit/application/strategy_protocol/test_lab_notebook.py
        files: ^(docs/experiments/[^/]+/lab-notebook\.md|src/hermes/application/strategy_protocol/lab_notebook\.py)$
        pass_filenames: false

      # Pre-push: the fast subset of the CI suite. A stale base fails in
      # seconds; the test tiers, pip-audit, complexity, dead code and the license
      # check are left to CI, which runs them on every head (#416). Run
      # `bash scripts/dev/pr-preflight.sh` by hand for every CI check.
      # One-time install: `pre-commit install --hook-type pre-push`.
      - id: pr-preflight
        name: pr-preflight (fast pre-push subset)
        entry: bash scripts/dev/pr-preflight.sh --pre-push
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # One hook runs every scripts/dev self-test: any script there that reads
      # HERMES_SELF_TEST is found and run, so a new one needs no stanza (#1190).
      - id: self-tests
        name: scripts/dev self-tests
        entry: uv run --no-sync python scripts/dev/hook-coverage-check.py --run-self-tests
        language: system
        files: ^scripts/dev/
        pass_filenames: false
