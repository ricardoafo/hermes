# =====================================================================
# VPS bootstrap — idempotent post-provisioning setup
# =====================================================================
#
# workflow_dispatch-only. Runs `scripts/deploy/vps_bootstrap.sh` on the
# VPS via Tailscale + SSH. Creates the hermes user and the FHS dirs,
# installs the pinned uv and Python 3.14, installs the systemd units from
# deploy/systemd/ and enables hermes.service, renders
# /etc/hermes/env.production from GH prod-env secrets ONLY when the file is
# absent (an existing file only gets its owner and mode repaired), and
# mounts the storage box when its credentials are present.
#
# Reuses the Tailscale + openssh-install scaffolding from
# `vps-diagnose.yml` (see PR chain #277+, notably #284 for the
# ADDITIONAL_DAEMON_ARGS composite-action gotcha).
#
# ## Related
#   scripts/deploy/vps_bootstrap.sh — the idempotent script this runs
#   openspec/archive/chore-vps-bootstrap-workflow/change.md
#   openspec/archive/179-cd-first-real-deploy/change.md (D-8)
#   #285 — tracking issue

name: VPS bootstrap

on:
  workflow_dispatch:

concurrency:
  group: vps-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap hermes-01
    # The ops runner, not the CI pool: the CI pool runs pull request code.
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || fromJSON('["self-hosted","linux","hermes"]') }}
    environment: prod
    timeout-minutes: 10

    steps:
      - name: Checkout hermes repo (for scripts/deploy and deploy/systemd)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            scripts/deploy
            deploy/systemd
            deploy/hermes-notify-failure.sh
            deploy/hermes-notify-crash.sh
          sparse-checkout-cone-mode: false

      - name: Ensure openssh-client is installed
        run: |
          set -euo pipefail
          if command -v ssh >/dev/null 2>&1; then
              echo "ssh already available: $(ssh -V 2>&1)"
              exit 0
          fi
          echo "ssh missing — installing openssh-client"
          if command -v apt-get >/dev/null 2>&1; then
              if [ "$(id -u)" = "0" ]; then
                  apt-get update -qq && apt-get install -y openssh-client
              else
                  sudo apt-get update -qq && sudo apt-get install -y openssh-client
              fi
          elif command -v apk >/dev/null 2>&1; then
              if [ "$(id -u)" = "0" ]; then
                  apk add --no-cache openssh-client
              else
                  sudo apk add --no-cache openssh-client
              fi
          else
              echo "ERROR: no supported package manager (apt-get / apk)"
              exit 2
          fi

      - name: Join tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          # OAuth client, not an auth key: each run mints a short-lived
          # tagged key, so nothing here expires (#314).
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-runner
          hostname: gh-actions-vps-bootstrap-${{ github.run_id }}
          # Pinned: `latest` downloads whatever shipped that day.
          version: 1.102.4
          # Self-hosted runner is a Docker container without NET_ADMIN /
          # /dev/net/tun — tailscaled would crash on startup without this.
          # NOT settable via `env: ADDITIONAL_DAEMON_ARGS=…` — the value
          # is sourced from `inputs.tailscaled-args` inside the composite
          # action's Start-Daemon step. See tailscale/github-action@v3
          # action.yml:285.
          tailscaled-args: --tun=userspace-networking

      - name: Tailscale diagnostics (self + peer + ping)
        run: |
          set -euo pipefail
          echo "=== self (tags this runner is claiming) ==="
          # Per-device fields live under `.Self` in tailscale status --json.
          # Reading them from the top-level object returns null (only
          # TailscaleIPs is mirrored at both levels) — earlier version of
          # this step queried `{Tags, HostName, ...}` at the root and got
          # a misleading "Tags: null" that suggested untagged when the
          # device was actually tagged. See #294 followup.
          tailscale status --self=true --peers=false --json \
            | jq '.Self | {HostName, DNSName, Tags, TailscaleIPs, Online}'
          echo ""
          echo "=== hermes-01 peer (tags Tailscale sees on the target) ==="
          tailscale status --self=false --json \
            | jq '.Peer | to_entries[] | select(.value.HostName == "hermes-01") | .value
                  | {HostName, DNSName, Tags, TailscaleIPs, Online, LastSeen}'
          echo ""
          echo "=== ping (proves control-plane peer discovery is done) ==="
          # Wait up to 30s for a direct or DERP connection. Without this
          # the SSH step can race the tailscaled peer-sync and hit the
          # "policy does not permit" false-negative from stale peer info.
          tailscale ping --until-direct=false --timeout=30s hermes-01 || true

      - name: Prepare SSH keyfile + known_hosts
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_id
          chmod 600 ~/.ssh/vps_id
          ssh-keyscan -H "$VPS_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -y -f ~/.ssh/vps_id > /dev/null && echo "keyfile parsed OK"

      - name: Ship systemd units to VPS
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          set -euo pipefail
          # The bootstrap script arrives on stdin, so it cannot read files
          # next to itself. Stream the unit files and the failure-alert script
          # (installed to /opt/hermes/bin, #364) to a fixed path first; the
          # script installs them and deletes the directory. /var/lib, not the
          # world-writable tmp dir: there another local user could create the
          # directory between rm and install -d and plant units root installs.
          remote='rm -rf /var/lib/hermes-bootstrap && install -d -m 0700 /var/lib/hermes-bootstrap && tar -xf - -C /var/lib/hermes-bootstrap'
          tar -C deploy -cf - systemd hermes-notify-failure.sh hermes-notify-crash.sh | ssh -i ~/.ssh/vps_id -o StrictHostKeyChecking=yes "$VPS_SSH_USER@$VPS_SSH_HOST" "$remote"

      - name: Run bootstrap script on VPS
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}

          # Config-only vars (non-secret) hardcoded here so they land
          # in .env.production even without a corresponding GH secret.
          HERMES_ENV: prod
          HERMES_ALLOW_MAINNET: "no"
          HERMES_SENTRY__ENVIRONMENT: prod

          # HERMES_* secrets from prod env. Any that are unset (secret
          # not added yet) come through as empty and the bootstrap
          # script skips them (see "skipped-empty" counter in output).
          # The script renders them only when /etc/hermes/env.production
          # does not exist yet: to rotate a secret, edit the file on the
          # box, or delete it and re-dispatch.
          HERMES_HEALTHCHECKS__PING_URL: ${{ secrets.HERMES_HEALTHCHECKS__PING_URL }}
          HERMES_TELEGRAM__BOT_TOKEN: ${{ secrets.HERMES_TELEGRAM__BOT_TOKEN }}
          HERMES_TELEGRAM__CHAT_ID: ${{ secrets.HERMES_TELEGRAM__CHAT_ID }}
          HERMES_SLACK__BOT_TOKEN: ${{ secrets.HERMES_SLACK__BOT_TOKEN }}
          HERMES_SLACK__DEFAULT_CHANNEL: ${{ vars.HERMES_SLACK__DEFAULT_CHANNEL }}
          HERMES_SENTRY__DSN: ${{ secrets.HERMES_SENTRY__DSN }}
          HERMES_BINANCE_MAINNET__API_KEY: ${{ secrets.HERMES_BINANCE_MAINNET__API_KEY }}
          HERMES_BINANCE_MAINNET__API_SECRET: ${{ secrets.HERMES_BINANCE_MAINNET__API_SECRET }}
          HERMES_BINANCE_TESTNET__API_KEY: ${{ secrets.HERMES_BINANCE_TESTNET__API_KEY }}
          HERMES_BINANCE_TESTNET__API_SECRET: ${{ secrets.HERMES_BINANCE_TESTNET__API_SECRET }}

          # Optional non-root CD account (repo variable VPS_DEPLOY_USER). Unset
          # or root: the script writes no sudoers rule.
          DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}

          # Storage-box credentials (guarded — script skips mount when missing)
          STORAGE_BOX_HOST: ${{ secrets.STORAGE_BOX_HOST }}
          STORAGE_BOX_USER: ${{ secrets.STORAGE_BOX_USER }}
          STORAGE_BOX_KEY: ${{ secrets.STORAGE_BOX_KEY }}
        run: |
          set -euo pipefail
          # `-o SendEnv=HERMES_*,STORAGE_BOX_*` doesn't work by default
          # (sshd's AcceptEnv would need to allow it). Instead, we build
          # an inline `env VAR=... bash < script` command — the VPS
          # never sees the client's env, only what we explicitly pass.
          #
          # Assemble the env-passing prefix from every currently-set env
          # var starting with HERMES_ or STORAGE_BOX_.
          #
          # Use `env -0` (null-separated) instead of newline-separated. Some
          # secrets are multi-line (e.g. STORAGE_BOX_KEY is a PEM-encoded
          # OpenSSH private key). Newline-based `env | while read` truncates
          # such values at the first `\n`, silently dropping everything
          # after the PEM header and shipping a 36-byte file to the VPS.
          env_args=()
          while IFS= read -r -d '' entry; do
              name="${entry%%=*}"
              case "$name" in
                  HERMES_*|STORAGE_BOX_*|DEPLOY_USER)
                      env_args+=("$entry")
                      ;;
              esac
          done < <(env -0)

          # Pass the script via stdin so it runs as one atomic session.
          ssh -i ~/.ssh/vps_id -o StrictHostKeyChecking=yes \
              "$VPS_SSH_USER@$VPS_SSH_HOST" \
              "env $(printf '%q ' "${env_args[@]}") bash" \
              < scripts/deploy/vps_bootstrap.sh

      # The runner container outlives the job, so the key must not.
      - name: Remove the SSH keyfile
        if: always()
        run: rm -f ~/.ssh/vps_id
