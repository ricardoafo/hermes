# =====================================================================
# PR housekeeping — keep PR bodies in template shape and CI fresh
# =====================================================================
#
# Jobs that keep PRs in shape when something changes outside git:
#
# 1. `rewrite` — Dependabot bodies carry release notes but none of the
#    Summary / Related / Testing / Risk sections every human PR must
#    fill. It renders those sections (with a loud MAJOR-bump warning in
#    Risk) and keeps the original body in a trailing "Dependabot notes"
#    section. See scripts/dev/rewrite-dependabot-body.py.
# 2. `recheck` — editing a PR body pushes nothing, so the `CI` workflow
#    does not run again and its "PR body" result goes stale (#350).
#    scripts/dev/pr-body-recheck.sh re-lints the current body and, when
#    the verdict differs from the "PR body" step of the head commit's CI
#    run, re-runs that run's "CI success" job, the one required check.
# 3. `metadata` — a newly opened PR inherits milestone, type/p/area
#    labels and the bot assignee from the issue it closes (see that job).
#
# ## Triggers
#
# - `pull_request_target: opened/reopened` — a Dependabot PR appears;
#   `rewrite` renders its body.
# - `pull_request_target: edited` — a person edits the body (title-only
#   edits are ignored), or Dependabot regenerates its own.
# - `workflow_run: CI completed` — the body changed while CI was still
#   running (a job can only be re-run once its run completes), or a bot
#   edited it with GITHUB_TOKEN, which fires no `edited` event. The
#   `rewrite` job's own edit is one of those; `recheck` also runs right
#   after it in the same workflow run.
#
# - `push: main` — main moved; the `conflicts` job marks every open PR
#   that no longer merges cleanly (see that job).
#
# ## Idempotency
#
# The rendered Dependabot body starts with a marker comment. When the
# script sees the marker it exits 3, so a body is rewritten once per
# Dependabot (re)generation.
#
# ## Safety
#
# Both triggers run the BASE branch's workflow and scripts. Nothing from
# the PR head is checked out or executed; the title and body are passed
# through env vars or fetched from the API and parsed as text. Only
# `rewrite` gets a write token, and only on `dependabot[bot]` PRs. It
# never touches human PRs and nothing here merges anything.

name: PR housekeeping

on:
  pull_request_target:
    types: [opened, reopened, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # main moved: re-check which open PRs it now conflicts with.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-housekeeping-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  rewrite:
    name: Rewrite Dependabot body
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    outputs:
      changed: ${{ steps.render.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { version: "0.12.5" }

      - name: Render 4-section body
        id: render
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set +e
          uv run --no-project python scripts/dev/rewrite-dependabot-body.py --out "$RUNNER_TEMP/body.md"
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          PR_BODY="$(cat "$RUNNER_TEMP/body.md")" bash scripts/dev/pr-body-lint.sh
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Update PR body
        if: steps.render.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"

  recheck:
    name: Recheck PR body
    needs: rewrite
    if: >-
      !cancelled() && (
        (github.event_name == 'pull_request_target' &&
         (github.event.changes.body != null || needs.rewrite.outputs.changed == 'true')) ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.pull_requests[0] != null))
    # Fires after every CI run and only calls the GitHub API, so it must
    # not take a CI runner slot from a PR's tests (#571).
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Recheck and re-run PR body job if stale
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: bash scripts/dev/pr-body-recheck.sh

  # ─────────────────────────────────────────────────────────────────
  # CONFLICTS — mark every open PR that no longer merges cleanly.
  #
  # A PR that conflicts with main gets no CI run at all (GitHub cannot
  # build its merge ref), so nothing on the PR page turns red: it just
  # sits approved and unmergeable until someone notices. On every push
  # to main this job posts a "Merges cleanly with main" status on each
  # open PR's head: failure when GitHub reports conflicts, success
  # otherwise. Informational, not a required check.
  # ─────────────────────────────────────────────────────────────────
  conflicts:
    name: Flag PRs that conflict with main
    if: github.event_name == 'push'
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });
            // `mergeable` is computed lazily after a push to main; poll
            // until GitHub has an answer for each PR.
            const settle = async (number) => {
              for (let attempt = 0; attempt < 8; attempt += 1) {
                const { data } = await github.rest.pulls.get({ owner, repo, pull_number: number });
                if (data.mergeable !== null) return data;
                await new Promise((r) => setTimeout(r, 5000));
              }
              return null;
            };
            for (const pr of open) {
              const full = await settle(pr.number);
              if (full === null) {
                core.info(`#${pr.number}: mergeability still unknown — skipped this pass`);
                continue;
              }
              const clean = full.mergeable !== false && full.mergeable_state !== 'dirty';
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: full.head.sha,
                context: 'Merges cleanly with main',
                state: clean ? 'success' : 'failure',
                description: clean
                  ? `no conflicts with main ${context.sha.slice(0, 7)}`
                  : `conflicts with main ${context.sha.slice(0, 7)}: merge main in and resolve`,
              });
              core.info(`#${pr.number}: ${clean ? 'clean' : 'CONFLICTS'}`);
            }

  # ─────────────────────────────────────────────────────────────────
  # metadata — a new PR inherits its tracker fields from the issue it
  # closes: milestone, type/p/area labels, and the bot as assignee when
  # nobody is assigned. Fills gaps only; never removes or overwrites.
  # Decisions live in tools/pr-metadata/plan.cjs (unit-tested in CI).
  # Adding the PR to the GitHub Project is the project's own auto-add
  # workflow, not this job.
  # ─────────────────────────────────────────────────────────────────
  metadata:
    name: Fill PR metadata from its issue
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action != 'edited' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Base branch only (pull_request_target default): the PR's own code
      # never runs with this write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: tools/pr-metadata
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { closedIssueNumber, planMetadata } = require('./tools/pr-metadata/plan.cjs');
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.issues.get({ owner, repo, issue_number: number });
            const linked = closedIssueNumber(pr.body);
            let issue = null;
            if (linked !== null) {
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number: linked }));
              } catch (err) {
                core.warning(`#${number}: closes #${linked}, which could not be read (${err.status})`);
              }
            }
            const plan = planMetadata(pr, issue);
            if (plan.milestone !== null) {
              await github.rest.issues.update({ owner, repo, issue_number: number, milestone: plan.milestone });
            }
            if (plan.addLabels.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: plan.addLabels });
            }
            if (plan.addAssignees.length > 0) {
              await github.rest.issues.addAssignees({ owner, repo, issue_number: number, assignees: plan.addAssignees });
            }
            core.info(`#${number}: closes #${linked ?? '-'} → ${JSON.stringify(plan)}`);
