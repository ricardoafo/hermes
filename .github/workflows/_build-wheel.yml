# =====================================================================
# Build wheel — REUSABLE workflow (underscore prefix = not triggered directly)
# =====================================================================
#
# Extracted from `cd.yml` and `release.yml` — both had a nearly-identical
# wheel-build step. Keeping the build in one place means the pinned
# `astral-sh/setup-uv` version and the artifact name never drift between
# callers.
#
# ## Inputs
#
#   runner-label (optional string):
#     JSON-array runner label to override the default. Empty string means
#     "fall back to `vars.RUNNER_LABEL` or the self-hosted CI pool" — matches the
#     pattern the callers used before extraction so behaviour is preserved.
#
#   ref (optional string):
#     Commit to build. Empty means the triggering commit. CD passes the
#     commit whose CI passed, which under workflow_run differs from
#     GITHUB_SHA (main's tip when CD starts).
#
#   version (optional string):
#     Version to stamp into pyproject.toml and hermes/__init__.py before
#     the build (ADR-030 §4). Empty builds the committed version.
#
# ## Outputs
#
#   wheel-artifact-name:
#     Name of the uploaded artifact (`hermes-wheel`). Callers use this in
#     `actions/download-artifact` to pull the wheel into downstream jobs.

name: Build wheel

on:
  workflow_call:
    outputs:
      wheel-artifact-name:
        description: 'Name of the uploaded wheel artifact'
        value: hermes-wheel
    inputs:
      runner-label:
        description: 'JSON array of runner labels or a single label string'
        type: string
        required: false
        default: ''
      ref:
        description: 'Commit to check out and build; empty means the triggering commit'
        type: string
        required: false
        default: ''
      version:
        description: 'Version to stamp before building; empty keeps the committed one'
        type: string
        required: false
        default: ''

jobs:
  build:
    name: Build wheel
    runs-on: ${{ inputs.runner-label != '' && fromJSON(inputs.runner-label) || (vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || fromJSON('["self-hosted","linux","hermes"]')) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"

      - run: uv sync --frozen
      - name: Stamp the computed version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: uv run --no-project --python 3.14 scripts/deploy/next_version.py --set "$VERSION"
      - run: uv build --wheel

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hermes-wheel
          path: dist/*.whl
