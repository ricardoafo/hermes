# =====================================================================
# PR body recheck — re-run the CI "PR body" job after a body edit
# =====================================================================
#
# Editing a PR body pushes nothing, so the `CI` workflow does not run
# again and its "PR body" result goes stale (#350). This workflow runs
# scripts/dev/pr-body-recheck.sh, which re-lints the current body and,
# when the verdict differs, re-runs only the "PR body" job of the
# head commit's CI run. "CI success" re-runs with it as a dependent, so
# branch protection (which requires only "CI success") sees the new
# result. The rest of the CI suite is not re-run.
#
# ## Triggers
#
# - `pull_request_target: edited` — a person edits the body after CI
#   finished. Title-only edits are ignored.
# - `workflow_run: CI completed` — the body changed while CI was still
#   running (a job can only be re-run once its run completes), or a bot
#   edited it with GITHUB_TOKEN, which fires no `edited` event (the
#   Dependabot body rewriter does this seconds after the PR opens).
#
# ## Safety
#
# Both triggers run the BASE branch's workflow and script. Nothing from
# the PR head is checked out or executed; the body is fetched from the
# API and parsed as text by pr-body-lint.sh.

name: PR body recheck

on:
  pull_request_target:
    types: [edited]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: pr-body-recheck-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  recheck:
    name: Recheck PR body
    if: >-
      (github.event_name == 'pull_request_target' && github.event.changes.body != null) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0] != null)
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Recheck and re-run PR body job if stale
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: bash scripts/dev/pr-body-recheck.sh
