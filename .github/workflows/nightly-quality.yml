# =====================================================================
# Nightly Quality — heavy CI jobs consolidated to a daily cron
# =====================================================================
# Semgrep + future nightly checks (contract tests, mutation summaries)
# run here to keep per-PR CI fast + free up scarce self-hosted runners.
# Uses ubuntu-latest so the cron fires even if operator's self-hosted
# PC is off overnight.
#
# Companion workflows:
#   - mutation.yml — weekly Sunday cosmic-ray mutation run (kept separate
#     because it needs a 60-minute timeout and produces its own artifact
#     trail; conceptually part of the same "nightly heavy-jobs" tier).

name: Nightly Quality

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip external calls / notifications (validate workflow only)'
        type: boolean
        default: false
        required: false

concurrency:
  group: nightly-quality
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # SEMGREP (SAST) — moved out of ci.yml (per-PR) to nightly cron.
  # Rationale: semgrep findings are codebase-wide patterns that rarely
  # change per-PR. Running nightly frees scarce self-hosted slots for
  # per-commit signal (unit tests, ruff, mypy) while still catching new
  # SAST hits within 24h. ubuntu-latest ensures the cron fires even if
  # the operator's self-hosted PC is off overnight.
  # ─────────────────────────────────────────────────────────────────────
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # semgrep-action@v1 uses Docker-in-Docker which our containerized
      # self-hosted runner cannot do (docker.sock permission denied when the
      # action tries `docker pull returntocorp/semgrep-agent:v1`).
      # Install semgrep via uv tool instead — same rules, no daemon needed.
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.12.5" }
      - run: uv tool install semgrep
      - run: uv tool run semgrep scan --config p/security-audit --config p/python --error

  # Placeholder for future nightly jobs (contract tests, weekly mutation
  # summary, etc.). Ship them here to keep everything nightly in one file.
