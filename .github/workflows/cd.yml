# =====================================================================
# CD — deploy a hermes release bundle to hermes-01 (Phase 0)
# =====================================================================
#
# ## Status
#
# build (wheel) -> bundle (wheel + hash-pinned requirements + config +
# deploy scripts, one tarball) -> deploy (tailnet + scp + install_release.sh
# over SSH, which flips `current`, restarts the unit and runs the health
# gate, then the tests/smoke suite over the same SSH path, #407) ->
# release (GitHub release deploy-<sha12> with the notes job's PR and
# changelog list, plus a Telegram summary, #626) -> confirm. A failed
# gate or a failed smoke run rolls back to `previous` and fails the
# deploy job.
#
# ## Prerequisites on hermes-01 (one-time: run the `vps-bootstrap` workflow)
#
#   - `hermes` OS user, /opt/hermes/{versions,bin,python}, /var/lib/hermes
#   - uv (pinned) and Python 3.14 under /opt/hermes/python
#   - hermes.service installed and enabled (a deploy starts it; later
#     deploys install changed unit and timer files themselves, #626)
#   - /etc/hermes/env.production, root:root 0600, HERMES_ALLOW_MAINNET=no
#
# See docs/guides/vps-operations.md for the operator checklist and
# openspec/archive/179-cd-first-real-deploy/change.md for the design.
#
# ## Trigger set
#
#   workflow_dispatch:
#     Manual until we're confident. Every push-to-main auto-deploy will
#     be enabled in a follow-up once the pipeline has proven itself over
#     a few manual runs. `dry_run` defaults to true: it builds the bundle
#     and touches nothing else (no tailnet, scp or ssh).
#
# ## Deploy cadence (ADR-030)
#
# Every push to main whose CI passed deploys when it changes a file the
# release bundle carries, as the next version: MINOR for a feature,
# breaking change or engine file, PATCH otherwise, computed from the
# last v tag by scripts/deploy/next_version.py. A push that changes
# nothing shipped (docs, tests, CI, research batches) is gated and
# bundled but not deployed. The retired DEPLOY_ON variable is ignored.
#
# ## Serialization
#
# The deploy job holds `concurrency: deploy-vps` with
# `cancel-in-progress: false`: two deploys racing would flip `current`
# under each other. The lock is on that job, not the workflow. Every CI
# run on main starts a CD run, and most skip at the gate (a cancelled or
# failed CI); as workflow-level runs they took the group's one pending
# slot and could displace a real deploy waiting there (#694).
#
# ## Secrets (populated on `prod` GH Environment)
#
#   TS_OAUTH_CLIENT_ID      — Tailscale OAuth client (auth_keys write, tag:ci-runner)
#   TS_OAUTH_SECRET         — that client's secret
#   VPS_SSH_HOST            — hermes-01 (tailnet hostname or 100.96.83.123)
#   VPS_SSH_USER            — root
#   VPS_SSH_KEY             — hermes_ci_ed25519 (unencrypted ed25519 private)

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip real deploy steps (validate workflow only)'
        type: boolean
        default: true
        required: false

# Jobs run on the hermes-ops runner when OPS_RUNNER_LABEL is set, so a
# deploy never waits behind PR CI; they fall back to the CI pool until
# that runner exists.
permissions:
  contents: read

env:
  VPS_HOST: hermes-01
  # The commit every job builds, tests and ships. Under workflow_run,
  # GITHUB_SHA is main's tip when CD starts, which may be a newer merge
  # whose CI has not passed; head_sha is the commit CI validated.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # GATE — only a commit whose CI passed on a push to main ships, and
  # only after the slower tiers pass on that exact commit: the offline
  # end-to-end serve cycle and the contract tests for the adapters
  # `hermes serve` calls. Contract tests for adapters serve does not
  # use (Kraken, Slack, Binance testnet) stay in scheduled.yml as
  # advisory, so their API drift never blocks a deploy. Then it waits
  # out the 4h bar close so the restart never lands on one.
  # ─────────────────────────────────────────────────────────────────
  gate:
    name: Release checks and a quiet bar
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    # The ops runner, not the CI pool: the e2e serve cycle failed on
    # contention beside PR CI (run 37304489094, #694). With one ops
    # runner it never overlaps the merge queue's Revalidate either.
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || fromJSON('["self-hosted","linux","hermes"]') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.12.5" }
      - run: uv sync --frozen

      - name: End-to-end serve cycle on the release commit
        run: uv run pytest tests/e2e -m e2e --tb=short -p no:cacheprovider

      - name: Contract tests for the adapters serve uses
        env:
          HERMES_TELEGRAM__BOT_TOKEN: ${{ secrets.HERMES_TELEGRAM__BOT_TOKEN }}
          HERMES_SENTRY__DSN: ${{ secrets.HERMES_SENTRY__DSN }}
          HERMES_HEALTHCHECKS__PING_URL: ${{ secrets.HERMES_HEALTHCHECKS__PING_URL }}
        # -m contract overrides the `not contract` addopts filter.
        run: >-
          uv run pytest -m contract --tb=short -p no:cacheprovider
          tests/contract/test_binance_public_klines.py
          tests/contract/test_telegram_getme.py
          tests/contract/test_healthchecks_ping.py
          tests/contract/test_sentry_dsn_parses.py

      - name: Hold around the 4h bar close
        if: inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          into=$(( $(date -u +%s) % 14400 ))
          if [ "$into" -ge 14100 ]; then wait=$(( 14400 - into + 300 ))
          elif [ "$into" -lt 300 ]; then wait=$(( 300 - into ))
          else wait=0; fi
          echo "Holding ${wait}s for the bar close"
          sleep "$wait"

  # ─────────────────────────────────────────────────────────────────
  # BUILD — package the app into a wheel via the reusable workflow.
  # ─────────────────────────────────────────────────────────────────
  build:
    needs: [gate, notes]
    uses: ./.github/workflows/_build-wheel.yml
    with:
      runner-label: ${{ vars.OPS_RUNNER_LABEL }}
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      version: ${{ needs.notes.outputs.version }}

  # ─────────────────────────────────────────────────────────────────
  # NOTES — whether this push deploys and as which version (ADR-030),
  # and what it carries: the commits on main since the previous deploy
  # tag and the changelog.d lines they added (#626). A notes problem
  # never fails it; a version that cannot be computed does, so nothing
  # ships under a guessed number.
  # ─────────────────────────────────────────────────────────────────
  notes:
    name: Release notes
    needs: gate
    outputs:
      deploy: ${{ steps.version.outputs.deploy }}
      version: ${{ steps.version.outputs.version }}
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || fromJSON('["self-hosted","linux","hermes"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          # Full history and tags: the notes run from the previous deploy tag.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.12.5" }

      # ADR-030 §2-§3: ships when a bundle file changed since the last v
      # tag; the bump comes from the fragments and engine files since it.
      - name: Compute the version
        id: version
        env:
          DEPLOY_ON: ${{ vars.DEPLOY_ON }}
        run: |
          set -euo pipefail
          mkdir -p notes
          uv run --no-project --python 3.14 scripts/deploy/next_version.py \
              --release "$RELEASE_SHA" > notes/version.json
          cat notes/version.json
          read -r ships version < <(uv run --no-project --python 3.14 python -c \
              'import json; v = json.load(open("notes/version.json")); print(str(v["ships"]).lower(), v["version"])')
          if [ "$ships" != true ]; then
              echo "::notice::this push changes nothing the release bundle carries, so it is checked but not deployed (ADR-030 §2)"
          fi
          if [ -n "$DEPLOY_ON" ]; then
              echo "::warning::DEPLOY_ON is retired by ADR-030 and ignored; the Code Owner can delete the variable"
          fi
          echo "deploy=$ships" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          for format in markdown telegram; do
              if ! uv run --no-project --python 3.14 scripts/deploy/release_notes.py \
                  --release "$RELEASE_SHA" --repo "$REPO" --format "$format" --version "$VERSION" > "notes/$format.txt" \
                  || ! grep -q '[^[:space:]]' "notes/$format.txt"; then
                  echo "::warning::release notes ($format) failed or came out empty; shipping a placeholder"
                  printf 'hermes %s is live on hermes-01. Release notes could not be built; commits: %s\n' \
                      "${RELEASE_SHA::12}" "https://github.com/$REPO/commits/$RELEASE_SHA" > "notes/$format.txt"
              fi
          done
          cat notes/markdown.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hermes-release-notes
          path: notes/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  # BUNDLE — one tarball per commit: the CI-built wheel, the hash-pinned
  # requirements from uv.lock, the config/ YAML and the deploy scripts.
  # Runs in dry-run too, so a dry run proves the bundle builds.
  # ─────────────────────────────────────────────────────────────────
  bundle:
    name: Build release bundle
    needs: build
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || fromJSON('["self-hosted","linux","hermes"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.12.5" }

      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hermes-wheel
          path: dist/

      - name: Assemble release bundle
        run: bash scripts/deploy/assemble_bundle.sh "${RELEASE_SHA::12}" dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hermes-release
          path: hermes-release-*.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  # DEPLOY — scp the bundle to the VPS, install it, restart, gate it.
  # Mirrors the tailnet + SSH scaffolding proven in vps-bootstrap.yml
  # (#286, #289, #291, #294, #296, #298).
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [bundle, notes]
    if: inputs.dry_run == true || needs.notes.outputs.deploy == 'true'
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || fromJSON('["self-hosted","linux","hermes"]') }}
    # install_release.sh may hold up to 10 min for the bar close (#626).
    timeout-minutes: 25
    # Only real deploys reach this job, so a pending one can be replaced
    # only by a newer release, never by a no-op run.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    # contents: write only to create the deploy-<sha12> and v<version> releases and tags.
    permissions:
      contents: write
    environment:
      name: prod
      url: https://${{ env.VPS_HOST }}

    steps:
      - name: Ensure openssh-client is installed
        run: |
          set -euo pipefail
          if command -v ssh >/dev/null 2>&1; then
              echo "ssh already available: $(ssh -V 2>&1)"
              exit 0
          fi
          echo "ssh missing — installing openssh-client"
          if command -v apt-get >/dev/null 2>&1; then
              if [ "$(id -u)" = "0" ]; then
                  apt-get update -qq && apt-get install -y openssh-client
              else
                  sudo apt-get update -qq && sudo apt-get install -y openssh-client
              fi
          elif command -v apk >/dev/null 2>&1; then
              if [ "$(id -u)" = "0" ]; then
                  apk add --no-cache openssh-client
              else
                  sudo apk add --no-cache openssh-client
              fi
          else
              echo "ERROR: no supported package manager (apt-get / apk)"
              exit 2
          fi

      # Before the downloads: checkout cleans the workspace. Full history and
      # tags, so the version can be recomputed from the last v tag below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: inputs.dry_run != true
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          # This job's token can write; smoke never needs it in .git/config.
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: inputs.dry_run != true
        with: { version: "0.12.5" }

      - name: Download release bundle
        if: inputs.dry_run != true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hermes-release
          path: release/

      - name: Download release notes
        if: inputs.dry_run != true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hermes-release-notes
          path: notes/

      # ADR-030 §4: the version is settled under the deploy lock. A push
      # that merged while an earlier one was deploying computed its version
      # before that deploy tagged its own, so both would carry one number.
      # Recomputed here from the tags as they are now; when it differs, the
      # wheel and bundle are rebuilt with it. When nothing shipped since the
      # last tag, this is a redeploy of that version under its own number.
      - name: Settle the version under the deploy lock
        if: inputs.dry_run != true
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          built=$(uv run --no-project --python 3.14 python -c 'import json; print(json.load(open("notes/version.json"))["version"])')
          # Rewrites notes/version.json and stamps the tree when the number moved.
          uv run --no-project --python 3.14 scripts/deploy/next_version.py \
              --release "$RELEASE_SHA" --settle notes/version.json > /tmp/hermes-version.json
          read -r moved now < <(uv run --no-project --python 3.14 python -c 'import json, sys; r = json.load(open(sys.argv[1])); print(str(r["moved"]).lower(), r["version"])' /tmp/hermes-version.json)
          if [ "$moved" != true ]; then
              echo "Version $now still holds under the lock."
              exit 0
          fi
          echo "::notice::a deploy that finished first took v$built; this push ships as v$now"
          rm -rf dist release
          uv build --wheel
          mkdir -p release
          bash scripts/deploy/assemble_bundle.sh "${RELEASE_SHA::12}" dist
          mv "hermes-release-${RELEASE_SHA::12}.tar.gz" release/
          uv run --no-project --python 3.14 scripts/deploy/release_notes.py \
              --release "$RELEASE_SHA" --repo "$REPO" --format telegram --version "$now" > notes/telegram.txt

      - name: Join tailnet
        if: inputs.dry_run != true
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          # OAuth client, not an auth key: each run mints a short-lived
          # tagged key, so nothing here expires (#314).
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-runner
          hostname: gh-actions-cd-${{ github.run_id }}
          # Pinned: `latest` downloads whatever shipped that day.
          version: 1.102.4
          tailscaled-args: --tun=userspace-networking

      - name: Prepare SSH keyfile + known_hosts
        if: inputs.dry_run != true
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_id
          chmod 600 ~/.ssh/vps_id
          ssh-keyscan -H "$VPS_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -y -f ~/.ssh/vps_id > /dev/null && echo "keyfile parsed OK"

      - name: Copy release bundle to VPS
        if: inputs.dry_run != true
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          set -euo pipefail
          bundle="release/hermes-release-${RELEASE_SHA::12}.tar.gz"
          if [ ! -f "$bundle" ]; then
              echo "::error::no $bundle in the downloaded artifact"
              exit 1
          fi
          # Private 0700 staging dir, not the world-writable tmp dir: another
          # local user could plant the tarball there before root unpacks and
          # runs it (#782). vps_bootstrap.sh creates it for a non-root deploy
          # user; as root, install -d creates or repairs it here.
          ssh -i ~/.ssh/vps_id -o StrictHostKeyChecking=yes \
              "$VPS_SSH_USER@$VPS_SSH_HOST" install -d -m 0700 /var/lib/hermes-deploy
          echo "shipping $bundle ($(stat -c%s "$bundle") bytes) → $VPS_HOST:/var/lib/hermes-deploy/"
          scp -i ~/.ssh/vps_id -o StrictHostKeyChecking=yes \
              "$bundle" "$VPS_SSH_USER@$VPS_SSH_HOST:/var/lib/hermes-deploy/"

      - name: Mark the deploy start
        id: start
        if: inputs.dry_run != true
        run: echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Install release, restart hermes.service, run health gate
        if: inputs.dry_run != true
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          set -euo pipefail
          # install_release.sh exits 1 when the health gate fails, after it
          # rolled back (or stopped the unit on a first deploy). That fails
          # this step and so the job. ServerAlive keeps the session open
          # through the 30 s the gate spends watching the unit.
          ssh -i ~/.ssh/vps_id -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 \
              "$VPS_SSH_USER@$VPS_SSH_HOST" bash -s -- "${RELEASE_SHA::12}" <<'REMOTE'
          set -euo pipefail
          sha12=$1
          bundle="/var/lib/hermes-deploy/hermes-release-$sha12.tar.gz"
          stage="/var/lib/hermes-deploy/hermes-release-$sha12"
          cleanup() { rm -rf "$stage" "$bundle"; }
          trap cleanup EXIT

          echo "==== hermes deploy $sha12 on $(hostname) ===="
          rm -rf "$stage"
          install -d -m 0700 "$stage"
          tar -xzf "$bundle" -C "$stage"
          # root runs it directly; any other account goes through the narrow
          # sudoers rule that vps_bootstrap.sh writes when DEPLOY_USER is set.
          as_root=()
          if [ "$(id -u)" != "0" ]; then
              as_root=(sudo -n)
          fi
          "${as_root[@]}" /usr/bin/bash "$stage/bin/install_release.sh" "$sha12" "$stage"
          REMOTE

      # ───────────────────────────────────────────────────────────
      # SMOKE — tests/smoke runs read-only checks on hermes-01 over the
      # SSH path above (tailnet and key exist only on this runner, which
      # is why smoke lives in this job). No tests collected (pytest exit
      # 5) or any failure fails the deploy and rolls back.
      # ───────────────────────────────────────────────────────────
      - name: Smoke tests
        id: smoke
        if: inputs.dry_run != true
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          HERMES_SMOKE_SINCE: ${{ steps.start.outputs.epoch }}
          HERMES_SMOKE_REQUIRED: '1'
        run: |
          set -euo pipefail
          export HERMES_SMOKE_RELEASE="${RELEASE_SHA::12}"
          export HERMES_SMOKE_SSH="-i $HOME/.ssh/vps_id -o StrictHostKeyChecking=yes $VPS_SSH_USER@$VPS_SSH_HOST"
          uv sync --frozen
          uv run pytest tests/smoke -m smoke --tb=short -p no:cacheprovider

      - name: Roll back after a failed smoke run
        if: failure() && inputs.dry_run != true && steps.smoke.outcome == 'failure'
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          set -euo pipefail
          echo "::error::Smoke tests failed; rolling hermes-01 back to the previous release."
          ssh -i ~/.ssh/vps_id -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 \
              "$VPS_SSH_USER@$VPS_SSH_HOST" /opt/hermes/bin/rollback.sh

      # A GitHub release per good deploy, tagged deploy-<sha12> on the commit
      # that shipped, with the notes as its body (#626). The tag is how the
      # next deploy finds where its notes start. It is created here, before
      # the Telegram message, because the message links to it: a separate
      # job could wait minutes for a runner and leave the link dead. A
      # failure here is a warning: the box is already running the release.
      - name: Create the release
        if: inputs.dry_run != true
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const sha = process.env.RELEASE_SHA;
            const tag = `deploy-${sha.slice(0, 12)}`;
            const when = new Date().toISOString().slice(0, 16).replace('T', ' ');
            const body = fs.readFileSync('notes/markdown.txt', 'utf8');
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              core.notice(`${tag} already has a release: a redeploy, left as is.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: sha,
              name: `hermes ${when} UTC · ${sha.slice(0, 12)}`,
              body,
              make_latest: 'true',
            });
            core.notice(`Published ${data.html_url}`);

      # Each deploy that ships a new version tags it v<version> on the
      # shipped commit, with this deploy's notes as the release body
      # (ADR-030 §5). A redeploy of a version already tagged leaves the tag.
      # The deploy-<sha12> release stays the latest one, since the notes
      # chain runs on those tags. The box already runs the release, so a
      # failure here lets Telegram still announce it, then fails the job
      # below: without the tag the next push would reuse this number.
      - name: Tag the version
        id: tag
        if: inputs.dry_run != true
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('notes/version.json', 'utf8'));
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: version.tag });
              core.notice(`${version.tag} was tagged by an earlier deploy: left as is.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: version.tag,
              target_commitish: process.env.RELEASE_SHA,
              name: `hermes ${version.tag}`,
              body: fs.readFileSync('notes/markdown.txt', 'utf8'),
              prerelease: false,
              make_latest: 'false',
            });
            core.notice(`Published ${data.html_url}`);

      # The prod environment holds the bot token and chat id, so the message
      # goes from this job. A Telegram outage never fails a good deploy.
      - name: Announce the release on Telegram
        if: inputs.dry_run != true
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.HERMES_TELEGRAM__BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HERMES_TELEGRAM__CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
              echo "::warning::no Telegram token or chat id in the prod environment; not announcing"
              exit 0
          fi
          curl -fsS --max-time 20 -o /dev/null \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text@notes/telegram.txt" \
              --data-urlencode "disable_web_page_preview=true" \
              "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"

      - name: Fail when the version was not tagged
        if: inputs.dry_run != true && steps.tag.outcome == 'failure'
        run: |
          echo "::error::the release is live on hermes-01 but its version tag was not created; the Code Owner creates it on this commit before the next merge, or the next push reuses the number"
          exit 1

      - name: Dry-run notice
        if: inputs.dry_run == true
        run: echo "::notice::dry_run=true — built the bundle, skipped tailnet + scp + install + smoke."

      # The runner container outlives the job, so the key must not.
      - name: Remove the SSH keyfile
        if: always()
        run: rm -f ~/.ssh/vps_id

  # ─────────────────────────────────────────────────────────────────
  # CONFIRM — deploy-gate aggregator
  # ─────────────────────────────────────────────────────────────────
  confirm:
    name: Confirm deployment
    needs: [gate, build, notes, bundle, deploy]
    # Runs after a failure so it can report it, but not when the gate
    # skipped: a CD run for a cancelled or failed CI takes no runner.
    if: "!cancelled() && needs.gate.result != 'skipped'"
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || fromJSON('["self-hosted","linux","hermes"]') }}
    timeout-minutes: 1
    steps:
      - name: Fail when any gate failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "::error::One or more deploy gates failed."
          exit 1

      - name: All gates passed
        run: echo "All deploy gates passed."
