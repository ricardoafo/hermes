# =====================================================================
# AI review — an independent code review on every PR (#590)
# =====================================================================
#
# Rick is the only human reviewer for PRs written by many AI writers, and
# he approves outcomes as product owner rather than reading code. This
# job is the code review: a fresh Claude Code session that never saw the
# writer's reasoning reads the diff, the issue, the spec, AGENTS.md and
# the ADRs, and returns a structured verdict. It has read-only tools and
# posts nothing itself. The last step, which runs no model, turns the
# verdict into one sticky PR comment that opens with a plain-language
# "For Rick" card, and fails this job unless the verdict is Approve with
# no blocking finding.
#
# The job is the "AI review" check. It is advisory until Rick adds it to
# the ruleset's required checks.
#
# ## Pinned from main
#
# The review instructions, the output schema and the comment renderer
# are read from `main`, like the merge queue's gates, so a PR cannot
# soften the review it is judged by. A PR that changes them is reviewed
# by main's copy; only before they exist on main (the PR that adds them)
# does the PR's own copy apply.
#
# ## Secrets
#
#   CLAUDE_CODE_OAUTH_TOKEN  Rick's Claude plan token (`claude setup-token`).
#                            Add it as an Actions secret, and as a
#                            Dependabot secret for Dependabot PRs.
#
# Without the secret the job passes with a notice and posts nothing.
#
# ## Variables (optional)
#
#   AI_REVIEW_MODEL  model id passed to --model; unset uses the default.

name: AI review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# One review per PR at a time; a new push supersedes the running review.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: AI review
    if: ${{ !github.event.pull_request.draft }}
    # Its own small runners: a review mostly waits on the model and must
    # not hold a CI runner while PR tests queue (#631).
    runs-on: ${{ vars.REVIEW_RUNNER_LABEL && fromJSON(vars.REVIEW_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read # the closed issue the review reads alongside the PR
      pull-requests: write # the sticky review comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The diff and main's pinned review files need full history.
          fetch-depth: 0
          # The reviewer reads untrusted PR content; nothing here pushes,
          # so the token must not sit in .git/config.
          persist-credentials: false

      - name: Check the reviewer token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping the AI review."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Gather review context
        id: ctx
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The self-hosted runner has no gh or jq; python3 it does have.
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/ai-review"
          mkdir -p .ai-review "$tools"

          # Main's copy wins; the PR's own copy only bootstraps the first one.
          for f in .github/ai-review/prompt.md .github/ai-review/schema.json tools/pr-metadata/ai-review.cjs; do
            if git cat-file -e "origin/main:$f" 2>/dev/null; then
              git show "origin/main:$f" > "$tools/$(basename "$f")"
            else
              cp "$f" "$tools/$(basename "$f")"
            fi
          done

          # Everything the reviewer needs from git is written here, because
          # it gets no shell: `git log --output=` and friends could write
          # files (#778).
          git diff "$BASE_SHA...$HEAD_SHA" > .ai-review/diff.patch
          git diff --name-status "$BASE_SHA...$HEAD_SHA" > .ai-review/files.txt
          git log --format='commit %h%n%s%n%n%b' "$BASE_SHA..$HEAD_SHA" > .ai-review/log.txt

          # The token travels only in a request header, never in a command
          # line or an error message: pr.md goes to the model (#642).
          python3 - .ai-review/pr.md <<'PY'
          import json, os, re, sys, urllib.request
          repo = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"

          def api(path):
              req = urllib.request.Request(f"{repo}/{path}", headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          def failure(err):
              status = getattr(err, "code", None)
              return type(err).__name__ + (f" (HTTP {status})" if status else "")

          pr = api(f"pulls/{os.environ['PR_NUMBER']}")
          body = pr.get("body") or ""
          out = [f"# PR #{pr['number']}: {pr['title']}", "", body, ""]
          m = re.search(r"\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b", body, re.I)
          if m:
              try:
                  issue = api(f"issues/{m.group(1)}")
                  out += [f"# Closed issue #{issue['number']}: {issue['title']}", "", issue.get("body") or ""]
              except Exception as err:  # the review still runs without the issue
                  out += [f"(Could not read issue #{m.group(1)}: {failure(err)})"]
          open(sys.argv[1], "w").write("\n".join(out))
          PY

          {
            echo "prompt<<AI_REVIEW_EOF"
            cat "$tools/prompt.md"
            echo "AI_REVIEW_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "schema=$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",", ":")))' "$tools/schema.json")" >> "$GITHUB_OUTPUT"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

      # The checkout is the PR's merge ref, so a PR could add hooks,
      # permissions, MCP servers or instructions that Claude Code loads
      # from the working tree. The reviewer needs none of them (#778).
      - name: Remove the PR's agent settings from the checkout
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o \( -name .claude -o -name .mcp.json -o -name CLAUDE.md -o -name CLAUDE.local.md \) -print0 \
            | xargs -0 -r rm -rf

      # The runner image bakes the Bun and Claude Code versions this action
      # pins (gh-runner Dockerfile), and its bun cache is a volume. Use the
      # baked binaries when they are the pinned versions, so a review
      # downloads nothing; otherwise the action installs its own.
      - name: Baked Bun and Claude Code
        id: baked
        if: steps.token.outputs.present == 'true'
        env:
          BUN_PIN: "1.3.6"
          CLAUDE_PIN: "2.1.112"
        run: |
          bun=$(command -v bun || true)
          if [ -n "$bun" ] && [ "$("$bun" --version)" = "$BUN_PIN" ]; then
            echo "bun=$bun" >> "$GITHUB_OUTPUT"
            echo "Using baked bun $BUN_PIN at $bun"
          else
            echo "::notice::No baked bun $BUN_PIN; the action downloads it."
          fi
          claude=$(command -v claude || true)
          if [ -n "$claude" ] && "$claude" --version 2>/dev/null | grep -q "^$CLAUDE_PIN "; then
            echo "claude=$claude" >> "$GITHUB_OUTPUT"
            echo "Using baked Claude Code $CLAUDE_PIN at $claude"
          else
            echo "::notice::No baked Claude Code $CLAUDE_PIN; the action downloads it."
          fi

      - name: Review
        id: review
        if: steps.token.outputs.present == 'true'
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        with:
          path_to_bun_executable: ${{ steps.baked.outputs.bun }}
          path_to_claude_code_executable: ${{ steps.baked.outputs.claude }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: 'dependabot[bot]'
          prompt: ${{ steps.ctx.outputs.prompt }}
          claude_args: >-
            ${{ vars.AI_REVIEW_MODEL && format('--model {0}', vars.AI_REVIEW_MODEL) || '' }}
            --max-turns 80
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch"
            --json-schema '${{ steps.ctx.outputs.schema }}'

      - name: Post the review and set the check
        if: ${{ !cancelled() && steps.token.outputs.present == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TOOLS: ${{ steps.ctx.outputs.tools }}
          OUTPUT: ${{ steps.review.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const os = require('os');
            const path = require('path');
            const { execFileSync } = require('child_process');
            // main's copy, read now into a fresh directory: nothing the
            // review step could have touched is loaded with this token
            // (#778). The PR's own copy only bootstraps a main without one.
            let libPath = path.join(process.env.TOOLS, 'ai-review.cjs');
            try {
              const fresh = path.join(fs.mkdtempSync(path.join(os.tmpdir(), 'ai-review-')), 'ai-review.cjs');
              fs.writeFileSync(fresh, execFileSync('git', ['show', 'origin/main:tools/pr-metadata/ai-review.cjs']));
              libPath = fresh;
            } catch (err) {
              core.warning(`ai-review.cjs not on main yet; using the PR's copy (${err.message.split('\n')[0]})`);
            }
            const lib = require(libPath);
            const file = process.env.EXECUTION_FILE;
            const metrics = lib.parseMetrics(file && fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const meta = {
              headSha: process.env.HEAD_SHA,
              runUrl: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              metrics,
            };

            let body;
            let result;
            try {
              let review = lib.parseReview(process.env.OUTPUT);
              if (typeof lib.guardReviewPath === 'function') {
                const touched = lib.reviewPathChanges(fs.readFileSync('.ai-review/files.txt', 'utf8'));
                review = lib.guardReviewPath(review, touched);
              }
              body = lib.renderComment(review, meta);
              result = lib.outcome(review);
            } catch (err) {
              body = lib.renderFailure(err.message, meta);
              result = { pass: false, reason: err.message };
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = lib.stickyCommentId(comments);
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

            // Cost-efficiency record: one row per review in the run summary.
            if (metrics) {
              await core.summary
                .addHeading('AI review cost', 3)
                .addTable([
                  ['PR', 'Head', 'Time (s)', 'Turns', 'Input tokens', 'Output tokens', 'Cached tokens', 'USD at API prices'],
                  [String(issue_number), meta.headSha.slice(0, 7), String(metrics.seconds), String(metrics.turns),
                    String(metrics.inputTokens), String(metrics.outputTokens), String(metrics.cacheReadTokens),
                    metrics.costUsd.toFixed(4)],
                ])
                .write();
              core.notice(`AI review: ${lib.metricsLine(metrics)}`);
            }

            if (result.pass) {
              core.notice(result.reason);
            } else {
              core.setFailed(result.reason);
            }
