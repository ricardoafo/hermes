# =====================================================================
# Scheduled — the checks that run on a clock, not on a PR
# =====================================================================
#
# One workflow for everything that is too slow, too external or too
# codebase-wide for PR CI. It replaces nightly-quality.yml and
# mutation.yml, whose 03:00 runs sat queued until GitHub cancelled them
# because the self-hosted pool is offline at night.
#
# ## Schedule
#
#   30 11 * * *   daily (Europe/Madrid): Semgrep + contract tests + fresh seeds
#   45 11 * * 0   Sundays: the cosmic-ray mutation run, remote branch prune
#
# 11:30 Madrid time keeps the daily checks in the day, when the
# self-hosted runners are awake, and off the 14:00 Madrid approval window
# and the merges that follow it (#694). The Sunday
# cron is a separate entry so the long mutation run never delays the
# daily checks. Manual dispatch runs the daily jobs,
# and the mutation run too when `mutation` is ticked.
#
# ## Jobs
#
# - semgrep: SAST over the whole tree (p/security-audit + p/python).
#   Installed with `uv tool` because the action needs Docker-in-Docker,
#   which the runner containers cannot do.
# - contract: real HTTPS against third-party sandboxes (Binance and
#   Kraken public endpoints, Kraken TradeVolume fees, Telegram getMe,
#   Slack auth.test, Sentry DSN parse, Healthchecks /start). Read-only or informational calls only;
#   each test skips when its secret is absent. Catches upstream drift
#   the unit-tier mocks cannot see.
# - fresh-seeds: 150 new seeds of each generated market path (#869). PR CI
#   runs the same twenty; a defect that needs a rarer path shows up here.
#   The start is the day number times 1000, so each day's seeds are new and
#   a run is reproducible from its date. Failing seeds are filed as one
#   issue with the rerun command. About 18 CPU-minutes, 4 workers.
# - mutation: cosmic-ray on the modules in cosmic-ray.toml, dealt over six
#   parallel shards of about 190 mutants (~25 minutes each at ~8 s a
#   mutant), each capped at 40 minutes (#1213).
# - mutation-verdict: merges the shards and always ends PASS or FAIL: a
#   mutant no shard ran fails it, and so does a kill rate below the floor.
# - branch-prune: deletes remote branches of PRs closed unmerged more
#   than 3 days ago and no-PR branches idle more than 14 days
#   (scripts/dev/prune-merged-branches.sh --remote-only). Merged PR
#   branches are already deleted on merge. The age limits keep in-flight
#   work, which has no PR until it is finished, out of reach.

name: Scheduled

on:
  schedule:
    - cron: '30 11 * * *'
      timezone: Europe/Madrid
    - cron: '45 11 * * 0'
  workflow_dispatch:
    inputs:
      mutation:
        description: 'Also run the cosmic-ray mutation job'
        type: boolean
        default: false
        required: false

concurrency:
  group: scheduled-${{ github.event.schedule || 'dispatch' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  KILL_RATE_ADVISORY: "false"  # #406: blocking on lots + value objects
  KILL_RATE_FLOOR: "80"

jobs:
  semgrep:
    name: Semgrep (SAST)
    if: github.event.schedule != '45 11 * * 0'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || fromJSON('["self-hosted","linux","hermes"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.12.5" }
      - run: uv tool install semgrep==1.176.1
      - run: uv tool run semgrep scan --config p/security-audit --config p/python --error

  contract:
    name: Contract tests
    if: github.event.schedule != '45 11 * * 0'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || fromJSON('["self-hosted","linux","hermes"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.12.5" }
      - run: uv sync --frozen

      - name: Run contract tier
        env:
          HERMES_TELEGRAM__BOT_TOKEN: ${{ secrets.HERMES_TELEGRAM__BOT_TOKEN }}
          HERMES_SLACK__BOT_TOKEN: ${{ secrets.HERMES_SLACK__BOT_TOKEN }}
          HERMES_SENTRY__DSN: ${{ secrets.HERMES_SENTRY__DSN }}
          HERMES_HEALTHCHECKS__PING_URL: ${{ secrets.HERMES_HEALTHCHECKS__PING_URL }}
          HERMES_KRAKEN__API_KEY: ${{ secrets.HERMES_KRAKEN__API_KEY }}
          HERMES_KRAKEN__API_SECRET: ${{ secrets.HERMES_KRAKEN__API_SECRET }}
        # -m contract overrides the `not contract` addopts filter.
        run: uv run pytest tests/contract -m contract --tb=short -p no:cacheprovider

  # Runs on the daily 11:30 trigger, Sundays included; it skips the separate
  # Sunday 11:45 mutation trigger so it runs once a day, not twice on Sunday.
  fresh-seeds:
    name: Fresh scenario seeds
    if: github.event.schedule != '45 11 * * 0'
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || fromJSON('["self-hosted","linux","hermes"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.12.5" }
      - run: uv sync --frozen

      - name: Run 150 new seeds of each generator
        id: seeds
        shell: bash
        run: |
          set -uo pipefail
          spec="150@$(( $(date -u +%s) / 86400 * 1000 ))"
          echo "spec=${spec}" >> "$GITHUB_OUTPUT"
          echo "::notice::HERMES_SCENARIO_SEEDS=${spec}"
          HERMES_SCENARIO_SEEDS="${spec}" uv run pytest \
            tests/integration/scenarios/test_generated_paths.py \
            -k test_every_rule_holds_after_every_bar -n 4 \
            --tb=short -p no:cacheprovider --junitxml=fresh-seeds.xml || true

      - name: File failing seeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC: ${{ steps.seeds.outputs.spec }}
        run: |
          set -uo pipefail
          uv run python scripts/dev/fresh-seed-report.py fresh-seeds.xml "${SPEC}" > issue.md
          rc=$?
          if [[ "$rc" == 0 ]]; then
            echo "Every fresh seed passed."
            exit 0
          fi
          if [[ "$rc" != 1 ]]; then
            echo "::error::the seed run left no readable report"
            exit 1
          fi
          # The run summary keeps the failing seeds even if filing the issue fails.
          cat issue.md >> "$GITHUB_STEP_SUMMARY"
          if gh issue create \
            --title "test: fresh scenario seeds broke a rule ($(date -u +%F))" \
            --body-file issue.md \
            --label type:test --label p2 --label area:domain --label size:s \
            --milestone "MVP1 — Simulation ready" \
            --assignee rafo-claude-bot; then
            echo "::error::fresh seeds failed; filed as an issue"
          else
            echo "::error::fresh seeds failed and the issue could not be filed; the failing seeds are in this run's summary"
          fi
          exit 1

  # The mutants are dealt over MUTATION_SHARDS legs (#1213): one runner
  # running all ~1,100 one after another needs about 2.5 hours. Each leg
  # caps cosmic-ray at 40 minutes and uploads its session even when cut
  # off; mutation-verdict merges them and always ends PASS or FAIL.
  mutation:
    name: Cosmic-ray mutation shard ${{ matrix.index }}
    if: >-
      github.event.schedule == '45 11 * * 0' ||
      (github.event_name == 'workflow_dispatch' && inputs.mutation)
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || fromJSON('["self-hosted","linux","hermes"]') }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5]
    env:
      MUTATION_SHARDS: "6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.12.5" }

      - name: Sync dev deps (frozen)
        run: uv sync --frozen

      - name: Baseline (unmutated tests must be green)
        run: uv run cosmic-ray baseline cosmic-ray.toml

      - name: Initialize this shard's session
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          rm -f mutation-session.sqlite
          uv run cosmic-ray init cosmic-ray.toml mutation-session.sqlite
          uv run python scripts/dev/mutation-shard.py select mutation-session.sqlite \
            --shards "${MUTATION_SHARDS}" --index "${SHARD_INDEX}"

      - name: Execute this shard's mutants
        # Capped below the job limit so the session upload below still runs;
        # mutants left unrun make the verdict FAIL as incomplete.
        run: timeout 40m uv run cosmic-ray exec cosmic-ray.toml mutation-session.sqlite

      - name: Upload this shard's session
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cosmic-ray-shard-${{ matrix.index }}
          path: mutation-session.sqlite
          retention-days: 30

  mutation-verdict:
    name: Cosmic-ray mutation verdict
    needs: mutation
    if: >-
      always() && (
      github.event.schedule == '45 11 * * 0' ||
      (github.event_name == 'workflow_dispatch' && inputs.mutation))
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || fromJSON('["self-hosted","linux","hermes"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.12.5" }

      - name: Sync dev deps (frozen)
        run: uv sync --frozen

      - name: Download every shard's session
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cosmic-ray-shard-*
          path: ${{ runner.temp }}/shards

      # A leg that never uploaded leaves its share unrun, which the verdict
      # reports as incomplete: the init below lists every mutant of the config.
      - name: Merge the shards and enforce the kill-rate floor
        shell: bash
        run: |
          set -euo pipefail
          rm -f all-mutants.sqlite
          uv run cosmic-ray init cosmic-ray.toml all-mutants.sqlite
          mapfile -t sessions < <(find "${RUNNER_TEMP}/shards" -name mutation-session.sqlite | sort)
          status=0
          uv run python scripts/dev/mutation-shard.py verdict all-mutants.sqlite "${sessions[@]}" \
            --floor "${KILL_RATE_FLOOR}" --summary "${GITHUB_STEP_SUMMARY}" > mutation-verdict.md || status=$?
          cat mutation-verdict.md
          if [[ "${KILL_RATE_ADVISORY}" == "true" ]]; then
            echo "Advisory mode: verdict exit ${status}, not blocking."
            exit 0
          fi
          exit "${status}"

      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cosmic-ray-verdict
          path: mutation-verdict.md
          retention-days: 30

  freshness:
    name: Tool freshness report
    if: >-
      github.event.schedule == '45 11 * * 0' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || fromJSON('["self-hosted","linux","hermes"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Pins Dependabot cannot update; the report lands in the run summary
      # and as one warning per stale pin. Read-only (#906).
      - name: Report pins behind their latest release
        run: python3 scripts/dev/freshness-check.py

  branch-prune:
    name: Prune stale remote branches
    if: >-
      github.event.schedule == '45 11 * * 0' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || fromJSON('["self-hosted","linux","hermes"]') }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Delete closed and orphaned remote branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/dev/prune-merged-branches.sh --yes --remote-only
