# =====================================================================
# Scheduled — the checks that run on a clock, not on a PR
# =====================================================================
#
# One workflow for everything that is too slow, too external or too
# codebase-wide for PR CI. It replaces nightly-quality.yml and
# mutation.yml, whose 03:00 runs sat queued until GitHub cancelled them
# because the self-hosted pool is offline at night.
#
# ## Schedule
#
#   30 11 * * *   daily: Semgrep + contract tests
#   45 11 * * 0   Sundays: the cosmic-ray mutation run, e2e tests, remote branch prune
#
# 11:30 UTC is when the self-hosted pool is reliably online. The Sunday
# cron is a separate entry so the long mutation run never delays the
# daily checks. Manual dispatch runs the daily jobs and the e2e tests,
# and the mutation run too when `mutation` is ticked.
#
# ## Jobs
#
# - semgrep: SAST over the whole tree (p/security-audit + p/python).
#   Installed with `uv tool` because the action needs Docker-in-Docker,
#   which the runner containers cannot do.
# - contract: real HTTPS against third-party sandboxes (Binance and
#   Kraken public endpoints, Kraken TradeVolume fees, Telegram getMe,
#   Slack auth.test, Sentry DSN parse, Healthchecks /start). Read-only or informational calls only;
#   each test skips when its secret is absent. Catches upstream drift
#   the unit-tier mocks cannot see.
# - e2e: the real `hermes serve` composition root replays recorded
#   Binance bars (tests/e2e). Offline and keyless.
# - mutation: cosmic-ray on the modules in cosmic-ray.toml, with the
#   kill-rate floor (advisory until #406 enforces it).
# - branch-prune: deletes remote branches of PRs closed unmerged more
#   than 3 days ago and no-PR branches idle more than 14 days
#   (scripts/dev/prune-merged-branches.sh --remote-only). Merged PR
#   branches are already deleted on merge. The age limits keep in-flight
#   work, which has no PR until it is finished, out of reach.

name: Scheduled

on:
  schedule:
    - cron: '30 11 * * *'
    - cron: '45 11 * * 0'
  workflow_dispatch:
    inputs:
      mutation:
        description: 'Also run the cosmic-ray mutation job'
        type: boolean
        default: false
        required: false

concurrency:
  group: scheduled-${{ github.event.schedule || 'dispatch' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  KILL_RATE_ADVISORY: "false"  # #406: blocking on lots + value objects
  KILL_RATE_FLOOR: "80"

jobs:
  semgrep:
    name: Semgrep (SAST)
    if: github.event.schedule != '45 11 * * 0'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { version: "0.12.5" }
      - run: uv tool install semgrep==1.176.1
      - run: uv tool run semgrep scan --config p/security-audit --config p/python --error

  contract:
    name: Contract tests
    if: github.event.schedule != '45 11 * * 0'
    # The notifier, Sentry, healthchecks and Kraken secrets live in the
    # main-only prod environment, never at repo level, so no branch can
    # read them (#768).
    environment: prod
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { version: "0.12.5" }
      - run: uv sync --frozen

      - name: Run contract tier
        env:
          HERMES_TELEGRAM__BOT_TOKEN: ${{ secrets.HERMES_TELEGRAM__BOT_TOKEN }}
          HERMES_SLACK__BOT_TOKEN: ${{ secrets.HERMES_SLACK__BOT_TOKEN }}
          HERMES_SENTRY__DSN: ${{ secrets.HERMES_SENTRY__DSN }}
          HERMES_HEALTHCHECKS__PING_URL: ${{ secrets.HERMES_HEALTHCHECKS__PING_URL }}
          HERMES_KRAKEN__API_KEY: ${{ secrets.HERMES_KRAKEN__API_KEY }}
          HERMES_KRAKEN__API_SECRET: ${{ secrets.HERMES_KRAKEN__API_SECRET }}
        # -m contract overrides the `not contract` addopts filter.
        run: uv run pytest tests/contract -m contract --tb=short -p no:cacheprovider

  e2e:
    name: End-to-end tests
    if: github.event.schedule == '45 11 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { version: "0.12.5" }
      - run: uv sync --frozen

      - name: Run e2e tier
        run: uv run pytest tests/e2e -m e2e --tb=short -p no:cacheprovider

  mutation:
    name: Cosmic-ray mutation run
    if: >-
      github.event.schedule == '45 11 * * 0' ||
      (github.event_name == 'workflow_dispatch' && inputs.mutation)
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { version: "0.12.5" }

      - name: Sync dev deps (frozen)
        run: uv sync --frozen

      - name: Baseline (unmutated tests must be green)
        run: uv run cosmic-ray baseline cosmic-ray.toml

      - name: Initialize mutation session
        run: |
          rm -f mutation-session.sqlite
          uv run cosmic-ray init cosmic-ray.toml mutation-session.sqlite

      - name: Execute mutations
        # The local distributor runs sequentially. If wall-clock grows,
        # switch to the http worker or shard by module_path across legs.
        run: uv run cosmic-ray exec cosmic-ray.toml mutation-session.sqlite

      - name: Compute kill rate
        id: rate
        shell: bash
        run: |
          set -euo pipefail
          survival=$(uv run cr-rate mutation-session.sqlite | tr -d '\r')
          kill=$(python3 -c "print(f'{100 - float('${survival}'):.2f}')")
          echo "survival=${survival}" >> "$GITHUB_OUTPUT"
          echo "kill=${kill}" >> "$GITHUB_OUTPUT"
          echo "::notice::Mutation kill rate: ${kill}% (survivors: ${survival}%)"

      - name: Publish detailed report
        if: always()
        run: uv run cr-report mutation-session.sqlite > cosmic-ray-report.txt

      - name: Upload session + report as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cosmic-ray-session
          path: |
            mutation-session.sqlite
            cosmic-ray-report.txt
          retention-days: 30

      - name: Enforce kill-rate floor
        shell: bash
        run: |
          set -euo pipefail
          kill="${{ steps.rate.outputs.kill }}"
          floor="${KILL_RATE_FLOOR}"
          if [[ "${KILL_RATE_ADVISORY}" == "true" ]]; then
            echo "Advisory mode — kill=${kill}% (floor ${floor}%), NOT blocking."
            exit 0
          fi
          if python3 -c "import sys; sys.exit(0 if float('${kill}') >= float('${floor}') else 1)"; then
            echo "Kill rate ${kill}% ≥ ${floor}% — pass."
          else
            echo "::error::Kill rate ${kill}% below floor ${floor}%"
            exit 1
          fi

  branch-prune:
    name: Prune stale remote branches
    if: >-
      github.event.schedule == '45 11 * * 0' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Delete closed and orphaned remote branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/dev/prune-merged-branches.sh --yes --remote-only
