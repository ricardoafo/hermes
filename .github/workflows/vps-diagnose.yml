# =====================================================================
# VPS diagnose — read ground-truth state of the provisioned VPS
# =====================================================================
#
# Manual-only workflow (`workflow_dispatch`). SSHes into the production
# VPS using the same secrets the future CD deploy body (#179) will use
# — validates the secret plumbing works AND emits a structured snapshot
# of the VPS state (OS, python, /opt/hermes, systemd units, disk), plus
# hermes.service itself: unit status, the last hour of journal, the
# failure-alert units, the per-integration `hermes health` probes and
# the newest processed bar per stream from the ledger (#348).
#
# Zero side effects: only READ commands. Never writes / installs /
# restarts anything on the VPS. The health probes skip `healthchecks`
# (its probe sends a /start ping) and the ledger is opened read-only.
#
# ## Trigger
#
#   workflow_dispatch:
#     Operator runs this from the Actions tab (or `gh workflow run
#     vps-diagnose.yml`) when they want a state snapshot — typically
#     before filling / modifying the CD deploy body.
#
# ## Why an Environment
#
# `environment: prod` scopes secret access to the Environment's
# protection rules (required reviewers, wait timers, etc.). The prod
# Environment already holds the VPS_SSH_* secrets — this workflow just
# consumes them.
#
# ## Related
#
#   .github/workflows/cd.yml — Fill order in its header lists this
#   diagnostic as a prerequisite for deploy-body work.
#   docs/guides/vps-operations.md — Operational runbook the deploy
#   body will implement against.
#   #276 — tracking issue.

name: VPS diagnose

on:
  workflow_dispatch:

concurrency:
  group: vps-diagnose
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: Snapshot VPS state
    # Runs on the self-hosted runner (GitHub-hosted minutes are exhausted
    # on this account — the whole-year self-hosted allocation is paid).
    # The runner container is minimal and lacks openssh-client; the
    # first step installs it at runtime.
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    environment: prod
    timeout-minutes: 5

    steps:
      # Join the tailnet as an ephemeral device using the auth key.
      # The VPS is fronted by Tailscale SSH (previous dispatch hung on
      # the "visit login.tailscale.com/a/..." interactive prompt) — this
      # step provides device-level auth so the subsequent SSH connection
      # succeeds without human interaction.
      #
      # Uses `hostname: gh-actions-vps-diagnose-${{ github.run_id }}` so
      # the ephemeral device is uniquely identifiable in Tailscale admin
      # logs. Ephemeral flag on the auth key ensures the device is
      # cleaned up when the runner terminates.
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: gh-actions-vps-diagnose-${{ github.run_id }}
          # Pinned: `latest` downloads whatever shipped that day.
          version: 1.102.4
          # Self-hosted runner is a Docker container without NET_ADMIN /
          # /dev/net/tun — tailscaled would crash on startup without this.
          # NOT settable via `env: ADDITIONAL_DAEMON_ARGS=…` — the value
          # is sourced from `inputs.tailscaled-args` inside the composite
          # action's Start-Daemon step. See tailscale/github-action@v3
          # action.yml:285.
          tailscaled-args: --tun=userspace-networking

      # Install openssh-client if missing. Self-hosted runner container
      # is minimal (no ssh / ssh-keygen / ssh-keyscan by default).
      # Detects the package manager (apt-get for Debian/Ubuntu bases,
      # apk for Alpine) and installs only when needed — no-op on hosts
      # that already have ssh.
      - name: Ensure openssh-client is installed
        run: |
          set -euo pipefail
          if command -v ssh >/dev/null 2>&1; then
              echo "ssh already available: $(ssh -V 2>&1)"
              exit 0
          fi
          echo "ssh missing — attempting to install openssh-client"
          if command -v apt-get >/dev/null 2>&1; then
              if [ "$(id -u)" = "0" ]; then
                  apt-get update -qq && apt-get install -y openssh-client
              else
                  sudo apt-get update -qq && sudo apt-get install -y openssh-client
              fi
          elif command -v apk >/dev/null 2>&1; then
              if [ "$(id -u)" = "0" ]; then
                  apk add --no-cache openssh-client
              else
                  sudo apk add --no-cache openssh-client
              fi
          else
              echo "ERROR: no supported package manager (apt-get / apk) — bake openssh-client into the runner image"
              exit 2
          fi
          command -v ssh && echo "ssh installed: $(ssh -V 2>&1)"

      # Write the private key to a keyfile (chmod 600) instead of using
      # ssh-agent. The self-hosted runner image doesn't ship ssh-agent;
      # keyfile approach works on any runner with `ssh` binary.
      - name: Prepare SSH keyfile + known_hosts
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write key. `printf '%s\n'` guarantees trailing newline
          # (openssh requires it; some secret UIs strip it).
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_id
          chmod 600 ~/.ssh/vps_id
          # Populate known_hosts (`-H` hashes hostnames — matches GH convention).
          ssh-keyscan -H "$VPS_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Sanity check — don't leak the key, just confirm it parsed.
          ssh-keygen -y -f ~/.ssh/vps_id > /dev/null && echo "keyfile parsed OK"

      - name: Run diagnostic checklist
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          set -e
          # Heredoc runs on the REMOTE — quoted so local shell doesn't expand.
          ssh -i ~/.ssh/vps_id -o StrictHostKeyChecking=yes \
            "$VPS_SSH_USER@$VPS_SSH_HOST" bash << 'REMOTE'
          set +e  # Individual command failures are informational, not fatal.

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  1. OS + kernel"
          echo "════════════════════════════════════════════════════════"
          lsb_release -a 2>/dev/null || cat /etc/os-release
          echo ""
          uname -a

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  2. Python + uv"
          echo "════════════════════════════════════════════════════════"
          which python3 && python3 --version
          which uv && uv --version || echo "uv NOT INSTALLED"

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  3. Hermes install directory (/opt/hermes)"
          echo "════════════════════════════════════════════════════════"
          if [ -d /opt/hermes ]; then
              ls -la /opt/hermes
              echo ""
              echo "-- git state --"
              (cd /opt/hermes && git log -1 --oneline 2>/dev/null && git status --short 2>/dev/null) || echo "not a git repo"
          else
              echo "NOT INSTALLED — /opt/hermes does not exist"
          fi

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  4. Hermes systemd units"
          echo "════════════════════════════════════════════════════════"
          systemctl list-units --type=service --all 2>/dev/null | grep -i hermes || echo "NONE"
          echo ""
          echo "-- unit files on disk --"
          ls -la /etc/systemd/system/hermes-* 2>/dev/null || echo "NONE"

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  5. Runtime user + FHS directories"
          echo "════════════════════════════════════════════════════════"
          id hermes 2>&1 || echo "hermes user does NOT exist"
          for d in /opt/hermes /var/log/hermes /etc/hermes /var/lib/hermes; do
              if [ -d "$d" ]; then
                  stat -c "  %n  %U:%G  %a" "$d"
              else
                  echo "  $d  NOT EXIST"
              fi
          done

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  6. Storage-box mount"
          echo "════════════════════════════════════════════════════════"
          if mountpoint -q /mnt/storage-box 2>/dev/null; then
              echo "MOUNTED"
              df -h /mnt/storage-box
              echo "-- contents --"
              ls -la /mnt/storage-box/ 2>/dev/null | head -20
          else
              echo "NOT MOUNTED"
              [ -d /mnt/storage-box ] && echo "(mount point directory exists)" || echo "(mount point directory does not exist)"
          fi

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  7. Disk + memory"
          echo "════════════════════════════════════════════════════════"
          df -h / /var 2>/dev/null
          echo ""
          free -h

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  8. Firewall (UFW)"
          echo "════════════════════════════════════════════════════════"
          sudo -n ufw status verbose 2>&1 | head -20 || echo "UFW status unavailable (needs sudo)"

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  9. Fail2ban"
          echo "════════════════════════════════════════════════════════"
          systemctl is-active fail2ban 2>/dev/null || echo "fail2ban NOT installed / not running"

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  10. GH Actions runner"
          echo "════════════════════════════════════════════════════════"
          systemctl list-units --type=service --all 2>/dev/null | grep -i "runner" || echo "NO runner service found"

          # Section 11 reads secrets and the ledger, so it needs root; the
          # CD account is root today, a non-root one goes through sudo -n.
          as_root=""
          [ "$(id -u)" -eq 0 ] || as_root="sudo -n"
          hermes_bin=/opt/hermes/current/.venv/bin/hermes

          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  11. hermes.service: status, journal, probes, ledger"
          echo "════════════════════════════════════════════════════════"
          systemctl status hermes.service --no-pager -l 2>&1 | head -30
          echo ""
          echo "-- failure-alert units --"
          systemctl list-units --all --no-pager 'hermes-notify-failure@*' 2>&1 | head -10
          $as_root journalctl -u 'hermes-notify-failure@*' --since "-24h" --no-pager 2>&1 | tail -30
          echo ""
          echo "-- journal, last 60 min (tail 150) --"
          $as_root journalctl -u hermes.service --since "-60 min" --no-pager 2>&1 | tail -150
          echo ""
          echo "-- serve lifecycle events, last 24h --"
          $as_root journalctl -u hermes.service --since "-24h" --no-pager 2>&1 \
            | grep -E 'serve\.(run|warmup|cursor|close|notify|signal)\.' | tail -40 || echo "none"
          echo ""
          # Per-integration probes only: `hermes health` with no argument also
          # runs the healthchecks probe, which sends a /start ping (a write).
          echo "-- hermes health probes --"
          if [ -x "$hermes_bin" ]; then
              for integration in market_data telegram slack sentry; do
                  $as_root bash -c 'set -a; . /etc/hermes/env.production; set +a; cd /var/lib/hermes && exec runuser -u hermes -- "$1" health "$2"' \
                    _ "$hermes_bin" "$integration" 2>&1 | tail -15
                  echo ""
              done
              # One plain line on whether prod errors reach Sentry (#381). The
              # probe only parses the DSN; it sends no event. Exit 3 is its
              # NOT_CONFIGURED code (empty HERMES_SENTRY__DSN).
              $as_root bash -c 'set -a; . /etc/hermes/env.production; set +a; cd /var/lib/hermes && exec runuser -u hermes -- "$1" health sentry' \
                _ "$hermes_bin" > /dev/null 2>&1
              case $? in
                  0) echo "Sentry: CONFIGURED (DSN parses; prod errors are reported)" ;;
                  3) echo "Sentry: NOT_CONFIGURED (HERMES_SENTRY__DSN is empty in /etc/hermes/env.production; errors reach the journal only)" ;;
                  *) echo "Sentry: FAIL (the DSN does not parse; see the sentry probe above)" ;;
              esac
              echo ""
          else
              echo "$hermes_bin missing: no release installed"
          fi
          # The verdict and per-stream table every console surface shares
          # (#370); read-only. Releases older than #370 print an unknown
          # command error here, and the raw ledger query below still runs.
          echo "-- hermes status --"
          if [ -x "$hermes_bin" ]; then
              $as_root bash -c 'set -a; . /etc/hermes/env.production; set +a; cd /var/lib/hermes && COLUMNS=120 exec runuser -u hermes -- "$1" status --config-dir /opt/hermes/current/config --db /var/lib/hermes/hermes.sqlite3' \
                _ "$hermes_bin" 2>&1 | head -40
              echo ""
          fi
          # Newest BarProcessed per stream, read-only: confirms the loop
          # handled the latest closed bars (4h bars close 00/04/08/12/16/20 UTC).
          echo "-- last processed bar per stream (ledger, read-only) --"
          if [ -x "$hermes_bin" ] && [ -f /var/lib/hermes/hermes.sqlite3 ]; then
              $as_root runuser -u hermes -- /opt/hermes/current/.venv/bin/python -c '
          import sqlite3
          conn = sqlite3.connect("file:/var/lib/hermes/hermes.sqlite3?mode=ro", uri=True)
          rows = conn.execute(
              "SELECT json_extract(payload_json, ?), json_extract(payload_json, ?),"
              " json_extract(payload_json, ?), MAX(occurred_at), COUNT(*) FROM events"
              " WHERE event_type = ? GROUP BY 1, 2, 3 ORDER BY 1, 2, 3",
              ("$.pair.base", "$.pair.quote", "$.interval", "BarProcessed"),
          ).fetchall()
          for base, quote, interval, last, count in rows:
              print(f"  {base}/{quote:<6} {interval:<4} last close {last}  ({count} bars)")
          if not rows:
              print("  no BarProcessed rows")
          ' 2>&1 | head -20
          else
              echo "no release or no ledger at /var/lib/hermes/hermes.sqlite3"
          fi

          echo ""
          echo "═════════════ DIAGNOSTIC COMPLETE ═════════════"
          REMOTE
