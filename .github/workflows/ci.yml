name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Ref-based per-PR concurrency (closes #174). Pushing a fix to a PR
# cancels the previous in-progress CI run for that PR — different PRs
# still run in parallel because each has its own ref. On push to main
# the group is refs/heads/main; consecutive main pushes DO cancel
# earlier in-progress runs so we don't waste runner slots on
# already-superseded main commits.
#
# There is deliberately NO global group to serialize PRs: a concurrency
# group keeps one pending run and cancels the older pending ones, so it
# would silently drop queued PRs. Runs stay whole through job shape
# instead — see the `checks` job below (#397).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # CHECKS — every per-PR gate in ONE job, one step per check (#397).
  #
  # Why one job: the self-hosted pool is a handful of runners and the
  # suite used to fan out into ~15 jobs. With several PRs pushing at
  # once their jobs interleaved in the runner queue, so PR A's Quality
  # and Unit legs waited behind PR B's and PR C's jobs and nobody
  # finished. Now a run asks for one runner for its whole suite: GitHub
  # hands queued jobs to idle runners first come, first served, and once
  # a run starts nothing from another PR can cut in. Up to one PR per
  # runner runs side by side; nothing queued is ever dropped.
  #
  # Why not a lock job that waits its turn: it would hold a runner while
  # polling, and enough waiting PRs would fill every runner and deadlock
  # the run holding the lock.
  #
  # Every check step runs even after an earlier one fails (`!cancelled()`),
  # matching the old fail-fast: false matrix — surface every violation.
  # Docs-only changesets skip the code checks.
  # ─────────────────────────────────────────────────────────────────────
  checks:
    name: Checks
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # auto-label + coverage comment
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the changeset diff, guides-index dates, the
          # CHANGELOG check, the test-deletion guard and gitleaks all
          # read a commit range.
          fetch-depth: 0

      - name: Changeset
        id: changeset
        shell: bash
        run: |
          set -uo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              ;;
            *)
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "docs=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"
          echo "$changed"

          # Docs-only: excludes .github/ deliberately — workflow changes
          # can break tests and must still be verified.
          code_files=$(echo "$changed" | grep -vE '(^|/)[^/]+\.md$|^docs/' || true)
          docs_files=$(echo "$changed" | grep -E '(^|/)[^/]+\.md$|^docs/' || true)

          if [[ -z "$code_files" ]]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ -z "$docs_files" ]]; then
            echo "docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

      # PR title becomes the squash-merge commit message, so this
      # enforces the Conventional Commits convention at merge time.
      - name: PR title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            PR subject must start lowercase (imperative mood).
            Example: 'feat(fifo): add lot-consumption event log'
            Not:     'feat(fifo): Add lot-consumption event log'

      # Blocks feat/fix/refactor/perf PRs without a changelog fragment
      # or [Unreleased] entry. Skips docs/chore/ci/build/test/revert.
      - name: CHANGELOG update
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/dev/changelog-check.sh

      # Non-blocking so a labeler config bug doesn't block merge.
      - name: Auto-label
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Size label
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: pascalgn/size-label-action@v0.5.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IGNORED: |
            uv.lock
            package-lock.json
            **/*.snapshot
        with:
          sizes: |
            {
              "0": "size:s",
              "100": "size:m",
              "500": "size:l"
            }

      # Runs before setup-node so markdownlint-cli2 keeps the image's
      # own Node.
      - name: Install markdownlint-cli2 (if not already pre-baked)
        id: mdl-install
        if: ${{ !cancelled() && steps.changeset.outputs.docs == 'true' }}
        run: |
          if ! command -v markdownlint-cli2 >/dev/null 2>&1; then
            sudo npm install -g markdownlint-cli2@0.23.2
          else
            echo "markdownlint-cli2 already available: $(markdownlint-cli2 --version)"
          fi

      - name: Markdown lint
        if: ${{ !cancelled() && steps.mdl-install.outcome == 'success' }}
        run: markdownlint-cli2 "**/*.md" "#node_modules" "#.venv"

      # Needs full history: regenerate-guides-index.sh dates each guide
      # with `git log -1`, which a shallow clone cannot answer.
      - name: Verify guides index is up-to-date
        if: ${{ !cancelled() && steps.changeset.outputs.docs == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/dev/regenerate-guides-index.sh
          if ! git diff --exit-code docs/guides/README.md; then
            echo "::error::docs/guides/README.md is out of date. Run scripts/dev/regenerate-guides-index.sh locally and commit."
            exit 1
          fi

      # A broken CODEOWNERS silently disables code-owner review
      # enforcement — GitHub skips the check instead of failing it.
      - name: CODEOWNERS syntax
        if: ${{ !cancelled() }}
        run: bash scripts/dev/codeowners-syntax-check.sh

      - name: Install gitleaks (if not already pre-baked)
        id: gitleaks-install
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            GITLEAKS_VERSION=8.21.2
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
            sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
            sudo chmod +x /usr/local/bin/gitleaks
          else
            echo "gitleaks already available: $(gitleaks version)"
          fi

      - name: Secrets scan
        if: ${{ !cancelled() && steps.gitleaks-install.outcome == 'success' }}
        run: |
          gitleaks git . \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact --no-banner --verbose

      # merge-queue.yml logic lives in tools/merge/decisions.cjs so it
      # can be asserted against fixtures. Runs on every change so a
      # regression cannot be masked by a docs-only diff.
      - uses: actions/setup-node@v7
        id: node
        if: ${{ !cancelled() }}
        with:
          node-version: '20'

      - name: Merge-decisions tests
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node --test tools/merge/*.test.cjs

      # Python 3.14 has tomllib in stdlib — no uv setup needed.
      - name: Lockfile hash integrity
        if: ${{ !cancelled() && steps.changeset.outputs.code == 'true' }}
        run: python3 scripts/dev/reproducibility-check.py

      # A PR that removes a test must opt in with a `SEV-1:` header.
      - name: Test-deletion guard
        if: ${{ !cancelled() && steps.changeset.outputs.code == 'true' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          DELETED=$(git diff --name-only --diff-filter=D \
            "origin/${{ github.base_ref }}...HEAD" -- 'tests/**/*.py' || true)
          [ -z "$DELETED" ] && exit 0
          if ! grep -q '^SEV-1:' <<< "$PR_BODY"; then
            echo "Tests deleted but PR body lacks 'SEV-1:' opt-in header." >&2
            echo "$DELETED" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        id: uv
        if: ${{ !cancelled() && steps.changeset.outputs.code == 'true' }}
        with: { version: "0.12.5" }

      - name: uv sync
        id: sync
        if: ${{ !cancelled() && steps.uv.outcome == 'success' }}
        run: uv sync --frozen

      # Quality gates. See docs/decisions/2026-08-22-drop-safety.md re: no safety.
      - name: format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff format --check .

      - name: lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check .

      - name: types
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run mypy --strict src/hermes

      - name: imports
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run lint-imports

      # `--skip-editable` skips our own local hermes package (not on PyPI).
      # `--strict` dropped because it upgrades the skip warning to an error.
      - name: deps
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pip-audit --skip-editable

      - name: complexity
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run radon cc --min B src/

      - name: deadcode
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run vulture src/

      # Blocks GPL/AGPL/LGPL, which create commercial-use constraints.
      # See scripts/dev/license-check.py header for allowlist rationale.
      - name: License compliance
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: |
          uv tool install pip-licenses
          uv tool run pip-licenses --format=json \
            | python3 scripts/dev/license-check.py

      - name: Unit tests + coverage
        id: unit
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest tests/unit/ -n auto --cov=src/hermes --cov-branch --cov-report=xml --cov-report=json --cov-report=term

      # --bootstrap: skip EMPTY-package FAILs while Phase 0 skeleton is not yet
      # populated. Drop the flag when Phase 1 lands code in application/,
      # adapters/*, entrypoints/. Tracked in #71 (Phase 0 meta backlog).
      - name: Coverage floor
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: uv run python scripts/dev/coverage-check.py --bootstrap

  # ─────────────────────────────────────────────────────────────────────
  # PR body linter — every mandatory template section must have real
  # content, not the placeholder comment left in place. Prevents
  # "opened a PR with empty body" from ever reaching review.
  #
  # The body is fetched from the API rather than the event payload, so a
  # re-run lints the CURRENT body. Editing a body pushes nothing and does
  # not re-run CI; .github/workflows/pr-body-recheck.yml re-runs this job
  # (and CI success, its dependent) when its result goes stale (#350).
  # Dependabot PRs gate here too: the body rewriter from #344 puts them
  # in the 4-section template (#162).
  # ─────────────────────────────────────────────────────────────────────
  pr-body:
    name: PR body
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Lint PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # The self-hosted runner has no gh or jq; curl + python3 it does have.
        run: |
          PR_BODY="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            | python3 -c 'import json, sys; sys.stdout.write(json.load(sys.stdin).get("body") or "")')"
          export PR_BODY
          bash scripts/dev/pr-body-lint.sh


  # Add-to-project step deliberately removed.
  #
  # actions/add-to-project cannot write to a user-owned project via the
  # default GITHUB_TOKEN — that token has no permission surface for
  # user-scope projects (org-scope only). To restore auto-add, create a
  # fine-grained PAT with `read:project` + `write:project`, store as
  # secret `ADD_TO_PROJECT_PAT`, then re-add the job using that secret
  # instead of GITHUB_TOKEN.
  #
  # Until then: items get added manually via
  #   gh project item-add 4 --owner ricardoafo --url <issue-or-pr-url>
  # (run by the operator or a scripted post-open flow).

  # ─────────────────────────────────────────────────────────────────────
  # SUCCESS gate — single required status check on branch protection.
  # Aggregates results; passes iff every non-skipped job succeeded.
  # Add / remove jobs above without touching branch protection JSON.
  # ─────────────────────────────────────────────────────────────────────
  ci-success:
    name: CI success
    needs: [checks, pr-body]
    if: '!cancelled()'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify all gates passed
        shell: bash
        # Delegates to scripts/dev/ci-success-check.sh — parses needs
        # context via Python (proper JSON, positive-list allowlist) and
        # exits non-zero if any job result is outside {success, skipped}.
        # See the script header for the bug story (PRs #72 and #73 merged
        # red under the old grep-based check).
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/dev/ci-success-check.sh
