name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# SHA-based concurrency dedupes push+PR fired on the same commit. On PRs,
# cancel superseded runs; on main, let each commit finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # DECISION: classify the changeset. Docs-only skips heavier gates.
  # ─────────────────────────────────────────────────────────────────────
  changeset:
    name: Changeset
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 3
    outputs:
      code: ${{ steps.detect.outputs.code }}
      docs: ${{ steps.detect.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - id: detect
        shell: bash
        run: |
          set -uo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              ;;
            *)
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "docs=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"
          echo "$changed"

          # Docs-only: excludes .github/ deliberately — workflow changes
          # can break tests and must still be verified.
          code_files=$(echo "$changed" | grep -vE '(^|/)[^/]+\.md$|^docs/' || true)
          docs_files=$(echo "$changed" | grep -E '(^|/)[^/]+\.md$|^docs/' || true)

          if [[ -z "$code_files" ]]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ -z "$docs_files" ]]; then
            echo "docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────────────
  # Markdown lint — always required. Runs on every PR that touches *.md
  # or if we can't rule out changes (first PR, empty ref).
  # ─────────────────────────────────────────────────────────────────────
  markdown-lint:
    name: Markdown lint
    needs: changeset
    if: needs.changeset.outputs.docs == 'true'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 — regenerate-guides-index.sh uses
          # `git log -1 --format=%as -- <file>` to compute the "Last
          # updated" date. On a shallow clone (depth 1) git can only see
          # the head commit, so if the head didn't touch the file, git
          # log returns empty and the script falls back to today's date
          # → false-positive drift diff. Full history fixes it.
          fetch-depth: 0

      - name: Install markdownlint-cli2 (if not already pre-baked)
        run: |
          if ! command -v markdownlint-cli2 >/dev/null 2>&1; then
            sudo npm install -g markdownlint-cli2@0.23.2
          else
            echo "markdownlint-cli2 already available: $(markdownlint-cli2 --version)"
          fi

      - name: Lint markdown
        run: markdownlint-cli2 "**/*.md" "#node_modules" "#.venv"

      - name: Verify guides index is up-to-date
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/dev/regenerate-guides-index.sh
          if ! git diff --exit-code docs/guides/README.md; then
            echo "::error::docs/guides/README.md is out of date. Run scripts/dev/regenerate-guides-index.sh locally and commit."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────
  # PR title validation — Conventional Commits format on PR title.
  # PR title becomes the squash-merge commit message, so this enforces
  # the commit convention at merge time (commit-msg hook only runs
  # locally; CI enforces the final artifact).
  # ─────────────────────────────────────────────────────────────────────
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 3
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            PR subject must start lowercase (imperative mood).
            Example: 'feat(fifo): add lot-consumption event log'
            Not:     'feat(fifo): Add lot-consumption event log'

  # ─────────────────────────────────────────────────────────────────────
  # PR body linter — every mandatory template section must have real
  # content, not the placeholder comment left in place. Prevents
  # "opened a PR with empty body" from ever reaching review.
  # ─────────────────────────────────────────────────────────────────────
  pr-body:
    name: PR body
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Lint PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/dev/pr-body-lint.sh

  # ─────────────────────────────────────────────────────────────────────
  # CHANGELOG enforcement — blocks feat/fix/refactor/perf PRs that
  # don't update CHANGELOG's [Unreleased] section. Skips for
  # docs/chore/ci/build/test/revert.
  # ─────────────────────────────────────────────────────────────────────
  changelog:
    name: CHANGELOG update
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check CHANGELOG requirement
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/dev/changelog-check.sh

  # ─────────────────────────────────────────────────────────────────────
  # Auto-label — applies area:*/type:* labels based on file paths and
  # PR title. Non-blocking (continue-on-error) so a labeler config bug
  # doesn't block merge.
  # ─────────────────────────────────────────────────────────────────────
  auto-label:
    name: Auto-label
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 3
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v6
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Size label
        uses: pascalgn/size-label-action@v0.5.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IGNORED: |
            uv.lock
            package-lock.json
            **/*.snapshot
        with:
          sizes: |
            {
              "0": "size:s",
              "100": "size:m",
              "500": "size:l"
            }

  # ─────────────────────────────────────────────────────────────────────
  # Merge-decisions unit tests — the pr-revalidate.yml logic lives in a
  # pure-function module (tools/merge/decisions.cjs) so it can be
  # asserted against fixtures. Runs on every PR that touches it, and
  # unconditionally on push to main so a regression cannot be masked by
  # a docs-only change.
  # ─────────────────────────────────────────────────────────────────────
  merge-decisions:
    name: Merge-decisions tests
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run decisions test suite
        run: node --test tools/merge/*.test.cjs

  # ─────────────────────────────────────────────────────────────────────
  # QUALITY — parallel matrix (one leg per check)
  # 7 checks that used to run serially in a single job now fan out as a
  # matrix. Each leg is a separate check on the PR page; wall-clock is
  # max(setup + slowest check) instead of sum(all checks).
  # Cache reuse via uv-cache volume shared across all runner replicas.
  # See docs/decisions/2026-08-22-drop-safety.md re: no safety.
  # ─────────────────────────────────────────────────────────────────────
  quality:
    name: Quality
    needs: changeset
    if: needs.changeset.outputs.code == 'true'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 5
    strategy:
      fail-fast: false  # surface every violation, not just the first leg to fail
      matrix:
        include:
          - name: format
            cmd: uv run ruff format --check .
          - name: lint
            cmd: uv run ruff check .
          - name: types
            cmd: uv run mypy --strict src/hermes
          - name: imports
            cmd: uv run lint-imports
          # `--skip-editable` skips our own local hermes package (not on PyPI).
          # `--strict` dropped because it upgrades the skip warning to an error.
          - name: deps
            cmd: uv run pip-audit --skip-editable
          - name: complexity
            cmd: uv run radon cc --min B src/
          - name: deadcode
            cmd: uv run vulture src/
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v3
        with: { version: "0.12.5" }
      - run: uv sync --frozen
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  # ─────────────────────────────────────────────────────────────────────
  # UNIT — SKELETON (Phase 0 fills the body)
  # pytest with branch coverage. Enforces coverage floor + uploads a
  # report artifact for the coverage-comment step (Phase 1+).
  # ─────────────────────────────────────────────────────────────────────
  unit:
    name: Unit tests + coverage
    needs: changeset
    if: needs.changeset.outputs.code == 'true'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # coverage comment (Phase 1+)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v3
        with: { version: "0.12.5" }
      - run: uv sync --frozen
      - run: uv run pytest tests/unit/ --cov=src/hermes --cov-branch --cov-report=xml --cov-report=json
      - run: uv run python scripts/dev/coverage-check.py --bootstrap

  # ─────────────────────────────────────────────────────────────────────
  # GUARDS — SKELETON (Phase 0 fills the body)
  # Custom hard rules that CI enforces without human review:
  #   - test-deletion guard: a PR that removes a test must justify it
  #     (either a `SEV-1: removed by intent` marker, or the deleted
  #     test's assertion is being MOVED elsewhere in the same PR)
  # CODEOWNERS-syntax guard already exists as its own `codeowners` job.
  # ─────────────────────────────────────────────────────────────────────
  guards:
    name: Guards
    needs: changeset
    if: needs.changeset.outputs.code == 'true'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # guards diff a range; shallow clone has no base

      - name: Test-deletion guard
        run: |
          set -euo pipefail
          DELETED=$(git diff --name-only --diff-filter=D \
            "origin/${{ github.base_ref }}...HEAD" -- 'tests/**/*.py' || true)
          [ -z "$DELETED" ] && exit 0
          if ! grep -q '^SEV-1:' <<< "${{ github.event.pull_request.body }}"; then
            echo "Tests deleted but PR body lacks 'SEV-1:' opt-in header." >&2
            echo "$DELETED" >&2
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────
  # SEMGREP — SKELETON (Phase 0+ fills the body)
  # Static analysis for security bugs (SAST). Once code exists to scan,
  # bump this to a real semgrep run with the p/security-audit ruleset.
  # ─────────────────────────────────────────────────────────────────────
  semgrep:
    name: Semgrep (SAST)
    needs: changeset
    if: needs.changeset.outputs.code == 'true'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # semgrep-action@v1 uses Docker-in-Docker which our containerized
      # self-hosted runner cannot do (docker.sock permission denied when the
      # action tries `docker pull returntocorp/semgrep-agent:v1`).
      # Install semgrep via uv tool instead — same rules, no daemon needed.
      - uses: astral-sh/setup-uv@v3
        with: { version: "0.12.5" }
      - run: uv tool install semgrep
      - run: uv tool run semgrep scan --config p/security-audit --config p/python --error

  # ─────────────────────────────────────────────────────────────────────
  # CODEOWNERS syntax guard — a broken CODEOWNERS silently disables
  # code-owner review enforcement (GitHub does not fail the PR; it just
  # skips the check). That looks green while unreviewed code merges.
  # Catch typos before they land.
  # ─────────────────────────────────────────────────────────────────────
  codeowners:
    name: CODEOWNERS syntax
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validate CODEOWNERS syntax
        run: bash scripts/dev/codeowners-syntax-check.sh

  # ─────────────────────────────────────────────────────────────────────
  # Secrets scan — gitleaks on the full history for every PR.
  # ─────────────────────────────────────────────────────────────────────
  secrets:
    name: Secrets scan
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks (if not already pre-baked)
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            GITLEAKS_VERSION=8.21.2
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
            sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
            sudo chmod +x /usr/local/bin/gitleaks
          else
            echo "gitleaks already available: $(gitleaks version)"
          fi

      - name: Scan for secrets (PR diff only, --all on push-to-main)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            gitleaks git . \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
              --redact --no-banner --verbose
          else
            gitleaks git . --log-opts=--all --redact --no-banner --verbose
          fi

  # Add-to-project step deliberately removed.
  #
  # actions/add-to-project cannot write to a user-owned project via the
  # default GITHUB_TOKEN — that token has no permission surface for
  # user-scope projects (org-scope only). To restore auto-add, create a
  # fine-grained PAT with `read:project` + `write:project`, store as
  # secret `ADD_TO_PROJECT_PAT`, then re-add the job using that secret
  # instead of GITHUB_TOKEN.
  #
  # Until then: items get added manually via
  #   gh project item-add 4 --owner ricardoafo --url <issue-or-pr-url>
  # (run by the operator or a scripted post-open flow).

  # ─────────────────────────────────────────────────────────────────────
  # SUCCESS gate — single required status check on branch protection.
  # Aggregates results; passes iff every non-skipped job succeeded.
  # Add / remove jobs above without touching branch protection JSON.
  # ─────────────────────────────────────────────────────────────────────
  ci-success:
    name: CI success
    needs: [changeset, markdown-lint, pr-title, pr-body, changelog, auto-label, merge-decisions, quality, unit, guards, semgrep, codeowners, secrets]
    if: '!cancelled()'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify all gates passed
        shell: bash
        # Delegates to scripts/dev/ci-success-check.sh — parses needs
        # context via Python (proper JSON, positive-list allowlist) and
        # exits non-zero if any job result is outside {success, skipped}.
        # See the script header for the bug story (PRs #72 and #73 merged
        # red under the old grep-based check).
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/dev/ci-success-check.sh
