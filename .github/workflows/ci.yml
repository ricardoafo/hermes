name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Ref-based per-PR concurrency (closes #174). Pushing a fix to a PR
# cancels the previous in-progress CI run for that PR — different PRs
# still run in parallel because each has its own ref. On push to main
# the group is refs/heads/main; consecutive main pushes DO cancel
# earlier in-progress runs so we don't waste runner slots on
# already-superseded main commits.
#
# There is deliberately NO global group to serialize PRs: a concurrency
# group keeps one pending run and cancels the older pending ones, so it
# would silently drop queued PRs. Runs stay whole through job shape
# instead — see the `checks` job below (#397).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # CI SUCCESS — every gate in ONE job, one step per check (#397).
  #
  # This job IS the single required status check on branch protection,
  # so its name stays "CI success". No other job and no `needs:` chain:
  # an aggregator or a second wave would queue behind other PRs' jobs.
  #
  # Why one job: the self-hosted pool is a handful of runners and the
  # suite used to fan out into ~15 jobs in three `needs:` waves. With
  # several PRs pushing at once their jobs interleaved in the runner
  # queue, so later PRs overtook earlier ones between waves and nobody
  # finished. Now a run asks for one runner for its whole suite: GitHub
  # hands queued jobs to idle runners first come, first served, and once
  # a run starts nothing from another PR can cut in. Up to one PR per
  # runner runs side by side; nothing queued is ever dropped.
  #
  # Why not a lock job that waits its turn: it would hold a runner while
  # polling, and enough waiting PRs would fill every runner and deadlock
  # the run holding the lock.
  #
  # Every check step runs even after an earlier one fails (`!cancelled()`),
  # matching the old fail-fast: false matrix — surface every violation.
  # Docs-only changesets skip the code checks.
  # ─────────────────────────────────────────────────────────────────────
  ci-success:
    name: CI success
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    # A normal run takes 5-8 minutes on a busy pool. Each network step
    # has its own short timeout, so a hung download fails that step
    # instead of holding a runner until this cap. 35, not 20: with many
    # PRs at once the unit tests alone passed 20 minutes under CPU
    # contention and every run was cancelled (#752).
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write # PR body read, auto-label, coverage comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: the changeset diff, the CHANGELOG check, the
          # test-deletion guard and gitleaks all read a commit range.
          fetch-depth: 0

      - name: Changeset
        id: changeset
        shell: bash
        run: |
          set -uo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              # A fast-path merge lands the exact tree PR CI passed on
              # the PR head. Re-running the suite on it buys nothing,
              # so this job reports success for that tree (#414).
              if [[ "$(GH_TOKEN='${{ github.token }}' bash scripts/dev/main-tree-validated.sh "$head")" == "yes" ]]; then
                echo "::notice::Tree already passed CI on its PR head; skipping the suite."
                echo "code=false" >> "$GITHUB_OUTPUT"
                echo "docs=false" >> "$GITHUB_OUTPUT"
                echo "e2e=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *)
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "docs=true" >> "$GITHUB_OUTPUT"
              echo "e2e=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"
          echo "$changed"

          # Docs-only: excludes .github/ deliberately — workflow changes
          # can break tests and must still be verified.
          code_files=$(echo "$changed" | grep -vE '(^|/)[^/]+\.md$|^docs/' || true)
          docs_files=$(echo "$changed" | grep -E '(^|/)[^/]+\.md$|^docs/' || true)

          if [[ -z "$code_files" ]]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ -z "$docs_files" ]]; then
            echo "docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

          # The serve cycle only changes with these paths. The merge
          # queue's gates use the same list (merge-gates.sh).
          e2e_paths='^(src/hermes/|tests/e2e/|tests/fixtures/e2e/|config/|pyproject\.toml$|uv\.lock$)'
          if echo "$changed" | grep -qE "$e2e_paths"; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

      # Every mandatory template section must have real content. The
      # body is fetched from the API rather than the event payload, so a
      # re-run lints the CURRENT body. Editing a body pushes nothing;
      # scripts/dev/pr-body-recheck.sh re-runs this job when this step's
      # result goes stale (#350). Dependabot PRs gate here too: the body
      # rewriter from #344 puts them in the 4-section template (#162).
      # Keep the step name: the recheck finds it by name.
      - name: PR body
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # The self-hosted runner has no gh or jq; curl + python3 it does have.
        run: |
          PR_BODY="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            | python3 -c 'import json, sys; sys.stdout.write(json.load(sys.stdin).get("body") or "")')"
          export PR_BODY
          bash scripts/dev/pr-body-lint.sh

      # PR title becomes the squash-merge commit message, so this
      # enforces the Conventional Commits convention at merge time.
      - name: PR title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            PR subject must start lowercase (imperative mood).
            Example: 'feat(fifo): add lot-consumption event log'
            Not:     'feat(fifo): Add lot-consumption event log'

      # Blocks feat/fix/refactor/perf PRs without a changelog fragment
      # or [Unreleased] entry. Skips docs/chore/ci/build/test/revert.
      - name: CHANGELOG update
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/dev/changelog-check.sh

      # Non-blocking so a labeler config bug doesn't block merge.
      - name: Auto-label
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Size label
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: pascalgn/size-label-action@56b489b027932ec0cf60438a1a5f1a19c8fc71ff # v0.5.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IGNORED: |
            uv.lock
            package-lock.json
            **/*.snapshot
        with:
          sizes: |
            {
              "0": "size:s",
              "100": "size:m",
              "500": "size:l"
            }

      - name: Install markdownlint-cli2 (if not already pre-baked)
        id: mdl-install
        if: ${{ !cancelled() && steps.changeset.outputs.docs == 'true' }}
        timeout-minutes: 3
        run: |
          if ! command -v markdownlint-cli2 >/dev/null 2>&1; then
            sudo npm install -g markdownlint-cli2@0.23.3
          else
            echo "markdownlint-cli2 already available: $(markdownlint-cli2 --version)"
          fi

      - name: Markdown lint
        if: ${{ !cancelled() && steps.mdl-install.outcome == 'success' }}
        run: bash scripts/dev/ci-checks.sh markdown

      # The index is rebuilt on main after merge and never committed by a
      # PR, so this only proves it still builds.
      - name: Verify guides index builds
        if: ${{ !cancelled() && steps.changeset.outputs.docs == 'true' }}
        run: bash scripts/dev/ci-checks.sh guides-index

      # A broken CODEOWNERS silently disables code-owner review
      # enforcement — GitHub skips the check instead of failing it.
      - name: CODEOWNERS syntax
        if: ${{ !cancelled() }}
        run: bash scripts/dev/ci-checks.sh codeowners

      # actionlint + zizmor; findings that predate the check are in
      # .github/zizmor.yml (#529).
      - name: Workflow lint and audit
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: bash scripts/dev/ci-checks.sh workflows

      - name: Install gitleaks (if not already pre-baked)
        timeout-minutes: 3
        id: gitleaks-install
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          # Same pin and checksum as the runner image and merge-gates.sh. A
          # baked binary of another version is replaced, not trusted.
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          if [ "$(gitleaks version 2>/dev/null)" != "$GITLEAKS_VERSION" ]; then
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
            echo "$GITLEAKS_SHA256  /tmp/gitleaks.tar.gz" | sha256sum -c -
            sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
            sudo chmod +x /usr/local/bin/gitleaks
          fi
          echo "gitleaks $(gitleaks version)"

      - name: Secrets scan
        if: ${{ !cancelled() && steps.gitleaks-install.outcome == 'success' }}
        run: |
          gitleaks git . \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact --no-banner --verbose

      # merge-queue.yml logic lives in tools/merge/decisions.cjs so it
      # can be asserted against fixtures. Runs on every change so a
      # regression cannot be masked by a docs-only diff. Runs on the
      # runner image's own Node 24 (Dockerfile NODE_MAJOR). setup-node
      # found no Node in the tool cache and downloaded one on every
      # ephemeral job; that download hung #467 twice (2026-10-03).
      - name: Merge-decisions tests
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: bash scripts/dev/ci-checks.sh merge-decisions

      # Python 3.14 has tomllib in stdlib — no uv setup needed.
      - name: Lockfile hash integrity
        if: ${{ !cancelled() && steps.changeset.outputs.code == 'true' }}
        run: bash scripts/dev/ci-checks.sh lockfile

      # A PR that removes a test must opt in with a `SEV-1:` header.
      - name: Test-deletion guard
        if: ${{ !cancelled() && steps.changeset.outputs.code == 'true' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          DELETED=$(git diff --name-only --diff-filter=D \
            "origin/${BASE_REF}...HEAD" -- 'tests/**/*.py' || true)
          [ -z "$DELETED" ] && exit 0
          if ! grep -q '^SEV-1:' <<< "$PR_BODY"; then
            echo "Tests deleted but PR body lacks 'SEV-1:' opt-in header." >&2
            echo "$DELETED" >&2
            exit 1
          fi

      # The runner image bakes uv 0.12.5 (Dockerfile UV_VERSION), but
      # setup-uv looked only in the wiped tool cache and downloaded uv on
      # every job. Use the baked binary when it is the pinned version;
      # install that exact version otherwise (the ubuntu-latest
      # fallback). Any other version fails here instead of drifting.
      - name: uv 0.12.5
        id: uv
        if: ${{ !cancelled() && steps.changeset.outputs.code == 'true' }}
        timeout-minutes: 3
        env:
          UV_PIN: "0.12.5"
        run: |
          set -euo pipefail
          have=$(uv --version 2>/dev/null | cut -d' ' -f2 || true)
          if [ "$have" != "$UV_PIN" ]; then
            curl -LsSf "https://github.com/astral-sh/uv/releases/download/${UV_PIN}/uv-installer.sh" \
              | env UV_INSTALL_DIR="$HOME/.local/bin" sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          have=$(uv --version | cut -d' ' -f2)
          if [ "$have" != "$UV_PIN" ]; then
            echo "::error::uv is $have, expected $UV_PIN"
            exit 1
          fi
          echo "uv $have at $(command -v uv)"

      - name: uv sync
        id: sync
        if: ${{ !cancelled() && steps.uv.outcome == 'success' }}
        timeout-minutes: 5
        run: uv sync --frozen

      # Quality gates. Every command lives in scripts/dev/ci-checks.sh, which
      # pr-preflight.sh also runs, so local and CI checks cannot drift.
      # See docs/decisions/2026-08-22-drop-safety.md re: no safety.
      - name: format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: bash scripts/dev/ci-checks.sh format

      - name: lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: bash scripts/dev/ci-checks.sh lint

      - name: types
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: bash scripts/dev/ci-checks.sh types

      - name: imports
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: bash scripts/dev/ci-checks.sh imports

      - name: deps
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: bash scripts/dev/ci-checks.sh deps

      - name: complexity
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: bash scripts/dev/ci-checks.sh complexity

      - name: deadcode
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: bash scripts/dev/ci-checks.sh deadcode

      # The pre-commit guards over the whole tree, and every script self-test.
      # Cloud writer sessions have no pre-commit, so CI is the one place these
      # always run (#840).
      - name: guards
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: bash scripts/dev/ci-checks.sh guards

      - name: self-tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: bash scripts/dev/ci-checks.sh self-tests

      # Blocks GPL/AGPL/LGPL, which create commercial-use constraints.
      # See scripts/dev/license-check.py header for allowlist rationale.
      - name: License compliance
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: bash scripts/dev/ci-checks.sh licenses

      - name: Unit tests + coverage
        id: unit
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: bash scripts/dev/ci-checks.sh unit

      # Integration tier: ~150 tests, seconds under xdist. Real adapters
      # against local fakes; no network, no secrets.
      - name: Integration tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: bash scripts/dev/ci-checks.sh integration

      # The serve cycle failed on main after PRs merged with a green PR CI
      # (#663). Serial after the suite on a runner the job already holds,
      # so it takes no extra pool slot; about 35 s.
      - name: End-to-end tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && steps.changeset.outputs.e2e == 'true' }}
        run: bash scripts/dev/ci-checks.sh e2e

      - name: Coverage floor
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        run: bash scripts/dev/ci-checks.sh coverage-floor

      # An engine change must not alter a shadowed strategy's decisions
      # without the Code Owner knowing: an altered decision restarts its
      # shadow clock (ADR-021). Replays Train on the base and on this tree
      # and compares decisions only; no metric, no trial (ADR-025). Exits
      # at once when no engine file changed. Last, so a red unit tier is
      # reported before the replay's minutes are spent.
      - name: Train decision replay
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.unit.outcome == 'success' }}
        timeout-minutes: 15
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          HERMES_DATA_DIR: /srv/hermes-data
        run: bash scripts/dev/train-decision-replay.sh

  # Add-to-project step deliberately removed.
  #
  # actions/add-to-project cannot write to a user-owned project via the
  # default GITHUB_TOKEN — that token has no permission surface for
  # user-scope projects (org-scope only). To restore auto-add, create a
  # fine-grained PAT with `read:project` + `write:project`, store as
  # secret `ADD_TO_PROJECT_PAT`, then re-add the job using that secret
  # instead of GITHUB_TOKEN.
  #
  # Until then: items get added manually via
  #   gh project item-add 4 --owner ricardoafo --url <issue-or-pr-url>
  # (run by the operator or a scripted post-open flow).
