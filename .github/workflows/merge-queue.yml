name: Merge queue

# Serialized merge queue for the private repo (GitHub's native merge queue is
# not available on the current plan tier). Only merges a PR when it is:
#   1. approved by the code owner
#   2. green on CI
#   3. rebase-clean against current main
# Merges are strictly serialized via workflow concurrency; other candidates
# wait for main to move, then are re-evaluated on the next tick.
#
# Triggered by:
#   - CI success (workflow_run) — a fresh green build may have unblocked a PR
#   - Approval submission — human review just landed
#   - Push to main — another PR merged; queue re-evaluates
#   - Hourly cron — catches PRs that missed a trigger (network hiccup, etc.)
#   - Manual dispatch — with optional dry_run for validation without merging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and report, merge nothing'
        type: boolean
        default: false

# NEVER cancel a merge mid-flight. One merge at a time; the next queued PR
# waits until this workflow run completes.
concurrency:
  group: merge-queue
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # SELECT: enumerate mergeable candidates.
  # A candidate must be: open, non-draft, mergeable (no conflicts),
  # approved by a code owner, CI green.
  # ─────────────────────────────────────────────────────────────────────
  select:
    name: Select candidates
    # For workflow_run, only proceed if CI concluded successfully.
    # For pull_request_review, only proceed on 'approved' reviews.
    if: |
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
      && (github.event_name != 'pull_request_review' || github.event.review.state == 'approved')
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      candidates: ${{ steps.pick.outputs.candidates }}
      any: ${{ steps.pick.outputs.any }}
      main_sha: ${{ steps.pick.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        id: pick
        with:
          script: |
            const { owner, repo } = context.repo;

            const { data: base } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const mainSha = base.commit.sha;
            core.setOutput('main_sha', mainSha);
            core.info(`main tip: ${mainSha}`);

            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });

            const candidates = [];
            for (const pr of open) {
              if (pr.draft) {
                core.info(`#${pr.number}: draft, skip`);
                continue;
              }

              // Refresh mergeability (GitHub computes this lazily)
              const { data: full } = await github.rest.pulls.get({
                owner, repo, pull_number: pr.number,
              });
              if (full.mergeable !== true) {
                core.info(`#${pr.number}: mergeable=${full.mergeable}, skip`);
                continue;
              }
              if (full.mergeable_state !== 'clean') {
                core.info(`#${pr.number}: mergeable_state=${full.mergeable_state}, skip`);
                continue;
              }

              // Require an approved code-owner review on the current head SHA
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner, repo, pull_number: pr.number,
              });
              const approvedOnHead = reviews.some(
                r => r.state === 'APPROVED' && r.commit_id === full.head.sha
              );
              if (!approvedOnHead) {
                core.info(`#${pr.number}: no approved review on head=${full.head.sha}, skip`);
                continue;
              }

              candidates.push({ number: pr.number, head: full.head.sha, title: full.title });
              core.info(`#${pr.number}: candidate (head=${full.head.sha})`);
            }

            core.setOutput('candidates', JSON.stringify(candidates));
            core.setOutput('any', String(candidates.length > 0));

  # ─────────────────────────────────────────────────────────────────────
  # MERGE: pick the oldest candidate and merge it via GH squash-merge.
  # Serialized (max-parallel: 1). If the branch is out of date, GitHub's
  # merge API returns 405 — we retry on the next tick after the author
  # (or auto-update) rebases.
  # ─────────────────────────────────────────────────────────────────────
  merge:
    name: Merge oldest candidate
    needs: select
    if: needs.select.outputs.any == 'true' && github.event.inputs.dry_run != 'true'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          CANDIDATES: ${{ needs.select.outputs.candidates }}
        with:
          script: |
            const candidates = JSON.parse(process.env.CANDIDATES);
            // Oldest first (smallest PR number)
            candidates.sort((a, b) => a.number - b.number);
            const pick = candidates[0];
            core.info(`Attempting to merge #${pick.number} (${pick.title})`);

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pick.number,
                merge_method: 'squash',
                sha: pick.head,
              });
              core.info(`Merged #${pick.number}`);
            } catch (err) {
              if (err.status === 405) {
                core.warning(`#${pick.number} not fast-forwardable — rebase needed. Will retry after next update.`);
              } else if (err.status === 409) {
                core.warning(`#${pick.number} head SHA changed — retrying next tick.`);
              } else {
                core.setFailed(`Merge failed on #${pick.number}: ${err.message}`);
                throw err;
              }
            }

  # ─────────────────────────────────────────────────────────────────────
  # DRY-RUN report — same enumeration, no merge action.
  # Useful for debugging queue eligibility without side effects.
  # ─────────────────────────────────────────────────────────────────────
  dry-run:
    name: Dry-run report
    needs: select
    if: needs.select.outputs.any == 'true' && github.event.inputs.dry_run == 'true'
    runs-on: ${{ vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - name: Report
        env:
          CANDIDATES: ${{ needs.select.outputs.candidates }}
        shell: python
        run: |
          import json, os
          candidates = json.loads(os.environ["CANDIDATES"])
          candidates.sort(key=lambda p: p["number"])
          print("Merge-queue dry-run — candidates (oldest first):")
          for p in candidates:
              print(f"  #{p['number']}: {p['title']}")
