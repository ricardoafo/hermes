# =====================================================================
# Merge queue — build one batch, gate it once, merge it in order
# =====================================================================
#
# ## What this replaces, and why
#
# The prior design (`merge-queue.yml`) called `pulls.merge` after checking
# GitHub's `mergeable_state` field. Two problems:
#
#   1. It kept branches current by pushing them forward (via
#      `pr-auto-update.yml`, later `auto-update-pr-branches.yml` and
#      this queue's own `updateBranch` call, all removed by #413).
#      Those pushes invalidated approvals under
#      `require_last_push_approval` + `dismiss_stale_reviews_on_push`.
#      The bot's own updates blocked the merges the bot was trying to
#      unblock. Bandaid workflows appeared to work around it.
#
#   2. It trusted `mergeable_state` as final. That field is lazy (returns
#      `unknown` on `pulls.list`) and can report `unstable` when a
#      non-required check was skipped or failed. The prior queue refused
#      `unstable`, stranding PRs where only a non-required check was red.
#
# This workflow removes both problems at the root. It checks out `main`
# at the exact SHA it resolved, fetches each PR head at the SHA that was
# approved, builds the merge locally, runs the tree-verifying gates on
# that tree, and merges from the workflow. No push to a PR branch, ever.
# The approval survives.
#
# ## One batch per pass
#
# The next design gated one PR per matrix entry and merged it, which
# moved `main` and left every later entry validated against a tip that
# no longer existed: one merge per pass, the rest declined. Six approved
# PRs took six passes.
#
# Now one pass handles every candidate together:
#
#   1. Select orders the candidates oldest approval first, PR number as
#      the tie-break (`orderCandidates`).
#   2. Batch merges each approved head, in that order, on top of the
#      resolved `main` tip with a real `--no-ff` merge commit. A head
#      that moved since approval or a merge that conflicts with `main`
#      plus the PRs before it is dropped from this pass, with a reason.
#   3. The gates run ONCE, on the whole batch tree
#      (`scripts/dev/merge-gates.sh`).
#   4. Green: every PR in the batch merges, in order. Red with more than
#      one PR: bisect. Gate the first half on top of the PRs already
#      proven good, then the second; recurse into any red half until
#      each PR is proven good or bad (`bisectInit` / `bisectNext` /
#      `bisectRecord`). A tree already gated red is never gated again.
#   5. Merge squashes the good PRs in order, each pinned to its approved
#      head. Bad PRs get one comment naming the failing gate and stay
#      open.
#
# What lands is main + the good PRs, the exact tree the last green gate
# run saw. The intermediate commits on `main` (main + the first good PR,
# and so on) are not gated on their own; that is the price of landing
# a batch in one gate run instead of one run per PR.
#
# ## Freshness is asserted TWICE
#
# Once at the top of `Build and gate the batch` — a cheap API check
# before we pay for gates. Once again before EVERY squash: `main` must
# be the batch base for the first PR and exactly the previous squash
# afterwards. Anything else (a human merged in between) stops the loop,
# hand-starts the next pass on the new tip, and exits cleanly.
#
# ## Fast path
#
# A batch of exactly one PR whose approved head already contains the
# current `main` tip (`git merge-base --is-ancestor`) lands a tree
# IDENTICAL to the one CI already validated on that head. The `gateSkip`
# decision fires only when BOTH the ancestor check AND
# `ciConclusion === success` hold. A batch of two or more never skips:
# no CI run has seen that combination. "Cannot check" is never "clean".
#
# ## Where the judgement lives
#
# All non-trivial decisions live in `tools/merge/decisions.cjs` and are
# covered by `tools/merge/decisions.test.cjs`. The build-and-bisect loop
# is `tools/merge/batch.cjs` (covered by `batch.test.cjs` against a fake
# repository). YAML holds only the I/O, because a decision inside a
# `script:` block can only be tested by merging and watching, which is
# exactly how prior queues shipped bugs.
#
# ## Runner
#
# Select and Batch prefer `vars.OPS_RUNNER_LABEL`, a runner reserved for
# repository operations, so a busy CI pool cannot hold up a merge pass.
# Until that variable exists they fall back to `vars.RUNNER_LABEL`, then
# to `ubuntu-latest`.
#
# ## Trigger set — why each event is here
#
#   push: [main]
#     A merge moved `main`; every candidate behind it must be re-checked
#     against the new tip. This workflow merges with the automation app's
#     token, which does raise push events; Select skips those, because
#     the merge step already hand-starts the next pass (#694).
#
#   pull_request_review: [submitted]
#     The reviewer just approved. Often approval lands seconds after PR
#     open, while CI still has minutes to run — at that instant the
#     required check is pending, `mergeable_state` is `blocked`, and
#     `select` correctly declines. But NOTHING would look again once the
#     block cleared, except the hourly cron. `workflow_run` below covers
#     the actual clear.
#
#   workflow_run: [CI completed]
#     CI just finished. This is the trigger that clears the "approved
#     before CI finished" block. Guarded on `conclusion == 'success'` in
#     the `select` filter, because a red run must never start a merge.
#
#   schedule: hourly
#     Backstop for missed triggers (network hiccup, GitHub outage). It
#     is 100% idle in the healthy case, which is the product.
#
#   workflow_dispatch:
#     Manual invocation, with `dry_run` for changes to THIS workflow.
#     Builds and gates the batch, reports what would merge, and stops
#     one call before `pulls.merge`.

name: Merge queue

on:
  push:
    branches: [main]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and report, merge nothing'
        type: boolean
        default: false
        required: false

# Serialised on purpose. Two passes would race to merge into the same
# `main`, and the loser would land a tree it validated against a tip
# that no longer exists. `cancel-in-progress: false` because a run that
# is mid-merge must finish.
#
# GitHub keeps only ONE pending run per group and replaces it with each
# newer arrival. Events that can never merge anything (a CI run that did
# not succeed, a review that is not an approval — exactly what Select's
# `if:` skips) used to take that slot and displace a real pass queued
# behind a running one (#485, 2026-10-03 22:50 UTC). They now get a
# group of their own, so they never wait and never displace. Keep the
# condition below the exact negation of Select's `if:`.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event != 'pull_request'))
    || (github.event_name == 'pull_request_review' && github.event.review.state != 'approved')
    || (github.event_name == 'push' && github.actor == 'hermes-automation-bot[bot]'))
    && format('mq-noop-{0}', github.run_id) || 'revalidate-and-merge' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─────────────────────────────────────────────────────────────────
  # SELECT — enumerate mergeable candidates, in merge order.
  # Sparse checkout of `tools/merge` only; this job runs many times a
  # day and its cost is API calls, not the repository.
  # ─────────────────────────────────────────────────────────────────
  select:
    name: Select
    # Three triggers are narrowed here; every other one is unconditional.
    # Only a green CI run on a PR can make a candidate mergeable: a failed
    # run must never start a merge pass, and CI on main changes no PR.
    # A review that is not `approved` cannot make a PR mergeable either
    # (`types: [submitted]` fires on plain comments too). A push by the
    # automation app is this queue's own merge, and the merge step already
    # starts the next pass (#694). The `concurrency:` group above routes
    # exactly these skipped events to a no-op group; change both together
    # (tools/merge/workflow.test.cjs checks they agree).
    if: >-
      (github.event_name != 'workflow_run'
       || (github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.event == 'pull_request'))
      && (github.event_name != 'pull_request_review'
       || github.event.review.state == 'approved')
      && (github.event_name != 'push'
       || github.actor != 'hermes-automation-bot[bot]')
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write   # labels and comments on PRs it hands to a human
      issues: write          # labels are issue labels
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
      any: ${{ steps.pick.outputs.any }}
      main: ${{ steps.pick.outputs.main }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: tools/merge
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: pick
        env:
          # Set the repo variable to `true` once the hermes-automation
          # App holds "Workflows: read and write"; until then PRs that
          # touch .github/workflows/ go to a human (#445 follow-up).
          QUEUE_MERGES_WORKFLOWS: ${{ vars.QUEUE_MERGES_WORKFLOWS }}
        with:
          script: |
            const { owner, repo } = context.repo;

            // Decisions live in a unit-tested module, NOT inline.
            // `tools/merge/decisions.test.cjs` pins every refusal case
            // in ~100ms; a round trip against the live queue costs
            // minutes.
            const {
              orderCandidates, selectDecision, handMergeComment, HAND_MERGE_LABEL,
            } = require(
              `${process.env.GITHUB_WORKSPACE}/tools/merge/decisions.cjs`
            );

            // Resolved ONCE, here, and passed down. Every downstream
            // comparison uses this exact value, so "current main"
            // cannot mean two things inside one run.
            //
            // Deliberately NOT `pr.base.sha` — that is the base tip as
            // of the PR's last SYNCHRONIZATION, so comparing against it
            // asks "is this PR behind where main was the last time I
            // looked", whose answer is always no.
            const { data: base } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main',
            });
            const mainTip = base.commit.sha;
            core.setOutput('main', mainTip);
            core.info(`main tip: ${mainTip}`);

            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100,
            });

            const reviewsOf = (n) => github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: n, per_page: 100,
            });

            // `mergeable` and `mergeable_state` are computed LAZILY.
            // `pulls.list` returns them null; `pulls.get` triggers
            // computation. Poll until the state is definite.
            const settle = async (number) => {
              for (let attempt = 0; attempt < 6; attempt += 1) {
                const { data } = await github.rest.pulls.get({
                  owner, repo, pull_number: number,
                });
                if (data.mergeable !== null && data.mergeable_state !== 'unknown') {
                  return data;
                }
                await new Promise((r) => setTimeout(r, 5000));
              }
              return null;
            };

            const eligible = [];
            for (const pr of open) {
              const tag = `#${pr.number} (${pr.head.ref})`;

              if (pr.draft) {
                core.info(`${tag}: draft — not a candidate`);
                continue;
              }

              const full = await settle(pr.number);
              if (full === null) {
                core.warning(`${tag}: GitHub never computed mergeability — will retry next run`);
                continue;
              }

              // Every input the decision needs, then one pure verdict
              // (tools/merge/decisions.cjs selectDecision, unit-tested
              // against recorded API replies).
              const verdict = selectDecision({
                pr: full,
                reviews: await reviewsOf(pr.number),
                files: (await github.paginate(github.rest.pulls.listFiles, {
                  owner, repo, pull_number: pr.number, per_page: 100,
                })).map((f) => f.filename),
                comments: await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: pr.number, per_page: 100,
                }),
                canMergeWorkflows: process.env.QUEUE_MERGES_WORKFLOWS === 'true',
              });
              if (verdict.candidate === null) {
                (verdict.warn ? core.warning : core.info)(`${tag}: ${verdict.reason}`);
                if (verdict.label) {
                  try {
                    await github.rest.issues.addLabels({
                      owner, repo, issue_number: pr.number, labels: [HAND_MERGE_LABEL],
                    });
                    await github.rest.issues.createComment({
                      owner, repo, issue_number: pr.number,
                      body: handMergeComment({ n: pr.number, reason: verdict.reason }).body,
                    });
                  } catch (err) {
                    core.warning(`${tag}: could not label for a human merge: ${err.message}`);
                  }
                }
                continue;
              }

              // The head SHA travels with the number. The batch must
              // prove it tested the commit that was APPROVED, not
              // whatever the branch points at by the time it runs.
              eligible.push(verdict.candidate);
              core.info(
                `${tag}: ${verdict.reason} head=${verdict.candidate.head} approved=${verdict.candidate.approvedAt}`,
              );
            }

            const ordered = orderCandidates(eligible);
            core.setOutput('prs', JSON.stringify(ordered));
            core.setOutput('any', String(ordered.length > 0));
            core.info(
              ordered.length
                ? `merge order: ${ordered.map((e) => '#' + e.n).join(', ')}`
                : 'no candidates',
            );

  # ─────────────────────────────────────────────────────────────────
  # REVALIDATE — build one batch tree, gate it (bisect if red), then
  # merge the good PRs in order.
  # ─────────────────────────────────────────────────────────────────
  revalidate:
    name: Revalidate
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ${{ vars.OPS_RUNNER_LABEL && fromJSON(vars.OPS_RUNNER_LABEL) || vars.RUNNER_LABEL && fromJSON(vars.RUNNER_LABEL) || 'ubuntu-latest' }}
    # One gate run is a few minutes; a red batch adds a few more per
    # bisect step. The cap is for a hung gate, not for a normal pass.
    timeout-minutes: 45
    permissions:
      contents: write        # merging is a push to main
      pull-requests: write   # it closes pull requests and comments on bad ones
      actions: write         # and it hand-starts what its own push cannot
      statuses: write        # so main carries a status even on skip
      issues: write          # so `Closes #N` in the body can act on issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The EXACT `main` the select job resolved, by SHA — not the
          # branch name. If `main` moves while this runs, we still
          # stand on the commit every downstream comparison is written
          # against.
          ref: ${{ needs.select.outputs.main }}
          # Full history: about to perform real merges, which need a
          # merge base.
          fetch-depth: 0

      # Once the batch is checked out, the workspace holds the PRs'
      # versions of every file, including the queue's own tooling. A PR
      # must not change the gates or the decisions its own batch is
      # judged by, so the copies from `main` are pinned here, before the
      # first PR is merged in, and everything below loads those.
      - name: Pin queue tooling from main
        shell: bash
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/queue-tools"
          mkdir -p "$tools"
          cp tools/merge/decisions.cjs tools/merge/batch.cjs scripts/dev/merge-gates.sh "$tools/"
          echo "QUEUE_TOOLS=${tools}" >> "$GITHUB_ENV"
          echo "BATCH_RESULT=${RUNNER_TEMP}/batch.json" >> "$GITHUB_ENV"

      # The gates need uv; installing it is seconds, and deciding
      # whether a pass will need it would mean knowing the batch first.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { version: "0.13.1" }

      # ─────────────────────────────────────────────────────────────
      # BUILD + GATE — the assertion the design rests on
      # ─────────────────────────────────────────────────────────────
      - name: Build and gate the batch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MAIN_TIP: ${{ needs.select.outputs.main }}
          PRS: ${{ needs.select.outputs.prs }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { runBatch, gitOps } = require(`${process.env.QUEUE_TOOLS}/batch.cjs`);
            const { owner, repo } = context.repo;
            const base = process.env.MAIN_TIP;
            const out = process.env.BATCH_RESULT;

            // Has `main` moved since Select resolved it? Ask BEFORE
            // paying for gates: every merge below must land on this
            // exact tip, so a batch built on an old one is doomed. The
            // merge step sees `stale` and hands the work to a new pass.
            const { data: now } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main',
            });
            if (now.commit.sha !== base) {
              core.warning(
                `main moved to ${now.commit.sha} since Select resolved ${base} — not building this batch.`,
              );
              fs.writeFileSync(out, JSON.stringify({
                base, stale: true, merge: [], dropped: [], bad: [], steps: [],
                finalTree: null, gated: false, gateRuns: 0, fastPath: null,
              }));
              return;
            }

            // Matched on PATH, never on name. A display name renames;
            // the file does not.
            const ciConclusion = async (head) => {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: head, per_page: 100,
              });
              const ci = runs.data.workflow_runs.find(
                (r) => r.path === '.github/workflows/ci.yml' && r.status === 'completed',
              );
              return ci?.conclusion ?? null;
            };

            const result = await runBatch({
              base,
              candidates: JSON.parse(process.env.PRS),
              ops: gitOps({
                cwd: process.env.GITHUB_WORKSPACE,
                base,
                gatesScript: `${process.env.QUEUE_TOOLS}/merge-gates.sh`,
                failFile: path.join(process.env.RUNNER_TEMP, 'merge-gates.failed'),
                ciConclusion,
              }),
              log: (line) => core.info(line),
            });
            fs.writeFileSync(out, JSON.stringify(result, null, 2));

            for (const d of result.dropped) {
              core.warning(`#${d.n}: ${d.reason} — not in this batch.`);
            }
            for (const b of result.bad) {
              core.warning(`#${b.n}: gate '${b.gate}' failed — not merging.`);
            }
            core.notice(
              `batch on ${base.slice(0, 7)}: merge [${result.merge.map((m) => '#' + m.n).join(', ')}]` +
              ` — ${result.gated ? `${result.gateRuns} gate run(s)` : 'gates skipped'}` +
              `, ${result.bad.length} bad, ${result.dropped.length} dropped`,
            );

      # ─────────────────────────────────────────────────────────────
      # MERGE — re-assert freshness before every squash, then merge.
      # ─────────────────────────────────────────────────────────────
      # Mint a short-lived installation token from the hermes-automation
      # GitHub App. Commits + merges made with this token are attributed
      # to the App (not github-actions[bot]), which means downstream CI
      # runs are NOT held in GitHub's `action_required` loop-prevention
      # gate. Also means the squash-merge commit on main shows a clean
      # App identity rather than a synthetic bot. Falls back to
      # GITHUB_TOKEN if the App is unset (e.g., in forks). Minted after
      # the gates, not before: the token is short-lived and a red batch
      # can bisect for a while.
      - name: Mint App token
        id: app-token
        if: vars.HERMES_AUTOMATION_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HERMES_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.HERMES_AUTOMATION_APP_KEY }}

      - name: Merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # Only ever true on manual dispatch — every automatic trigger
          # leaves this empty, so the real path cannot be disabled by
          # accident.
          DRY_RUN: ${{ inputs.dry_run }}
          # The default GITHUB_TOKEN — has `issues: write` from the job's
          # `permissions:` block. Used by the belt-and-suspenders block
          # below because the App token used for `pulls.merge` does NOT
          # have Issues:Read+Write at App-install time (v3 fix — see #261).
          WORKFLOW_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const fs = require('fs');
            const {
              shouldMerge, ciRestart, afterMerge, badComment, hasBadComment, GATES_FAILED_LABEL,
              ALERTS_LABEL, alertComment,
              classifyMergeFailure, handMergeComment, HAND_MERGE_LABEL,
              branchRefPath, classifyBranchDelete,
            } = require(`${process.env.QUEUE_TOOLS}/decisions.cjs`);
            const { owner, repo } = context.repo;
            const batch = JSON.parse(fs.readFileSync(process.env.BATCH_RESULT, 'utf8'));
            const dryRun = process.env.DRY_RUN === 'true';

            // ─────────────────────────────────────────────
            // Belt-and-suspenders issue close (v3 — 2026-08-26).
            //
            // GitHub's built-in auto-close SHOULD fire when a PR with
            // "Closes #N" / "Fixes #N" / "Resolves #N" in its body
            // merges into the default branch. In practice, THREE
            // separate failure modes each leave issues open:
            //
            //   1. When merges happen via `pulls.merge` API from a
            //      workflow, GitHub's auto-close hook does not fire.
            //      (Observed 2026-08-25 on PRs #227, #229.)
            //
            //   2. `closingIssuesReferences` (GraphQL) is populated
            //      by an ASYNCHRONOUS indexer. At merge time — often
            //      seconds after the PR was opened — the index is
            //      still empty even when the body clearly contains
            //      `Closes #N`. Querying moments later returns the
            //      linkage correctly. (Observed 2026-08-26 on PRs
            //      #236, #237, #241, #243, #244, #246 — v1 of this
            //      block ran but `linked.length === 0` every time,
            //      silent no-op.)
            //
            //   3. The App token used for `pulls.merge` (from
            //      `actions/create-github-app-token`) does NOT have
            //      Issues:Read+Write at App-install time. `issues.update`
            //      fails with "Resource not accessible by integration".
            //      Meanwhile the workflow's `permissions: issues: write`
            //      grants the scope ONLY to the default `GITHUB_TOKEN`,
            //      NOT to the App token. (Observed 2026-08-26 on PRs
            //      #250/#252/#254/#256 — v2 body-regex found the linked
            //      issues but the close call failed silently in the
            //      per-issue catch block.)
            //
            // Fix (v3): union GraphQL + body-regex sources (v2 logic
            // preserved) AND use `github.token` (via `WORKFLOW_TOKEN`
            // env) for the `issues.update` + `issues.createComment`
            // calls. The merge itself keeps the App token (needs it to
            // bypass branch protection).
            //
            // Related: #232 (v1 explicit close), #247 (v2 body-regex),
            // #261 (v3 token split), #267 (v4 fetch instead of require).
            //
            // v4 note: v3 tried `require('@actions/github').getOctokit(...)`
            // but the `actions/checkout@v7 with sparse-checkout: tools/merge`
            // step leaves the workspace with NO `node_modules`, so
            // `require('@actions/github')` fails with MODULE_NOT_FOUND —
            // and the crash killed everything after `pulls.merge`
            // (including the delete-ref + hand-dispatch steps). v4 uses
            // Node 20+'s built-in `fetch()` against GitHub's REST API
            // directly — no require, no Octokit, no bundle dependency.
            // The same helpers post the bad-PR comments, for the same
            // token reason.
            // ─────────────────────────────────────────────
            const ghApiHeaders = {
              'Authorization': `Bearer ${process.env.WORKFLOW_TOKEN}`,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'hermes-merge-queue/v4',
            };
            const ghApiBase = `https://api.github.com/repos/${owner}/${repo}`;
            async function issueState(n) {
              const res = await fetch(`${ghApiBase}/issues/${n}`, { headers: ghApiHeaders });
              if (!res.ok) {
                throw new Error(`GET issue #${n}: ${res.status} ${await res.text()}`);
              }
              const body = await res.json();
              return body.state; // 'open' | 'closed'
            }
            async function closeIssue(n) {
              const res = await fetch(`${ghApiBase}/issues/${n}`, {
                method: 'PATCH',
                headers: { ...ghApiHeaders, 'Content-Type': 'application/json' },
                body: JSON.stringify({ state: 'closed', state_reason: 'completed' }),
              });
              if (!res.ok) {
                throw new Error(`PATCH issue #${n}: ${res.status} ${await res.text()}`);
              }
            }
            async function addLabel(n, label) {
              const res = await fetch(`${ghApiBase}/issues/${n}/labels`, {
                method: 'POST',
                headers: { ...ghApiHeaders, 'Content-Type': 'application/json' },
                body: JSON.stringify({ labels: [label] }),
              });
              if (!res.ok) {
                throw new Error(`POST labels #${n}: ${res.status} ${await res.text()}`);
              }
            }
            // Dispatch with the workflow token, which holds `actions:
            // write`; the App token used for pulls.merge does not, and
            // GitHub answered "Resource not accessible by integration".
            async function dispatch(workflow) {
              const res = await fetch(`${ghApiBase}/actions/workflows/${workflow}/dispatches`, {
                method: 'POST',
                headers: { ...ghApiHeaders, 'Content-Type': 'application/json' },
                body: JSON.stringify({ ref: 'main' }),
              });
              if (!res.ok) {
                throw new Error(`dispatch ${workflow}: ${res.status} ${await res.text()}`);
              }
            }
            // One open issue labelled merge-queue:alerts collects every
            // red head, so a watcher follows one thread instead of every PR.
            async function postAlert(bad, base) {
              try {
                const listing = await fetch(
                  `${ghApiBase}/issues?state=open&labels=${encodeURIComponent(ALERTS_LABEL)}&per_page=1`,
                  { headers: ghApiHeaders },
                );
                let [issue] = listing.ok ? await listing.json() : [];
                if (!issue) {
                  const created = await fetch(`${ghApiBase}/issues`, {
                    method: 'POST',
                    headers: { ...ghApiHeaders, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      title: 'Merge queue alerts',
                      labels: [ALERTS_LABEL],
                      body: 'The merge queue comments here whenever a PR head fails its gates.',
                    }),
                  });
                  if (!created.ok) {
                    throw new Error(`create alerts issue: ${created.status} ${await created.text()}`);
                  }
                  issue = await created.json();
                }
                const pr = await fetch(`${ghApiBase}/pulls/${bad.n}`, { headers: ghApiHeaders });
                const ref = pr.ok ? (await pr.json()).head.ref : '?';
                await commentIssue(issue.number, alertComment({ ...bad, ref, base }).body);
                core.info(`#${bad.n}: alert posted to #${issue.number}`);
              } catch (err) {
                core.warning(`#${bad.n}: could not post the alert: ${err.message}`);
              }
            }
            async function commentIssue(n, text) {
              const res = await fetch(`${ghApiBase}/issues/${n}/comments`, {
                method: 'POST',
                headers: { ...ghApiHeaders, 'Content-Type': 'application/json' },
                body: JSON.stringify({ body: text }),
              });
              if (!res.ok) {
                throw new Error(`POST comment #${n}: ${res.status} ${await res.text()}`);
              }
            }
            async function listComments(n) {
              const all = [];
              for (let page = 1; ; page += 1) {
                const res = await fetch(
                  `${ghApiBase}/issues/${n}/comments?per_page=100&page=${page}`,
                  { headers: ghApiHeaders },
                );
                if (!res.ok) {
                  throw new Error(`GET comments #${n}: ${res.status} ${await res.text()}`);
                }
                const chunk = await res.json();
                all.push(...chunk);
                if (chunk.length < 100) {
                  return all;
                }
              }
            }

            async function closeLinkedIssues(number, pr) {
              const closableIssues = new Set();
              try {
                const graphqlResult = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        closingIssuesReferences(first: 20) {
                          nodes { number state }
                        }
                      }
                    }
                  }
                `, { owner, repo, number });
                const linked = graphqlResult.repository.pullRequest
                  .closingIssuesReferences.nodes;
                for (const issue of linked) {
                  if (issue.state !== 'CLOSED') { closableIssues.add(issue.number); }
                }
                core.info(
                  `#${number}: closingIssuesReferences returned ${linked.length} nodes` +
                  ` (${closableIssues.size} still open)`,
                );
              } catch (err) {
                core.warning(`#${number}: closingIssuesReferences query failed: ${err.message}`);
              }

              // Body-regex fallback — works even when GitHub's async
              // indexer has not yet populated closingIssuesReferences.
              // Matches: Close(s|d), Fix(es|ed), Resolve(s|d).
              const bodyText = pr.body || '';
              const bodyMatches = [
                ...bodyText.matchAll(
                  /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi,
                ),
              ].map((m) => Number(m[1]));
              if (bodyMatches.length > 0) {
                core.info(
                  `#${number}: PR body regex found closing references: ` +
                  `#${bodyMatches.join(', #')}`,
                );
                for (const n of bodyMatches) { closableIssues.add(n); }
              }

              for (const issueNumber of closableIssues) {
                try {
                  const state = await issueState(issueNumber);
                  if (state === 'closed') {
                    core.info(`#${number}: linked issue #${issueNumber} already closed — skip`);
                    continue;
                  }
                  await closeIssue(issueNumber);
                  await commentIssue(
                    issueNumber,
                    `Closed by #${number} via merge queue (belt-and-suspenders; GitHub auto-close did not fire).`,
                  );
                  core.info(`#${number}: closed linked issue #${issueNumber}`);
                } catch (err) {
                  core.warning(
                    `#${number}: failed to close linked issue #${issueNumber}: ${err.message}`,
                  );
                }
              }
            }

            // ─────────────────────────────────────────────
            // The merge loop. Every squash lands on top of the previous
            // one, so `main` must be EXACTLY the batch base before the
            // first and exactly the previous squash before each later
            // one. Any other tip means something outside this pass
            // merged, and the rest of the batch was validated against
            // a `main` that no longer exists.
            //
            // Any refusal stops the loop, not just a moved `main`: the
            // later PRs were gated WITH this one underneath, so landing
            // them without it would land a tree nothing checked. The
            // next pass rebuilds from whatever did land.
            // ─────────────────────────────────────────────
            let expectedBase = batch.base;
            let lastSha = null;
            const merged = [];
            let stopped = batch.stale ? 'main moved before the batch was built' : null;
            let fatal = null;

            if (dryRun) {
              for (const { n } of batch.merge) {
                core.notice(`DRY RUN — would merge #${n} on top of ${batch.base.slice(0, 7)} + the PRs before it.`);
              }
              core.notice('DRY RUN — stopping before pulls.merge; nothing commented, nothing dispatched.');
            }

            for (const { n: number, head } of dryRun ? [] : batch.merge) {
              const { data: base } = await github.rest.repos.getBranch({
                owner, repo, branch: 'main',
              });
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: number,
              });
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: number, per_page: 100,
              });

              const verdict = shouldMerge({
                testedBase: expectedBase,
                currentBase: base.commit.sha,
                testedHead: head,
                currentHead: pr.head.sha,
                state: pr.state,
                draft: pr.draft,
                mergeable: pr.mergeable,
                mergeableState: pr.mergeable_state,
                reviews,
              });

              if (!verdict.merge) {
                core.warning(`#${number}: ${verdict.reason} — stopping this pass here.`);
                stopped = verdict.reason;
                break;
              }

              // No branch update, ever (#413). The ruleset does not
              // require up-to-date branches, so GitHub accepts a merge of
              // a head that is behind main. The tree that lands was
              // proven by the gates on this exact base, not by the PR's
              // own CI run.
              try {
                const { data } = await github.rest.pulls.merge({
                  owner, repo, pull_number: number,
                  merge_method: 'squash',
                  commit_title: `${pr.title} (#${number})`,
                  // Pass the PR body as commit_message so GitHub's issue
                  // auto-close mechanism sees any `Closes #N` / `Fixes #N`
                  // / `Resolves #N` trailers. Observed 2026-08-25: PRs
                  // that merged via this queue with `Closes #N` in the
                  // rendered body (from openspec issue.md) did NOT
                  // auto-close their referenced issues — the earlier
                  // "omit commit_message to inherit commit-message
                  // trailers" strategy failed because our render-pr-body
                  // path puts Closes in the PR body, not in individual
                  // commit messages. Passing pr.body explicitly closes
                  // that gap. Empty body → GitHub uses commit messages
                  // (falls back to prior behavior). See issue #224.
                  commit_message: pr.body || '',
                  sha: head,
                });
                lastSha = data.sha;
                expectedBase = data.sha;
                merged.push(number);
                core.notice(`#${number} merged as ${data.sha} — part of the batch on ${batch.base.slice(0, 7)}`);
              } catch (err) {
                // Log the FULL error body so we can diagnose without
                // guessing. Prior versions swallowed the message and left
                // "GH refused merge (405)" with no context — useless.
                const detail = err.response?.data?.message || err.message || String(err);
                const docs = err.response?.data?.documentation_url || '';
                core.warning(
                  `#${number}: pulls.merge failed status=${err.status} — "${detail}" ${docs}`,
                );
                // Every failure stops this pass (later PRs were gated with
                // this one underneath). A PR GitHub will never let the
                // queue merge is labelled for a human, so the next pass
                // rebuilds without it instead of tripping on it again.
                const failure = classifyMergeFailure({ status: err.status, message: detail });
                stopped = `pulls.merge refused #${number}: ${failure.reason}`;
                if (failure.label) {
                  try {
                    await addLabel(number, HAND_MERGE_LABEL);
                    await commentIssue(number, handMergeComment({ n: number, reason: failure.reason }).body);
                    core.notice(`#${number}: handed to a human — ${failure.reason}`);
                  } catch (labelErr) {
                    core.warning(`#${number}: could not label for a human merge: ${labelErr.message}`);
                  }
                }
                if (failure.fatal) {
                  fatal = err;
                }
                break;
              }

              await closeLinkedIssues(number, pr);

              // Delete the head branch. The repo's `delete_branch_on_merge`
              // usually beats us to it, so "no such ref" is fine, but only
              // once a read confirms the branch is gone (#490:
              // a mis-encoded path also answered 422 and left it behind).
              // Literal paths: Octokit would encode the slashes in `ref`.
              if (pr.head.repo?.full_name === `${owner}/${repo}`) {
                const branch = pr.head.ref;
                let deleteStatus;
                let refStillExists;
                try {
                  const res = await github.request(`DELETE /repos/${owner}/${repo}/${branchRefPath('refs', branch)}`);
                  deleteStatus = res.status;
                } catch (err) {
                  deleteStatus = err.status;
                }
                if (deleteStatus !== 204) {
                  try {
                    await github.request(`GET /repos/${owner}/${repo}/${branchRefPath('ref', branch)}`);
                    refStillExists = true;
                  } catch (err) {
                    refStillExists = err.status === 404 ? false : undefined;
                  }
                }
                const del = classifyBranchDelete({ deleteStatus, refStillExists });
                const line = `#${number}: branch ${branch} ${del.reason}`;
                if (del.outcome === 'failed') {
                  core.warning(line);
                } else {
                  core.info(line);
                }
              }
            }

            // ─────────────────────────────────────────────
            // Tell each bad PR, once per head, which gate failed.
            // ─────────────────────────────────────────────
            for (const bad of dryRun ? [] : batch.bad) {
              // Red on the PR page and labelled, so the writer sees it at
              // once and Select stops re-gating this head.
              try {
                await addLabel(bad.n, GATES_FAILED_LABEL);
                const res = await fetch(`${ghApiBase}/statuses/${bad.head}`, {
                  method: 'POST',
                  headers: { ...ghApiHeaders, 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    state: 'failure',
                    context: 'Merge queue gates',
                    description: `${bad.gate}`.slice(0, 140),
                  }),
                });
                if (!res.ok) {
                  throw new Error(`POST status: ${res.status} ${await res.text()}`);
                }
              } catch (err) {
                core.warning(`#${bad.n}: could not label or mark red: ${err.message}`);
              }
              try {
                if (hasBadComment(await listComments(bad.n), bad.head)) {
                  core.info(`#${bad.n}: already told head ${bad.head.slice(0, 7)} it failed — skip`);
                  continue;
                }
                const { body } = badComment({
                  n: bad.n, head: bad.head, gate: bad.gate, base: batch.base,
                });
                await commentIssue(bad.n, body);
                core.info(`#${bad.n}: commented that gate '${bad.gate}' failed`);
                await postAlert(bad, batch.base);
              } catch (err) {
                core.warning(`#${bad.n}: could not comment: ${err.message}`);
              }
            }

            // ─────────────────────────────────────────────
            // Hand-dispatch what our own push cannot: a token push
            // raises no events, so these merges produce no
            // `workflow_run` for `main` and no `push` to wake the next
            // pass of THIS workflow.
            //
            // CI on main is decided by `ciRestart`: skip when `main`
            // now holds the byte-identical tree the batch validated.
            // A loop that stopped part-way leaves a different tree, so
            // CI runs.
            // ─────────────────────────────────────────────
            if (lastSha !== null) {
              let mainTree = null;
              try {
                const { data: mergedCommit } = await github.rest.git.getCommit({
                  owner, repo, commit_sha: lastSha,
                });
                mainTree = mergedCommit.tree.sha;
              } catch (err) {
                core.info(`could not read merged commit tree: ${err.message}`);
              }

              const restart = ciRestart({
                mergedTree: mainTree,
                validatedTree: batch.finalTree || null,
              });
              core.info(`ci restart on main: ${restart.restart ? 'YES' : 'no'} — ${restart.reason}`);

              if (restart.restart) {
                try {
                  await dispatch('ci.yml');
                  core.info('dispatched ci.yml on main');
                } catch (err) {
                  core.warning(`could not dispatch ci.yml: ${err.message}`);
                }
              }
            }

            const next = afterMerge({
              dryRun, merged: merged.length, stoppedEarly: stopped !== null,
            });
            core.info(`next pass: ${next.redispatch ? 'dispatching' : 'not dispatching'} — ${next.reason}`);
            if (next.redispatch) {
              try {
                await dispatch('merge-queue.yml');
                core.info('dispatched merge-queue.yml for the next pass');
              } catch (err) {
                core.warning(`could not dispatch merge-queue.yml: ${err.message}`);
              }
            }

            if (fatal !== null) {
              throw fatal;
            }
            // Red, like the single-PR queue was when its gates failed:
            // a bad PR is something a human should see on the run list.
            if (batch.bad.length > 0) {
              core.setFailed(
                `gates failed for ${batch.bad.map((b) => `#${b.n} (${b.gate})`).join(', ')}`,
              );
            }
