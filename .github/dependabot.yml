# Dependabot version updates.
#
# The clustered CI workflow pins every GitHub Action to a commit SHA rather
# than a floating tag (a moved tag is arbitrary code execution holding our
# GITHUB_TOKEN). But a pin without maintenance is not security — it is
# freezing: the pinned SHA never picks up the next advisory fix. Dependabot
# makes pinning sustainable by raising the SHA and updating the trailing
# version comment together.
#
# Two ecosystems: Python (pip) via `pyproject.toml`, and GitHub Actions.
version: 2

updates:
  # ────────────────────────────────────────────────────────────────
  # Python dependencies (uv-managed lockfile via pyproject.toml)
  # ────────────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    # 10 leaves headroom for a busy week (patch group + 3-4 individual
    # minor bumps + a security fix) without letting the queue explode
    # into a rubber-stamp firehose.
    open-pull-requests-limit: 10

    # A brand-new version is the least-reviewed version there is. A package
    # published minutes ago can be malicious or simply broken; this config
    # schedules updates for 06:00 Monday, so anything published over a
    # weekend would arrive before anyone else had looked at it.
    #
    # Seven days is the window in which a compromised release is typically
    # yanked. Costs nothing on a weekly cadence.
    cooldown:
      default-days: 7

    labels:
      - 'type:chore'
      - 'area:tooling'
    assignees:
      - 'rafo-claude-bot'
    reviewers:
      - 'ricardoafo'

    commit-message:
      # Prod deps → `chore(deps): ...`; dev-group entries → `chore(deps-dev):
      # ...` (dependabot swaps `prefix` for `prefix-development` when the
      # PR only touches dev-group packages). Matches
      # docs/decisions/2026-08-24-dependency-upgrade-checklist.md.
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: scope

    # One weekly PR per ecosystem (CI/CD consolidation, Rick's call on
    # 2026-10-03): every version update, patch to major, lands in a single
    # grouped PR that goes through the same CI and merge queue as any other
    # and still needs Rick's approval. Read each bump's changelog in that PR
    # (docs/decisions/2026-08-24-dependency-upgrade-checklist.md). Security
    # updates are not grouped: each advisory fix opens its own PR at once.
    groups:
      weekly:
        applies-to: version-updates
        patterns: ['*']

  # ────────────────────────────────────────────────────────────────
  # GitHub Actions — keeps the SHA pins alive
  # ────────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 10

    cooldown:
      default-days: 7

    labels:
      - 'type:ci'
      - 'area:tooling'
    assignees:
      - 'rafo-claude-bot'
    reviewers:
      - 'ricardoafo'

    commit-message:
      prefix: 'ci(deps)'
      include: scope

    # Same as pip: one grouped weekly PR; security updates stay separate.
    groups:
      weekly:
        applies-to: version-updates
        patterns: ['*']
