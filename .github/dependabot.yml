# Dependabot version updates.
#
# The clustered CI workflow pins every GitHub Action to a commit SHA rather
# than a floating tag (a moved tag is arbitrary code execution holding our
# GITHUB_TOKEN). But a pin without maintenance is not security — it is
# freezing: the pinned SHA never picks up the next advisory fix. Dependabot
# makes pinning sustainable by raising the SHA and updating the trailing
# version comment together.
#
# Two ecosystems: Python (uv) via `pyproject.toml` + `uv.lock`, and GitHub
# Actions.
version: 2

updates:
  # ────────────────────────────────────────────────────────────────
  # Python dependencies (uv-managed lockfile via pyproject.toml)
  # ────────────────────────────────────────────────────────────────
  # `uv`, not `pip`: the pip ecosystem rewrites pyproject.toml and leaves
  # uv.lock alone, so every PR failed CI's `uv sync --frozen` (#579).
  - package-ecosystem: uv
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    # 10 leaves headroom for a busy week (patch group + 3-4 individual
    # minor bumps + a security fix) without letting the queue explode
    # into a rubber-stamp firehose.
    open-pull-requests-limit: 10

    # A brand-new version is the least-reviewed version there is. A package
    # published minutes ago can be malicious or simply broken; this config
    # schedules updates for 06:00 Monday, so anything published over a
    # weekend would arrive before anyone else had looked at it.
    #
    # Seven days is the window in which a compromised release is typically
    # yanked. Costs nothing on a weekly cadence.
    cooldown:
      default-days: 7

    labels:
      - 'type:chore'
      - 'area:tooling'
    assignees:
      - 'rafo-claude-bot'
    reviewers:
      - 'ricardoafo'

    commit-message:
      # Prod deps → `chore(deps): ...`; dev-group entries → `chore(deps-dev):
      # ...`. `include: scope` adds the `(deps)` / `(deps-dev)` itself, so
      # the prefix carries no scope; `chore(deps)` here produced
      # `chore(deps)(deps):`, which the PR-title check rejects (#579).
      # Matches docs/decisions/2026-08-24-dependency-upgrade-checklist.md.
      prefix: 'chore'
      include: scope

    # One weekly PR per ecosystem (CI/CD consolidation, Rick's call on
    # 2026-10-03): every version update, patch to major, lands in a single
    # grouped PR that goes through the same CI and merge queue as any other
    # and still needs Rick's approval. Read each bump's changelog in that PR
    # (docs/decisions/2026-08-24-dependency-upgrade-checklist.md). Security
    # updates are not grouped: each advisory fix opens its own PR at once.
    groups:
      weekly:
        applies-to: version-updates
        patterns: ['*']

  # ────────────────────────────────────────────────────────────────
  # GitHub Actions — keeps the SHA pins alive
  # ────────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 10

    cooldown:
      default-days: 7

    labels:
      - 'type:ci'
      - 'area:tooling'
    assignees:
      - 'rafo-claude-bot'
    reviewers:
      - 'ricardoafo'

    commit-message:
      # `include: scope` adds `(deps)`: the title reads `ci(deps): ...`.
      prefix: 'ci'
      include: scope

    # Same as uv: one grouped weekly PR; security updates stay separate.
    groups:
      weekly:
        applies-to: version-updates
        patterns: ['*']

  # ────────────────────────────────────────────────────────────────
  # pre-commit hook revisions and the runner image's Docker bases
  # ────────────────────────────────────────────────────────────────
  # Rick 2026-10-06: every tool on its latest stable release (#906).
  # Pins Dependabot cannot see (Dockerfile ARGs, the VPS bootstrap,
  # versions inside workflow steps) are reported weekly by
  # scripts/dev/freshness-check.py in the Scheduled workflow.
  - package-ecosystem: pre-commit
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - 'type:chore'
      - 'area:tooling'
    assignees:
      - 'rafo-claude-bot'
    reviewers:
      - 'ricardoafo'
    commit-message:
      prefix: 'chore'
      include: scope
    groups:
      weekly:
        applies-to: version-updates
        patterns: ['*']

  # Runner image base (Dockerfile FROM) and the Docker-in-Docker sidecar
  # (compose.yml image). A new image only reaches CI when Rick rebuilds
  # the runners, so these PRs change files, not the running machines.
  - package-ecosystem: docker
    directory: '/scripts/dev/gh-runner'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # The runner image tracks Ubuntu LTS only. Interim releases get nine
    # months of support, so a bump to one leaves CI on an OS that loses
    # security updates within the year (PR #916 proposed 25.10).
    ignore:
      - dependency-name: 'ubuntu'
        versions: ['>= 26.10, < 28.04']
    labels:
      - 'type:ci'
      - 'area:tooling'
    assignees:
      - 'rafo-claude-bot'
    reviewers:
      - 'ricardoafo'
    commit-message:
      prefix: 'ci'
      include: scope
    groups:
      weekly:
        applies-to: version-updates
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: '/scripts/dev/gh-runner'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - 'type:ci'
      - 'area:tooling'
    assignees:
      - 'rafo-claude-bot'
    reviewers:
      - 'ricardoafo'
    commit-message:
      prefix: 'ci'
      include: scope
    groups:
      weekly:
        applies-to: version-updates
        patterns: ['*']
