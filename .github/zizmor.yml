# zizmor baseline (#529, burned down in #597). New findings fail
# `ci-checks.sh workflows`. Each entry below says why it stays.
rules:
  # merge-queue.yml: the Revalidate job runs batch code beside the write
  # token; splitting gate and merge jobs is issue #779, which removes
  # these four entries. Elsewhere every checkout sets
  # persist-credentials: false, except the branch-prune job, which pushes
  # and carries an inline ignore.
  artipacked:
    ignore:
      - merge-queue.yml
  github-app:
    ignore:
      - merge-queue.yml
  github-env:
    ignore:
      - merge-queue.yml
  # By design: workflow_run and pull_request_target run base-branch code
  # only; nothing from the PR head is checked out or executed.
  # cd.yml deploys only when CI succeeded on a push to main
  # (workflow_run.event == 'push'), so a PR's run never reaches it.
  dangerous-triggers:
    ignore:
      - cd.yml
      - merge-queue.yml
      - pr-housekeeping.yml
  # The suggested `$/...` form fails actionlint 1.7.12 (the pinned
  # version), which accepts only `./...` for a reusable workflow in the
  # same repository.
  self-repository:
    ignore:
      - cd.yml
