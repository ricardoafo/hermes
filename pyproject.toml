[project]
name = "hermes"
version = "1.0.0a1"
description = "Crypto trading engine — hexagonal, event-sourced, tax-compliant."
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Ricardo Afonso" }]
dependencies = [
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "structlog>=26.1.0,<27",
  "typer>=0.27.2,<1",
  "textual>=8.2.8,<9",
  # Console renderers import Rich directly (application/console/render.py);
  # promoted from a transitive dep of textual and typer so an upstream
  # constraint change cannot drop it. See openspec/changes/console-read-model.
  "rich>=15,<16",
  "apscheduler>=3.10,<4",
  "python-telegram-bot>=22.8,<23",
  # ULID generator for lot, journal and correlation IDs (issue #784 replaced
  # the unmaintained ulid-py). Approved by the Code Owner 2026-10-17.
  "python-ulid>=4.0.1,<5",
  "returns>=0.24,<1",
  "anyio>=4.15.1,<5",
  "pyyaml>=6,<7",
  # Loads .env.local at process start for local dev (systemd EnvironmentFile
  # in prod, GH Actions secrets in CI). See
  # docs/decisions/2026-08-23-credential-storage-layered-by-env.md.
  "python-dotenv>=1,<2",
  # Sentry SDK — error reporting. Initialized once at CLI startup via
  # hermes.infrastructure.sentry_integration.initialize(); after that the
  # SDK installs a global sys.excepthook + captures explicit
  # sentry_sdk.capture_exception() calls. No framework integrations enabled
  # (we run vanilla Python, no Django/Flask/etc.). See
  # docs/decisions/ (Sentry wiring entry) for the design rationale.
  "sentry-sdk>=2.71.0,<3",
  # Cross-platform file lock for multi-writer manifest transactions in
  # the ingest scripts (scripts/data/_manifest_util.py). Was a transitive
  # dep of virtualenv; promoted to direct after we started depending on
  # it explicitly. See docs/decisions/... and change data-manifest-file-lock (#257).
  "filelock>=4.0.7,<5",
  # Writes the tax pack's Renta Web sheet and dossier as PDF (#568, change
  # 568-tax-pack D-8). Pure Python; approved by the Code Owner 2026-10-04.
  "fpdf2>=2.8,<3",
  "textual-image>=0.14.1,<0.15",
  "textual-plotext>=1.0.1,<2",
]

[project.scripts]
hermes = "hermes.entrypoints.cli:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",  # bumped for PYSEC-2026-1845 fix (9.0.3+)
  "pytest-cov>=7.1.0,<8",  # --cov integration for pytest → coverage.py
  "pytest-xdist>=3.8.0,<4",
  # Fails a test that hangs past the pytest.ini_options `timeout` (default
  # 60s). Introduced by process-hardening wave 5 after slot-12 sub-agent
  # burned its entire token budget on a klines-fetcher rate-limiter test
  # that hit an unrelated float-drift infinite loop in production code
  # (fixed in PR #138). Without a timeout the runner produced no output —
  # sub-agent kept blaming test infra while a real production bug hung
  # silently. `timeout_method = "thread"` chosen over the signal default
  # for Windows compatibility (signals do not interrupt blocking C-level
  # calls on Windows the way they do on POSIX).
  "pytest-timeout>=2.3,<3",
  "hypothesis>=6.168.3,<7",
  "syrupy>=6.1.1,<7",  # bumped to unblock pytest 9 (see PYSEC-2026-1845 note above)
  "respx>=0.21,<1",
  "freezegun>=1.5,<2",
  "coverage[toml]>=7.16.2,<8",
  "ruff>=0.16.9,<1",
  "mypy>=2.3.1,<3",
  "import-linter>=2.15,<3",
  # safety dropped 2026-08-22: v3.7.0 requires interactive auth OR --key API key
  # (breaking change from pre-2024 flow), and the scan command crashes with a
  # click-context bug on our stack. pip-audit + Dependabot alerts + semgrep
  # cover the same ground without auth. See docs/decisions/ entry.
  "pip-audit>=2.7,<3",
  "cyclonedx-python-lib>=11.12.0,<12",
  "pre-commit>=4.6.2,<5",
  "radon>=6.0,<7",
  "vulture>=2.13,<3",
  "types-pyyaml>=6.0.12.20260906,<7",
  # Mutation testing — parso-backed (Python 3.14 native). See
  # docs/decisions/2026-08-22-mutation-testing-cosmic-ray.md for the
  # tool-choice rationale + spike evidence. Weekly workflow at
  # .github/workflows/scheduled.yml (Sunday leg).
  "cosmic-ray>=8.7,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["src/hermes/**/__init__.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PL", "RUF", "S", "PTH", "ERA", "PGH", "D", "FURB", "PERF"]
ignore = [
  "PLR0913",  # arg count — hexagonal use cases take many ports
  # Decimal("100") over Decimal(100): every money literal stays a string, so a
  # fractional amount never slips in as a float-built Decimal next to it.
  "FURB157",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", "PLR2004", "PLR0917",  # assert + magic numbers + many-arg property tests fine
  # A test whose only assertion is `x is None` fails the no-vague-test-assertions
  # hook; `type(x) is type(None)` is how such a test states "returns nothing".
  "FURB169",
]
# D-family docstring enforcement is TEST-SCOPED for this PR (see docs/guides/ai-authored-tests.md
# §"Enforcement in this repo"). Production src has variable docstring coverage; a global roll-out
# is a separate scope conversation. Test files must expose D103 (missing docstring on public fn)
# so every test names the invariant it protects.
"src/**/*.py" = ["D"]
"scripts/**/*.py" = ["D", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "S310"]
# Domain errors intentionally omit the "Error" suffix — CurrencyMismatch and
# InvalidLot read more naturally as domain concepts than CurrencyMismatchError.
# The layer + hierarchy (DomainError base) make the exception nature clear.
"src/hermes/domain/errors.py" = ["N818"]
# InsufficientInventory follows the same convention — it is a domain concept
# and the DomainError base already carries the exception nature.
"src/hermes/domain/lots/selection.py" = ["N818"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
packages = ["hermes"]
exclude = ["build/", "dist/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  # Tiers are selected by directory (tests/unit/, tests/integration/, ...), not by
  # marker. Where each tier runs: docs/guides/test-tiers.md. Markers are labels,
  # except `contract` and `smoke`, which CI selects with -m.
  "smoke: post-deploy smoke tests; selected with -m smoke by the CD job",
  "unit: label for a pure unit test; not used for selection",
  "property: label for a Hypothesis property test; not used for selection",
  "integration: label for an integration test; not used for selection",
  "chaos: fault-injection test (crash mid-write, storage, clock); runs in the integration tier",
  # Contract tests are skipped by default via the `-m 'not contract'` addopts
  # filter. The daily scheduled.yml job runs `pytest tests/contract -m contract`
  # (see docs/decisions/2026-08-23-contract-test-tier.md).
  "contract: real HTTP against third-party sandbox APIs; run daily by scheduled.yml",
  "mutation: registered, no test uses it; mutation runs through cosmic-ray (cosmic-ray.toml)",
  "e2e: end-to-end serve cycle on recorded bars (tests/e2e/); PR CI (ci.yml) and the CD gate",
  "slow: >1s per test",
]
addopts = "-ra --strict-markers --strict-config -m 'not contract'"
# pytest-timeout: default per-test wall clock cap. 60s is generous —
# unit tests finish in milliseconds; anything slower is a smell. Overrides
# per-test with `@pytest.mark.timeout(N)` (see
# docs/guides/ai-authored-tests.md § Hypothesis and timeouts).
# thread method chosen over the signal default because signals do not
# interrupt blocking C-level calls on Windows the way they do on POSIX.
timeout = 60
timeout_method = "thread"

# filterwarnings — surface deprecated APIs as HARD test failures so we
# discover them at PR time (not at "the day the library removed the API").
# Dependency-review discipline: `pytest -W error::DeprecationWarning` is
# one of the automated checks in docs/decisions/2026-08-24-dependency-
# upgrade-checklist.md; enabling it as pytest config makes every unit run
# enforce it, not just an ad-hoc CI leg.
#
# When a third-party library trips this and we cannot fix it (upstream
# hasn't shipped the migration yet, or the fix is behind a major bump we
# haven't accepted), add a targeted `ignore::DeprecationWarning:<module>`
# line WITH A COMMENT explaining WHY + a link to the upstream tracking
# issue. Never a bare `default::DeprecationWarning` — that silences the
# whole class and defeats the discipline.
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  # Unclosed connections/files are real leaks (#759); GC-time warnings
  # surface as unraisable exceptions, so both must fail the run.
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
  # Third-party warnings we cannot fix — allow with a comment explaining why:
  # (add exceptions here as they surface, with justification + upstream link)
]

[tool.coverage.run]
source = ["src/hermes"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@abstractmethod",
  "raise NotImplementedError",
]

[tool.importlinter]
root_packages = ["hermes"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain-is-pure"
type = "forbidden"
source_modules = ["hermes.domain"]
forbidden_modules = [
  "hermes.application", "hermes.ports", "hermes.adapters",
  "hermes.infrastructure", "hermes.entrypoints",
]

[[tool.importlinter.contracts]]
name = "application-imports-only-domain-and-ports"
type = "forbidden"
source_modules = ["hermes.application"]
forbidden_modules = ["hermes.adapters", "hermes.infrastructure", "hermes.entrypoints"]

[[tool.importlinter.contracts]]
name = "adapters-never-import-entrypoints"
type = "forbidden"
source_modules = ["hermes.adapters"]
forbidden_modules = ["hermes.entrypoints"]

# change trade-eur-values D-3: EUR ledger values are measurement only. Strategy,
# sizing, fees, risk and kill rules keep reading native (USDT) values.
[[tool.importlinter.contracts]]
name = "eur-values-are-measurement-only"
type = "forbidden"
source_modules = [
  "hermes.application.order_router",
  "hermes.application.strategy_protocol",
  "hermes.domain.strategy",
  "hermes.domain.fees",
  "hermes.domain.risk",
]
forbidden_modules = [
  "hermes.application.ledger",
  "hermes.domain.fx.eur_pricing",
  "hermes.domain.lots.eur_fifo",
  "hermes.domain.trading.trade_record",
]

# change tax-estimates D-7: tax figures are measurement only (ADR-016 decision 9).
# Strategy, sizing, signals, risk, fees, kill rules and the tax guard never read them.
[[tool.importlinter.contracts]]
name = "tax-is-measurement-only"
type = "forbidden"
source_modules = [
  "hermes.application.order_router",
  "hermes.application.strategy_protocol",
  "hermes.application.tax_guard",
  "hermes.domain.strategy",
  "hermes.domain.fees",
  "hermes.domain.risk",
]
forbidden_modules = [
  "hermes.application.tax",
  "hermes.domain.tax",
]

# change 36-modelo-100-721 D-10: tax-filing figures are measurement only, like
# the EUR values they read. Nothing that decides trades may import them.
[[tool.importlinter.contracts]]
name = "filing-is-measurement-only"
type = "forbidden"
source_modules = [
  "hermes.application.order_router",
  "hermes.application.strategy_protocol",
  "hermes.domain.strategy",
  "hermes.domain.fees",
  "hermes.domain.risk",
]
forbidden_modules = [
  "hermes.application.filing",
  "hermes.domain.filing",
  "hermes.ports.filing",
]

# ADR-012 D-08: the supervisor layer reads through read-only ports and
# projections only. It never reaches an exchange, an order path, the ledger's
# write port, the portfolio or the composition root (change 34-supervisor-read-tools).
[[tool.importlinter.contracts]]
name = "supervisor-is-read-only"
type = "forbidden"
source_modules = ["hermes.application.supervisor", "hermes.ports.supervisor"]
forbidden_modules = [
  "hermes.adapters",
  "hermes.entrypoints",
  "hermes.infrastructure",
  "hermes.ports.exchange",
  "hermes.ports.ledger",
  "hermes.ports.fill_model",
  "hermes.ports.notifier",
  "hermes.application.order_router",
  "hermes.application.ledger",
  "hermes.application.portfolio",
  "hermes.application.console",
  "hermes.domain.lots",
  "hermes.domain.trading",
  "hermes.domain.fx",
]

# change 713-live-ticker D-6: live ticker prices are display-only in the console.
# The engine, the ledger, the supervisor, briefs and notifications never import them.
[[tool.importlinter.contracts]]
name = "live-prices-are-console-only"
type = "forbidden"
source_modules = [
  "hermes.domain",
  "hermes.application.order_router",
  "hermes.application.strategy_protocol",
  "hermes.application.execution",
  "hermes.application.portfolio",
  "hermes.application.ledger",
  "hermes.application.supervisor",
  "hermes.application.notification_router",
  "hermes.application.signal_notifier",
  "hermes.application.messages",
  "hermes.application.bot",
  "hermes.ports.supervisor",
  "hermes.ports.notifier",
  "hermes.adapters.ledger",
  "hermes.adapters.notifier",
  "hermes.adapters.telegram_bot",
  "hermes.entrypoints.serve",
  "hermes.entrypoints.supervisor",
  "hermes.entrypoints.bot",
  "hermes.entrypoints.daily_line",
]
forbidden_modules = [
  "hermes.application.console.live",
  "hermes.ports.live_prices",
  "hermes.entrypoints.tui_live",
]

# Issue #835: the recorded RO-01 / RO-02 inputs (spread samples, pair
# correlation rows) are for review. Nothing that decides or sizes trades may
# read them; lifting this is a deliberate change. RO-01 runs on the
# correlation of 1D closes already delivered, computed in process by
# hermes.domain.portfolio.correlation in the backtest (issue #822) and in
# serve (issue #514), so that module is shared; RO-02 stays off in shadow
# (issue #514).
[[tool.importlinter.contracts]]
name = "risk-inputs-are-record-only"
type = "forbidden"
source_modules = [
  "hermes.application.execution",
  "hermes.application.order_router",
  "hermes.application.strategy_protocol",
  "hermes.application.portfolio",
  "hermes.domain.risk",
  "hermes.domain.strategy",
  "hermes.domain.fees",
  "hermes.domain.portfolio.snapshot",
]
forbidden_modules = [
  "hermes.application.risk_inputs",
  "hermes.ports.risk_inputs",
  "hermes.domain.market_data.spread_sample",
]

# The Logs screen shows the journal, which can hold money figures, to the
# operator only: nothing from it reaches an AI or a notification channel (#716).
# Direct imports only: the shared console widgets reach the Briefs screen's
# supervisor reader through hermes.application.console.views, and that read-only
# path is not a way for a journal line to leave.
[[tool.importlinter.contracts]]
name = "logs-screen-never-leaves-the-console"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
  "hermes.application.console.log_figures",
  "hermes.entrypoints.tui_logs",
]
forbidden_modules = [
  "hermes.adapters.notifier",
  "hermes.adapters.telegram_bot",
  "hermes.ports.notifier",
  "hermes.ports.supervisor",
  "hermes.application.supervisor",
  "hermes.application.notification_router",
  "hermes.application.signal_notifier",
]

[[tool.importlinter.contracts]]
name = "domain-no-pydantic"
type = "forbidden"
source_modules = ["hermes.domain"]
forbidden_modules = ["pydantic", "pydantic_settings"]

[[tool.importlinter.contracts]]
name = "domain-no-async-or-network"
type = "forbidden"
source_modules = ["hermes.domain"]
forbidden_modules = [
  "asyncio",
  "anyio",
  "httpx",
  "socket",
  "requests",
  "aiohttp",
  "urllib",
  "urllib3",
]

[tool.vulture]
min_confidence = 80
paths = ["src/hermes"]
exclude = ["src/hermes/ports/"]
